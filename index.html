  var _authReadyPromise=null;
  function waitAuthReady(){
    if(!auth) return Promise.resolve(null);
    if(_authReadyPromise) return _authReadyPromise;
    _authReadyPromise=new Promise(function(resolve){
      var settled=false;
      var unsub=auth.onAuthStateChanged(function(u){
        if(u){
          // 拿到真正登入的使用者，立刻採信、結束等待
          if(!settled){ settled=true; try{ unsub(); }catch(e){} resolve(u); }
        } else if(!settled){
          // 頁面剛載入時，Firebase有時會先送出一次「還不
          // 知道，暫時當沒登入」的過渡通知，過一下子才會
          // 補送正確的登入狀態——先別急著判定沒登入，等
          // 800毫秒看有沒有補送正確狀態進來，沒有的話才
          // 真的當作沒登入
          setTimeout(function(){
            if(!settled){ settled=true; try{ unsub(); }catch(e){} resolve(null); }
          }, 800);
        }
      });
    });
    return _authReadyPromise;
  }
  async function doLogin(){
    loginMsg.textContent="";
    const input=codeInput.value.trim();
    if(!input){ loginMsg.textContent="請輸入 Email"; return; }
    var _agree=document.getElementById("agreeChk");
    if(_agree && !_agree.checked){ loginMsg.textContent="請先勾選同意服務條款與隱私政策"; return; }
    try{ localStorage.setItem("agreedTerms","1"); }catch(e){}
    if(!isEmail(input)){ loginMsg.textContent="Email 格式不正確"; return; }
    var _fbUser = auth ? await waitAuthReady() : null;
    if(_fbUser && _fbUser.email && _fbUser.email.toLowerCase()===input.toLowerCase()){
      // 管理員Email也要先走過這道真正的Firebase驗證，通過後
      // 才標記管理員身分——不走訂閱/試用那套客戶邏輯，這樣
      // 管理員讀取jiachangzhu_subscribers/資料時，才符合資料庫規則要求的
      // 「auth != null」，不會被安全規則擋下來變成空白畫面
      if(input.toLowerCase()===ADMIN_EMAIL){
        state.isAdmin=true; state.user=input; state.plan="full";
        localStorage.setItem(AUTH_KEY,input);
        enterApp();
        return;
      }
      await finishCustomerLogin(input);
      return;
    }
    if(!auth){ loginMsg.textContent="驗證服務暫時無法使用，請稍後再試"; return; }
    loginBtn.disabled=true; loginBtn.textContent="寄送中…";
    try{
      var acs={ url: location.href.split('#')[0].split('?')[0], handleCodeInApp:true };
      await auth.sendSignInLinkToEmail(input, acs);
      try{ localStorage.setItem("emailForSignIn", input); }catch(e){}
      loginMsg.textContent="📧 登入連結已寄到 "+input+"，請到信箱點擊完成登入（找不到請看垃圾郵件夾）";
    }catch(e){
      loginMsg.textContent="寄送失敗："+((e&&e.message)?e.message:"請稍後再試");
    }
    loginBtn.disabled=false; loginBtn.textContent="登入";
  }

  // 匯出：把BACKUP_KEYS這些「App內容」資料整理成一個JSON
  // 檔案讓使用者下載。刻意不包含登入狀態相關的key
  // （AUTH_KEY／cook_plan這些），因為那些是裝置/登入階段
  // 的狀態，不該被匯入還原、也不該被搬到別的裝置上。
  function exportBackup(){
    const data = {};
    BACKUP_KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      if(v !== null){ data[k] = v; }
    });
    const payload = { app:'jiachangzhu', exportedAt: new Date().toISOString(), data:data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '食在料理備份_' + (function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已匯出備份檔');
  }

  function importBackup(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const payload = JSON.parse(reader.result);
        if(!payload || !payload.data){ throw new Error('格式不正確'); }
        if(!confirm('匯入會覆蓋目前這個裝置上的App資料，確定要繼續嗎？')) return;
        Object.keys(payload.data).forEach(k => {
          if(BACKUP_KEYS.indexOf(k) !== -1){ localStorage.setItem(k, payload.data[k]); }
        });
        alert('匯入完成，即將重新整理頁面');
        location.reload();
      }catch(err){
        alert('這不是本 App 的備份檔');
      }
    };
    reader.readAsText(file);
  }

  function getAllDishes(){
    return DISHES.filter(d => d.status === "confirmed");
  }

  /* =========================================================
     使用者自建料理的資料層（目前的入口是空的）
     ---------------------------------------------------------
     - userCreatedDishes：跟官方DISHES完全獨立存放，不會寫進
       DISHES，存在 localStorage，重新整理仍會保留。
     - 「AI幫我建立料理」這個功能目前已經移除（食在料理改成
       資料庫優先架構，不依賴AI即時生成，所有搜尋直接讀取
       結構化資料庫）。這個資料結構、source／status欄位
       刻意保留不刪，之後如果要恢復AI功能、或用別的方式
       （例如手動新增自訂料理表單）填進 userCreatedDishes，
       架構不用重寫，只需要接一個新的寫入入口。
     ========================================================= */
  const USER_CREATED_DISHES_KEY = 'jiachangzhu_user_created_dishes_v1';
  let userCreatedDishes = [];

  function loadUserCreatedDishes(){
    try {
      const raw = localStorage.getItem(USER_CREATED_DISHES_KEY);
      userCreatedDishes = raw ? JSON.parse(raw) : [];
    } catch(e){
      userCreatedDishes = [];
    }
  }
  function saveUserCreatedDishes(){
    try {
      localStorage.setItem(USER_CREATED_DISHES_KEY, JSON.stringify(userCreatedDishes));
    } catch(e){
      // localStorage 不可用時忽略，不影響本次操作
    }
  }
  function getUserCreatedDishes(){
    return userCreatedDishes;
  }
  loadUserCreatedDishes();

  // 官方料理庫＋使用者自己建立（含AI建立）的料理，合併後的
  // 完整可搜尋範圍。找料理、我有食材、分類篩選都要用這個，
  // 不能只用官方 getAllDishes()，否則AI建立的料理會在某些
  // 地方「查得到但比對不到」，出現不一致的體驗。
  function getSearchableDishes(){
    return getAllDishes().concat(getUserCreatedDishes());
  }

  // 詳細頁需要能同時找到官方料理與使用者自建的料理
  function findDishById(id){
    return getAllDishes().find(d => d.id === id) || getUserCreatedDishes().find(d => d.id === id);
  }
  // 與 findDishById 同義，只是命名對應「我的菜單／購物清單」這次規格
  function getDishById(id){
    return findDishById(id);
  }

  /* =========================================================
     這次要煮 ／ 採購
     ---------------------------------------------------------
     selectedMenuDishIds：可持續維護的待煮清單，獨立存在
       （不再依附任何「長期收藏」清單——收藏的角色已經由
       「我的拿手菜」承接）。
     menuServings：每道菜在「這次要煮」中目前選擇的份量，
       跟料理詳細頁的份量調整是分開的兩個狀態，各自獨立。
     採購頁：不是另外存一份清單，而是每次都用
       computeShoppingOverview() 從「這次要煮」＋
       manualShoppingItems（手動新增項目）即時算出來，
       每一項的狀態（要買／已有）直接對應 inventory 裡
       有沒有這一筆，點一下畫面上的項目就是切換 inventory。
     全部只用 localStorage，不會修改原始 DISHES。
     ========================================================= */
  /* 使用者慣用人數。家裡幾個人吃是固定的，沒道理每道菜都要重調，
     所以第一次預設 2 人，之後使用者調過幾次就記住幾人，
     打開任何一道菜都直接用這個數字。原始食譜的 servings 不動，
     只是換算的分母。 */
  const DEFAULT_SERVINGS_KEY = 'jiachangzhu_default_servings_v1';
  let defaultServings = 2;
  (function loadDefaultServings(){
    try {
      const raw = parseInt(localStorage.getItem(DEFAULT_SERVINGS_KEY), 10);
      if(raw > 0) defaultServings = raw;
    } catch(e){}
  })();
  function setDefaultServings(n){
    const v = Math.max(1, parseInt(n, 10) || 1);
    if(v === defaultServings) return;
    defaultServings = v;
    try { localStorage.setItem(DEFAULT_SERVINGS_KEY, String(v)); } catch(e){}
  }

  const MENU_SERVINGS_KEY = 'jiachangzhu_menu_servings_v1';
  let menuServingsMap = {};
  function loadMenuServingsMap(){
    try {
      const raw = localStorage.getItem(MENU_SERVINGS_KEY);
      menuServingsMap = raw ? JSON.parse(raw) : {};
    } catch(e){ menuServingsMap = {}; }
  }
  function saveMenuServingsMap(){
    try { localStorage.setItem(MENU_SERVINGS_KEY, JSON.stringify(menuServingsMap)); } catch(e){}
  }
  loadMenuServingsMap();

  function getMenuServings(dishId){
    if(menuServingsMap[dishId]) return menuServingsMap[dishId];
    const dish = getDishById(dishId);
    return defaultServings;
  }
  function setMenuServings(dishId, servings){
    menuServingsMap[dishId] = Math.max(1, servings);
    saveMenuServingsMap();
  }

  const SELECTED_MENU_KEY = 'jiachangzhu_selected_menu_v1';
  let selectedMenuDishIds = [];
  function loadSelectedMenu(){
    try {
      const raw = localStorage.getItem(SELECTED_MENU_KEY);
      selectedMenuDishIds = raw ? JSON.parse(raw) : [];
    } catch(e){ selectedMenuDishIds = []; }
  }
  function saveSelectedMenu(){
    try { localStorage.setItem(SELECTED_MENU_KEY, JSON.stringify(selectedMenuDishIds)); } catch(e){}
  }
  loadSelectedMenu();

  function isInSelectedMenu(id){
    return selectedMenuDishIds.includes(id);
  }
  // servings：加入當下使用者在詳細頁調好的份量。沒帶就用食譜預設，
  // 不能無視使用者剛調的人數直接套預設值
  function addToSelectedMenu(id, servings){
    if(selectedMenuDishIds.includes(id)) return;
    selectedMenuDishIds.push(id);
    const dish = getDishById(id);
    const s = (typeof servings === 'number' && servings > 0)
      ? servings
      : defaultServings;
    menuServingsMap[id] = Math.max(1, s);
    saveSelectedMenu();
    saveMenuServingsMap();
  }
  function removeFromSelectedMenu(id){
    const idx = selectedMenuDishIds.indexOf(id);
    if(idx !== -1){
      selectedMenuDishIds.splice(idx, 1);
      saveSelectedMenu();
    }
    if(mealTimeMap[id]){
      delete mealTimeMap[id];
      saveMealTimeMap();
    }
  }
  function toggleSelectedMenu(id, servings){
    if(isInSelectedMenu(id)){ removeFromSelectedMenu(id); }
    else { addToSelectedMenu(id, servings); }
  }
  function getSelectedMenuDishes(){
    return selectedMenuDishIds.map(id => getDishById(id)).filter(Boolean);
  }

  // 早／午／晚餐分類：純粹是「今日料理」頁面上事後的整理，
  // 加入今日料理當下完全不用選，預設是「未分類」。
  // 只影響這個頁面怎麼分組顯示，不影響採購（採購永遠是
  // 全部食材合併在一起算，不分餐別）。
  const MEAL_TIME_KEY = 'jiachangzhu_meal_time_v1';
  let mealTimeMap = {}; // dishId -> 'breakfast'|'lunch'|'dinner'（沒有值＝未分類）
  function loadMealTimeMap(){
    try {
      const raw = localStorage.getItem(MEAL_TIME_KEY);
      mealTimeMap = raw ? JSON.parse(raw) : {};
    } catch(e){ mealTimeMap = {}; }
  }
  function saveMealTimeMap(){
    try { localStorage.setItem(MEAL_TIME_KEY, JSON.stringify(mealTimeMap)); } catch(e){}
  }
  loadMealTimeMap();

  function getMealTime(dishId){
    return mealTimeMap[dishId] || null;
  }
  // 再點一次同一個餐別會取消（回到未分類），符合「選填」的定位
  function setMealTime(dishId, meal){
    if(meal){ mealTimeMap[dishId] = meal; }
    else { delete mealTimeMap[dishId]; }
    saveMealTimeMap();
  }

  /* 整罐／整包買的東西（醬油、米酒、太白粉、蝦米…）：
     食譜寫 2 大匙，但採購時不可能只買 2 大匙，顯示數量沒有意義，
     只要提醒「看家裡還有沒有」。蔥薑蒜這類雖然也歸在調味辛香，
     但採購是真的照量買，所以用食材上的 buyByPack 標記判斷，
     不是用分類判斷。料理詳細頁不受影響，該寫幾大匙還是寫幾大匙。 */
  function isBuyByPack(name){
    const found = getAllIngredients().find(e => e.name === name);
    return !!(found && found.buyByPack);
  }

  function findIngredientCategoryByName(name){
    const found = getAllIngredients().find(e => e.name === name);
    return found ? found.category : "其他";
  }

  // 完成購買 = 標記「已有」的東西會記進這裡（「我的庫存」的
  // 最小資料骨架）。這次不做庫存頁面、不做庫存數量增減／
  // 扣除，也不跟其他庫存管理 App 合併，純粹先把資料存好、
  // 留擴充空間；未來要接你自己那個庫存 App，這份資料格式
  // 已經是通的。
  const INVENTORY_KEY = 'jiachangzhu_inventory_v1';
  let inventory = [];
  function loadInventory(){
    try {
      const raw = localStorage.getItem(INVENTORY_KEY);
      inventory = raw ? JSON.parse(raw) : [];
    } catch(e){ inventory = []; }
  }
  function saveInventory(){
    try { localStorage.setItem(INVENTORY_KEY, JSON.stringify(inventory)); } catch(e){}
  }
  loadInventory();

  function isInInventory(name, unit){
    return inventory.some(i => i.name === name && i.unit === unit);
  }
  // 我有食材頁用：只看名稱是否在庫存中出現過（不管單位），
  // 純粹當作「提示」，不會影響任何自動勾選
  function isNameInInventory(name){
    return inventory.some(i => i.name === name);
  }
  function generateInventoryId(){
    return 'inv_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }
  function addToInventory(item){
    if(isInInventory(item.name, item.unit)) return;
    inventory.push({
      id: generateInventoryId(),
      name: item.name,
      unit: item.unit,
      amount: item.amount,
      category: item.category,
      type: item.type || 'ingredient',
      sourceDishIds: item.sourceDishIds || [],
      source: item.source || 'dish',
      markedAt: (function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})()
    });
    saveInventory();
  }
  function removeFromInventory(name, unit){
    inventory = inventory.filter(i => !(i.name === name && i.unit === unit));
    saveInventory();
  }
  function adjustInventoryItemAmount(id, delta){
    const item = inventory.find(i => i.id === id);
    if(!item) return;
    const newAmount = (parseInt(item.amount, 10) || 1) + delta;
    if(newAmount <= 0){
      inventory = inventory.filter(i => i.id !== id);
    } else {
      item.amount = newAmount;
      if(item.source === 'manual'){
        const shopItem = manualShoppingItems.find(m => m.name === item.name && m.unit === item.unit);
        if(shopItem){ shopItem.amount = newAmount; saveManualShoppingItems(); }
      }
    }
    saveInventory();
  }
  // 採購頁的狀態切換：要買 ↔ 已有，兩種狀態，「已有」不管
  // 是本來就有還是剛買的，都是同一個狀態，直接對應庫存
  // 裡「有沒有這一筆」
  function toggleInventoryStatus(item){
    if(isInInventory(item.name, item.unit)){
      removeFromInventory(item.name, item.unit);
    } else {
      addToInventory(item);
    }
  }

  // 使用者自己手動新增的採購項目（不透過料理，例如牛奶、
  // 衛生紙），獨立持久化，跟「這次要煮」算出來的食材需求
  // 分開存，最後在畫面上會合併顯示成同一份清單。
  const MANUAL_ITEMS_KEY = 'jiachangzhu_manual_shopping_items_v1';
  let manualShoppingItems = [];
  function loadManualShoppingItems(){
    try {
      const raw = localStorage.getItem(MANUAL_ITEMS_KEY);
      manualShoppingItems = raw ? JSON.parse(raw) : [];
    } catch(e){ manualShoppingItems = []; }
  }
  function saveManualShoppingItems(){
    try { localStorage.setItem(MANUAL_ITEMS_KEY, JSON.stringify(manualShoppingItems)); } catch(e){}
  }
  loadManualShoppingItems();

  function addManualShoppingItem(name, category, amount){
    const trimmed = (name || '').trim();
    if(!trimmed) return;
    const qty = Math.max(1, parseInt(amount, 10) || 1);
    const existing = manualShoppingItems.find(m => m.name === trimmed);
    if(existing){
      existing.amount = (parseInt(existing.amount, 10) || 0) + qty;
    } else {
      manualShoppingItems.push({
        id: generateShoppingItemId(),
        name: trimmed,
        amount: qty,
        unit: '',
        category: category || findIngredientCategoryByName(trimmed),
        createdAt: (function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})()
      });
    }
    saveManualShoppingItems();
  }
  // 手動項目的數量調整（+／-），減到0直接整筆移除，
  // 同時清掉對應的庫存紀錄避免留下孤兒資料
  function adjustManualShoppingItemAmount(name, unit, delta){
    const item = manualShoppingItems.find(m => m.name === name && m.unit === unit);
    if(!item) return;
    const newAmount = (parseInt(item.amount, 10) || 1) + delta;
    if(newAmount <= 0){
      manualShoppingItems = manualShoppingItems.filter(m => m.id !== item.id);
      inventory = inventory.filter(i => !(i.name === name && i.unit === unit && i.source === 'manual'));
      saveInventory();
    } else {
      item.amount = newAmount;
      const invItem = inventory.find(i => i.name === name && i.unit === unit && i.source === 'manual');
      if(invItem){ invItem.amount = newAmount; saveInventory(); }
    }
    saveManualShoppingItems();
  }
  // 用 name+unit 找到對應的手動項目並整筆刪除（不是標記，是真的移除），
  // 如果這筆項目原本被標記「已有」，一併清掉對應的庫存紀錄，
  // 避免留下指向已經不存在項目的孤兒資料
  function removeManualShoppingItem(name, unit){
    const item = manualShoppingItems.find(m => m.name === name && m.unit === unit);
    if(!item) return;
    manualShoppingItems = manualShoppingItems.filter(m => m.id !== item.id);
    saveManualShoppingItems();
    inventory = inventory.filter(i => !(i.name === name && i.unit === unit && i.source === 'manual'));
    saveInventory();
  }
  function generateShoppingItemId(){
    return 'shop_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  // 這幾樣視為「家中一定有」的常備調味料，永遠不會出現在
  // 「採購」頁裡（不管有沒有標記）
  const ALWAYS_STOCKED_SEASONINGS = ["鹽","糖","醬油","沙拉油"];

  /* 採購清單的單位整併。
     同一樣東西在不同料理裡會用小匙／大匙／ml 記（1大匙=3小匙=15ml），
     如果照字面當成不同單位，米酒就會在清單上裂成三筆。
     解法：液體量詞一律換算成 ml 當合併基準（key 也用 ml，庫存比對才穩定），
     顯示時再依總量挑一個好讀的單位。重量(g)與個數(片、顆、把)不換算。 */
  const VOLUME_UNIT_ML = { "ml":1, "cc":1, "小匙":5, "大匙":15 };
  function toMergeUnit(unit){
    return VOLUME_UNIT_ML[unit] ? "ml" : unit;
  }
  function toMergeAmount(amount, unit){
    return VOLUME_UNIT_ML[unit] ? amount * VOLUME_UNIT_ML[unit] : amount;
  }
  function formatVolumeDisplay(ml){
    if(ml >= 100) return { amount: String(Math.round(ml)), unit: "ml" };
    if(ml >= 15) return { amount: formatAmount(ml / 15, "大匙", 1), unit: "大匙" };
    return { amount: formatAmount(ml / 5, "小匙", 1), unit: "小匙" };
  }

  // 「採購」頁的完整內容：這次要煮全部需要的食材＋特殊調味料
  // （已排除常備調味料），加上使用者自己手動新增的項目，
  // 全部合併成同一份清單。每一項的狀態（要買／已有）都是
  // 從目前的 inventory 即時算出來，不是另外存一份「加入過」
  // 的紀錄——所以不管資料怎麼變動，畫面永遠反映真實狀況，
  // 不會有「東西消失了」的錯覺，也不需要另外一個「加入」動作。
  function computeShoppingOverview(){
    const dishes = getSelectedMenuDishes();
    const groups = {};

    // type 不進 key：同一樣東西在A菜是食材、B菜是調味料時，
    // 也要合併成一筆，不然清單上會看到兩個米酒
    function addToGroups(name, unit, amount, dishId, type){
      const canonicalName = normalizeIngredientName(name);
      const mUnit = toMergeUnit(unit);
      const key = canonicalName + '|' + mUnit;
      if(!groups[key]){
        groups[key] = { name: canonicalName, unit: mUnit, rawAmount: 0, sourceDishIds: [], type: type };
      }
      groups[key].rawAmount += toMergeAmount(amount, unit);
      if(groups[key].sourceDishIds.indexOf(dishId) === -1){
        groups[key].sourceDishIds.push(dishId);
      }
    }

    dishes.forEach(dish => {
      const servings = getMenuServings(dish.id);
      const ratio = servings / dish.servings;
      dish.ingredients.forEach(ing => {
        addToGroups(ing.name, ing.unit, ing.amount * ratio, dish.id, 'ingredient');
      });
      dish.seasonings.forEach(s => {
        // 用標準名稱判斷常備，別名（例如「油」→沙拉油）才不會漏掉
        if(ALWAYS_STOCKED_SEASONINGS.indexOf(normalizeIngredientName(s.name)) !== -1) return;
        addToGroups(s.name, s.unit, s.amount * ratio, dish.id, 'seasoning');
      });
    });

    const dishItems = Object.keys(groups).map(key => {
      const g = groups[key];
      // unit 固定用合併單位（庫存比對的 key 要穩定），
      // 畫面另外給一組好讀的數字
      const disp = isBuyByPack(g.name)
        ? { amount: '補貨', unit: '' }
        : (g.unit === 'ml')
          ? formatVolumeDisplay(g.rawAmount)
          : { amount: formatAmount(g.rawAmount, g.unit, 1), unit: g.unit };
      return {
        name: g.name,
        amount: formatAmount(g.rawAmount, g.unit, 1),
        unit: g.unit,
        displayAmount: disp.amount,
        displayUnit: disp.unit,
        type: g.type,
        category: findIngredientCategoryByName(g.name),
        sourceDishIds: g.sourceDishIds,
        source: 'dish'
      };
    });

    const manualItems = manualShoppingItems.map(m => ({
      name: m.name,
      amount: m.amount,
      unit: m.unit,
      type: 'ingredient',
      category: m.category || '其他',
      sourceDishIds: [],
      source: 'manual'
    }));

    return dishItems.concat(manualItems).map(item => Object.assign({}, item, {
      status: isInInventory(item.name, item.unit) ? 'have' : 'need'
    }));
  }

  const CATEGORY_ORDER = ["家常菜","肉類","蛋料理","蔬菜","湯品"];

    const found = new Set(getSearchableDishes().map(d => d.category));
    const ordered = CATEGORY_ORDER.filter(c => found.has(c));
    found.forEach(c => { if(!ordered.includes(c)) ordered.push(c); });

    return ordered;

  function getAllIngredients(){

  function findIngredientById(id){

  // 把 DISHES 食材裡出現的原始名稱，標準化成食材清單中的標準名稱。
  // 查不到的名稱維持原樣（代表目前食材庫還沒有涵蓋，此食材
  // 永遠會被視為「缺少」，這是預期內的行為，之後擴充食材庫即可）
  function normalizeIngredientName(rawName){
    const all = getAllIngredients();
    for(let i = 0; i < all.length; i++){
      const entry = all[i];
      if(entry.name === rawName) return entry.name;
      if(entry.matchNames && entry.matchNames.includes(rawName)) return entry.name;
    }
    return rawName;
  }

    const found = new Set(getAllIngredients().map(e => e.category));
    const ordered = INGREDIENT_CATEGORY_ORDER.filter(c => found.has(c));
    found.forEach(c => { if(!ordered.includes(c) && c !== "其他") ordered.push(c); });
    if(found.has("其他")) ordered.push("其他");
    return ordered;

  // 「看看我可以煮什麼」的核心比對函式：輸入使用者選擇的食材 id
  // 陣列，回傳每道料理「有哪些／缺哪些」，並依可煮程度排序。
  // 資料來源涵蓋官方料理＋使用者AI建立的料理（getSearchableDishes()），
  // 只判斷 dish.ingredients，不判斷 seasonings（鹽/油/醬油/糖
  // 這類常備調味料，不應該讓料理被判定成不能做）。
  function getAvailableDishesForIngredients(selectedIds){
    const selectedNames = selectedIds.map(id => {
      const ing = findIngredientById(id);
      return ing ? ing.name : id;
    });
    const userSet = new Set(selectedNames);
    const source = getSearchableDishes(); // 官方料理＋使用者AI建立的料理，兩者都要能被「我有食材」比對到
    const results = source.map(dish => {
      const have = [];
      const missing = [];
      dish.ingredients.forEach(ing => {
        const canonical = normalizeIngredientName(ing.name);
        if(userSet.has(canonical)){ have.push(ing.name); }
        else { missing.push(ing.name); }
      });
      return { dish, have, missing, missingCount: missing.length };
    });
    const relevant = results.filter(r => r.have.length > 0);
    // 排序先看「用到你幾樣食材」，再看「還缺幾樣」。
    // 只看缺幾樣的話，選了蝦仁＋雞蛋會跑出荷包蛋、滷蛋這種完全沒用到蝦仁的菜排在前面。
    relevant.sort((a, b) => {
      if(a.have.length !== b.have.length) return b.have.length - a.have.length;
      if(a.missingCount !== b.missingCount) return a.missingCount - b.missingCount;
      const ap = a.dish.priority || 1, bp = b.dish.priority || 1;
      if(ap !== bp) return ap - bp;
      return a.dish.name.localeCompare(b.dish.name, 'zh-Hant');
    });
    return relevant;
  }

     2. 別名：模糊比對
     3. 食材：完整名稱精準比對（不因食材名稱中「包含」搜尋字
        就命中，例如搜尋「雞」不會因食材「雞蛋」而誤判）
     注意：這個函式僅供「搜尋料理」使用。未來「我有食材」是
     判斷現有食材能不能滿足料理需求，邏輯不同，會另外設計，
     不會共用這個函式。 */
  function matchesQuery(dish, q){
    if(!q) return true;
    const query = q.trim().toLowerCase();
    if(dish.name.toLowerCase().includes(query)) return true;
    if(dish.aliases && dish.aliases.some(a => a.toLowerCase().includes(query))) return true;
    if(dish.ingredients && dish.ingredients.some(ing => ing.name.toLowerCase() === query)) return true;
    return false;
  }

  const QUICK_SERVINGS = [1,2,3,4,6];
  let currentDish = null;
  let currentServings = 0;

  // g/kg/ml/l 這類公制單位換算後取整數；其餘（顆/小匙/大匙/瓣...）
  // 取最接近的 0.5，避免出現 1.3333333 這種長串小數
  function formatAmount(amount, unit, ratio){
    const metricUnits = ["g","kg","ml","l"];
    let val = amount * ratio;
    if(metricUnits.includes(unit)){
      // 換算後的克數取整十，不要出現「333g」這種買不到也秤不準的數字
      val = val >= 100 ? Math.round(val / 10) * 10 : Math.round(val);
    } else {
      val = Math.round(val * 2) / 2;
    }
    return Number.isInteger(val) ? String(val) : val.toFixed(1);
  }

  function scaleItem(item, ratio){
    return { name:item.name, amount: formatAmount(item.amount, item.unit, ratio), unit:item.unit };
  }

  /* 米飯類料理的水量換算：
     - 「內鍋刻度」：水對齊米量的刻度數，直接等於換算後的米量，
       不能用比例公式另外計算，因為刻度本身就是1:1對齊的規則
     - 「比例」「量杯」：水量依 waterAmount 本身的比例換算
       （不同米種、不同方式的水米比例本來就不同，各自獨立設定） */
  function renderRiceInfo(riceInfo, ratio){
    const scaledRice = formatAmount(riceInfo.riceAmount, riceInfo.riceUnit, ratio);
    let waterDisplay;
    if(riceInfo.waterMethod === "內鍋刻度"){
      waterDisplay = scaledRice + ' ' + riceInfo.riceUnit + '（對齊內鍋刻度 ' + scaledRice + '）';
    } else {
      const scaledWater = formatAmount(riceInfo.waterAmount, riceInfo.riceUnit, ratio);
      waterDisplay = scaledWater + ' ' + riceInfo.riceUnit + '（' + riceInfo.waterMethod + '）';
    }
    return '' +
      '<div class="rice-row"><span>米種</span><span>' + riceInfo.riceType + '</span></div>' +
      '<div class="rice-row"><span>米量</span><span>' + scaledRice + ' ' + riceInfo.riceUnit + '</span></div>' +
      '<div class="rice-row"><span>水量</span><span>' + waterDisplay + '</span></div>' +
      '<div class="rice-row"><span>口感</span><span>' + riceInfo.texture + '</span></div>';
  }

  function renderIngredientList(items){
    return '<ul class="ingredient-list">' + items.map(i =>
      '<li class="ingredient-row"><span>' + i.name + '</span><span class="ingredient-row-right"><span class="ingredient-amount">' + i.amount + ' ' + i.unit + '</span></span></li>'
    ).join('') + '</ul>';
  }

  function renderServingsQuickChips(){
    return QUICK_SERVINGS.map(n =>
      '<button class="serv-chip' + (n === currentServings ? ' active' : '') + '" data-servings="' + n + '">' + n + ' 人</button>'
    ).join('');
  }

  // 份量變動時，只局部更新份量文字、快選按鈕、食材與調味料清單，
  // 不重新渲染整頁，避免手機畫面跳動
  function updateServingsUI(){
    if(!currentDish) return;
    const ratio = currentServings / currentDish.servings;
    document.getElementById('servingsValue').textContent = currentServings + ' 人份';
    document.querySelectorAll('#servingsQuick .serv-chip').forEach(chip => {
      chip.classList.toggle('active', parseInt(chip.dataset.servings, 10) === currentServings);
    });
    document.getElementById('ingredientListContainer').innerHTML = renderIngredientList(currentDish.ingredients.map(i => scaleItem(i, ratio)));
    document.getElementById('seasoningListContainer').innerHTML = renderIngredientList(currentDish.seasonings.map(i => scaleItem(i, ratio)));
    const riceContainer = document.getElementById('riceInfoContainer');
    if(riceContainer && currentDish.riceInfo){
      riceContainer.innerHTML = renderRiceInfo(currentDish.riceInfo, ratio);
    }
  }

  // 已經在「這次要煮」裡的菜，詳細頁調份量要即時寫回，
  // 否則回今日料理／採購算的還是舊人數
  function syncServingsToMenu(){
    if(currentDish && isInSelectedMenu(currentDish.id)){
      setMenuServings(currentDish.id, currentServings);
    }
  }

  function adjustServings(delta){
    currentServings = Math.max(1, currentServings + delta);
    setDefaultServings(currentServings); // 記住慣用人數，下次不用再調
    syncServingsToMenu();
    updateServingsUI();
  }

  function setServings(n){
    currentServings = Math.max(1, n);
    setDefaultServings(currentServings);
    syncServingsToMenu();
    updateServingsUI();
  }


  // 詳細頁只有一頁，但依「有沒有加入這次要煮」顯示不同深度：
  //   還沒加入 → 只給判斷要不要煮的資訊（食材名稱、三行大致做法）
  //   已經加入 → 展開完整份量、備料、火侯時間、技巧與常見錯誤
  // 這樣搜尋比較多道菜時畫面乾淨好比較，決定要煮了細節才出現
  function renderDetail(dish){
    const planned = isInSelectedMenu(dish.id);
    const ratio = currentServings / dish.servings;
    let html = '';

    html += '<div class="detail-hero">';
    html += '<h1 class="detail-name">' + dish.name + '</h1>';
    html += '<div class="detail-tags"><span class="tag">' + dish.category + '</span><span class="tag">' + dish.difficulty + '</span><span class="tag">' + (dish.prepTime + dish.cookTime) + ' 分鐘</span></div>';
    html += '</div>';

    // 份量調整
    html += '<div class="servings-card">';
    html += '<div class="servings-header"><span>👥</span><span>份量</span></div>';
    html += '<div class="servings-control">';
    html += '<button class="serv-btn" id="servMinus" aria-label="減少一人份">－</button>';
    html += '<span class="servings-value" id="servingsValue">' + currentServings + ' 人份</span>';
    html += '<button class="serv-btn" id="servPlus" aria-label="增加一人份">＋</button>';
    html += '</div>';
    html += '<div class="servings-quick" id="servingsQuick">' + renderServingsQuickChips() + '</div>';
    html += '</div>';

    if(!planned){
      // ── 挑菜階段：資訊收斂，只給「要不要煮」的判斷依據 ──
      html += '<div class="detail-section">';
      html += '<p class="detail-section-title">🧺 需要準備</p>';
      html += '<div class="preview-ing-box">' + dish.ingredients.map(i => i.name).join('、') + '</div>';
      const specialSeasonings = dish.seasonings.filter(s => ALWAYS_STOCKED_SEASONINGS.indexOf(normalizeIngredientName(s.name)) === -1);
      if(specialSeasonings.length){
        html += '<div class="preview-ing-box seasoning">' + specialSeasonings.map(i => i.name).join('、') + '</div>';
      }
      html += '</div>';

      html += '<div class="detail-section">';
      html += '<p class="detail-section-title">🔥 大致怎麼煮</p>';
      html += '<div class="preview-flow">' + renderCookingFlow(dish) + '</div>';
      html += '</div>';

      html += '<div class="start-cook-wrap">';
      html += '<button class="dish-action-btn primary" id="selectedMenuToggleBtn">🔥 加入這次要煮</button>';
      html += '</div>';

      document.getElementById('detailContent').innerHTML = html;
      bindServingsEvents();
      bindSelectedMenuToggle(dish);
      return;
    }

    // ── 已加入：展開完整細節 ──
    html += '<div class="start-cook-wrap">';
    html += '<button class="dish-action-btn added" id="selectedMenuToggleBtn">✓ 已加入這次要煮</button>';
    html += '</div>';

    html += '<div class="detail-divider"></div>';

    html += '<div class="detail-section">';
    html += '<p class="detail-section-title">🧺 需要準備</p>';
    html += '<p class="subgroup-label">主要食材</p><div id="ingredientListContainer">' + renderIngredientList(dish.ingredients.map(i => scaleItem(i, ratio))) + '</div>';
    html += '<p class="subgroup-label">調味料</p><div id="seasoningListContainer">' + renderIngredientList(dish.seasonings.map(i => scaleItem(i, ratio))) + '</div>';
    html += '<p class="subgroup-label">工具</p><div class="tool-tags">' + dish.tools.map(t => '<span class="tool-tag">' + t + '</span>').join('') + '</div>';
    html += '</div>';

    if(dish.riceInfo){
      html += '<div class="detail-section">';
      html += '<p class="detail-section-title">🍚 米飯資訊</p>';
      html += '<div class="rice-card" id="riceInfoContainer">' + renderRiceInfo(dish.riceInfo, ratio) + '</div>';
      if(dish.riceInfo.riceNotes && dish.riceInfo.riceNotes.length){
        html += '<p class="subgroup-label">小提醒</p><ul class="note-list">' + dish.riceInfo.riceNotes.map(n => '<li class="note-item tip">' + n + '</li>').join('') + '</ul>';
      }
      html += '</div>';
    }

    // 免費版：只給規模（幾步、多久），不給做法內容
    if(isFreePlan()){
      html += renderStepsLocked(dish);
    } else {
      html += '<div class="detail-section">';
      html += '<p class="detail-section-title">🔪 備料</p>';
      html += '<ul class="step-list">' + dish.preparationSteps.map((s, idx) =>
        '<li class="prep-step"><span class="step-num">' + (idx + 1) + '</span><span>' + s + '</span></li>'
      ).join('') + '</ul>';
      html += '</div>';

      html += '<div class="detail-section">';
      html += '<p class="detail-section-title">🔥 烹調步驟</p>';
      html += '<ul class="step-list">' + dish.cookingSteps.map(s =>
        '<li class="cook-step">' +
          '<div class="cook-step-head">' +
            '<span class="cook-step-num">' + s.step + '</span>' +
            '<div class="cook-step-badges">' +
              '<span class="badge">' + s.heatLevel + '</span>' +
              (s.time ? '<span class="badge">' + s.time + ' 分</span>' : '') +
            '</div>' +
          '</div>' +
          '<p class="cook-step-desc">' + s.description + '</p>' +
        '</li>'
      ).join('') + '</ul>';
      html += '</div>';

      html += '<div class="detail-section">';
      html += '<p class="detail-section-title">💡 小技巧</p>';
      html += '<ul class="note-list">' + dish.tips.map(t => '<li class="note-item tip">' + t + '</li>').join('') + '</ul>';
      html += '</div>';

      html += '<div class="detail-section">';
      html += '<p class="detail-section-title">⚠️ 常見錯誤</p>';
      html += '<ul class="note-list">' + dish.commonMistakes.map(m => '<li class="note-item mistake">' + m + '</li>').join('') + '</ul>';
      html += '</div>';
    }

    const inSignature = mySignatureDishIds.includes(dish.id);
    const sigLocked = isFreePlan();
    html += '<div class="start-cook-wrap">';
    html += '<button class="dish-action-btn' + (inSignature ? ' added' : '') + '" id="signatureToggleBtn">' + (sigLocked ? '🔒 我的菜單（付費功能）' : (inSignature ? '✓ 已加入我的拿手菜' : '⭐ 加入我的拿手菜')) + '</button>';
    html += '</div>';
    html += '<div class="start-cook-wrap">';
    html += '<button class="dish-action-btn" id="cookLogBtn">' + (sigLocked ? '🔒 儲存料理紀錄（付費功能）' : '📝 儲存料理紀錄') + '</button>';
    html += '</div>';
    html += '<div class="start-cook-wrap">';
    html += '<button class="dish-action-btn primary" id="startSopBtn">' + (sigLocked ? '🔒 SOP 逐步模式（完整版）' : '▶ 開始 SOP 逐步模式') + '</button>';
    html += '</div>';

    document.getElementById('detailContent').innerHTML = html;
    bindServingsEvents();
    bindSelectedMenuToggle(dish);
    document.getElementById('startSopBtn').addEventListener('click', () => {
      if(isFreePlan()){ openUpgradeView(); return; }
      startSOP(currentDish, currentServings);
    });
    document.querySelectorAll('#detailContent [data-open-upgrade]').forEach(b => {
      b.addEventListener('click', () => openUpgradeView());
    });
    document.getElementById('signatureToggleBtn').addEventListener('click', () => {
      if(isFreePlan()){ openUpgradeView(); return; }
      toggleSignatureDish(dish.id);
      renderDetail(dish);
    });
    document.getElementById('cookLogBtn').addEventListener('click', () => {
      if(isFreePlan()){ openUpgradeView(); return; }
      showCookLogModal(dish);
    });
  }

  // 挑菜階段的「大致怎麼煮」：直接從烹調步驟濃縮，不用另外
  // 為331道菜寫簡介。取每步描述的第一個子句，最多三段
  // 免費版看到的：只講規模，不講做法
  function renderStepsLocked(dish){
    const prep = (dish.preparationSteps || []).length;
    const cook = (dish.cookingSteps || []).length;
    const mins = (dish.cookingSteps || []).reduce((a, s) => a + (Number(s.time) || 0), 0)
               + (Number(dish.prepTime) || 0);
    const scale = '共 ' + (prep + cook) + ' 步' + (mins ? ' · 約 ' + mins + ' 分鐘' : '');
    return '<div class="detail-section steps-locked">' +
      '<p class="detail-section-title">🔥 烹調步驟</p>' +
      '<p class="steps-locked-scale">' + scale + '</p>' +
      '<div class="steps-locked-box">' +
        '<p class="steps-locked-title">完整步驟需要完整版</p>' +
        '<p class="steps-locked-desc">每一步的火候、時間、怎麼做，<br>還有備料、小技巧與容易失敗的地方。</p>' +
        '<button class="steps-locked-btn" data-open-upgrade>看方案</button>' +
      '</div>' +
    '</div>';
  }

  function renderCookingFlow(dish){
    const parts = dish.cookingSteps
      .map(s => String(s.description).split(/[，,。；;]/)[0].trim())
      .filter(Boolean);
    if(parts.length === 0) return '';
    let picks;
    if(parts.length <= 3){ picks = parts; }
    else { picks = [parts[0], parts[Math.floor(parts.length / 2)], parts[parts.length - 1]]; }
    return picks.map((p, i) =>
      '<span class="preview-flow-step">' + (i > 0 ? '<span class="preview-flow-arrow">→</span>' : '') + p + '</span>'
    ).join('');
  }

  function bindServingsEvents(){
    document.getElementById('servMinus').addEventListener('click', () => adjustServings(-1));
    document.getElementById('servPlus').addEventListener('click', () => adjustServings(1));
    document.querySelectorAll('#servingsQuick .serv-chip').forEach(chip => {
      chip.addEventListener('click', () => setServings(parseInt(chip.dataset.servings, 10)));
    });
  }

  function bindSelectedMenuToggle(dish){
    document.getElementById('selectedMenuToggleBtn').addEventListener('click', () => {
      const wasIn = isInSelectedMenu(dish.id);
      toggleSelectedMenu(dish.id, currentServings);
      renderDetail(dish);
      window.scrollTo(0, 0);
      showToast(wasIn ? '已從這次要煮移除' : '已加入這次要煮・目前共 ' + selectedMenuDishIds.length + ' 道');
    });
  }

  let detailReturnView = 'find-recipe'; // 詳細頁返回鍵要回到哪個畫面，預設回到找食譜的「依菜色找」

  // 進詳細頁前記住當下捲到哪，返回時捲回原位——搜尋結果滑很久
  // 才點進某道菜，返回後不用重頭滑
  let detailReturnScroll = 0;

  function openDetail(id, returnView, initialServings){
    const dish = findDishById(id);
    if(!dish) return;
    detailReturnScroll = (typeof window.scrollY === 'number') ? window.scrollY : 0;
    currentDish = dish;
    // 這次要煮裡的菜用它自己存的份量，其他一律用慣用人數（預設2人）
    currentServings = initialServings || defaultServings;
    detailReturnView = returnView || 'find-recipe';
    document.querySelector('#view-detail .page-title').textContent = dish.name;
    renderDetail(dish);
    navigate('detail');
  }

  function goBackFromDetail(){
    const y = detailReturnScroll;
    if(detailReturnView === 'find-choice'){ findMode = 'choice'; renderFindView(); navigate('find'); }
    else if(detailReturnView === 'find-recipe'){ findMode = 'recipe'; renderFindView(); navigate('find'); }
    else if(detailReturnView === 'find-ingredients'){ findMode = 'ingredients'; renderFindView(); navigate('find'); }
    else if(detailReturnView === 'selected-menu'){ renderSelectedMenuView(); navigate('selected-menu'); }
    else if(detailReturnView === 'signature'){ renderSignatureView(); navigate('signature'); }
    else if(detailReturnView === 'shopping'){ renderShoppingView(); navigate('shopping'); }
    else { navigate(detailReturnView); }
    // navigate() 會先捲到最上面，所以在它之後才還原位置
    if(y > 0){ setTimeout(function(){ window.scrollTo(0, y); }, 0); }
  }

  /* =========================================================
     首頁互動
     ========================================================= */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function failMsg(act, err){
    var code = String((err && (err.code || err.message)) || "");
    if((typeof navigator!=="undefined" && navigator.onLine===false)
       || /unavailable|network|timeout|deadline|offline/i.test(code)) return act+"失敗，請檢查網路連線";
    if(/permission|denied|unauthenticated|auth/i.test(code)) return act+"失敗，請重新登入再試一次";
    return act+"失敗，請稍後再試";
  }
  function showToast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), ms || 1800);
  }

  /* ---------- 找食譜：choice（兩個大按鈕）／recipe／ingredients ----------
     三層結構：
     choice　　　＝這個分頁的頂層（兩個大按鈕，沒有返回鍵）
     recipe　　　＝依菜色找的搜尋畫面（返回鍵回到choice）
     ingredients ＝依食材找（內部還有分類清單/詳細/結果，
                   自己的頂層(分類清單)返回鍵回choice，
                   往下鑽的返回鍵先退回分類清單）
     findGoBack() 統一處理這整個「返回」邏輯，不管卡在哪一層。 */
  let findMode = 'choice';

  // 只重繪目前狀態，不重置——detail頁／AI建立頁返回會用這個，
  // 保留使用者原本鑽到哪一層
  function getGreeting(){
    const hour = new Date().getHours();
    if(hour < 5) return '夜深了，還在想菜單嗎？';
    if(hour < 11) return '早安，今天想煮點什麼？';
    if(hour < 14) return '午安，中午想吃什麼呢？';
    if(hour < 17) return '下午茶時間，來點靈感吧';
    if(hour < 20) return '晚餐時間到了，看看想煮什麼';
    return '晚安，明天想煮點什麼？';
  }

  function getInspirationDishes(count){
    const pool = getSearchableDishes().filter(d => (d.priority||1) <= 2);
    const shuffled = pool.slice().sort(() => Math.random() - 0.5);
    return shuffled.slice(0, count);
  }

  // 首頁（找食譜分頁預設畫面）：問候語＋今日料理／採購清單
  // 待辦數量總覽＋隨機靈感推薦，每次回到這個畫面都重新
  // 渲染一次，確保數字跟推薦內容是新的
  function renderFindChoiceHome(){
    const container = document.getElementById('findChoiceContent');
    const todayCount = selectedMenuDishIds.length;
    const shoppingNeedCount = computeShoppingOverview().filter(i => i.status === 'need').length;
    const inspireDishes = getInspirationDishes(3);

    let html = '';
    html += '<p class="home-greeting">' + getGreeting() + '</p>';

    html += '<div class="home-status-row">';
    html += '<button class="home-status-card" id="homeTodayCard"><span class="home-status-num">' + todayCount + '</span><span class="home-status-label">今日料理待煮</span></button>';
    html += '<button class="home-status-card" id="homeShoppingCard"><span class="home-status-num">' + shoppingNeedCount + '</span><span class="home-status-label">採購清單待買</span></button>';
    html += '</div>';

    if(inspireDishes.length > 0){
      html += '<div class="home-inspire-section">';
      html += '<p class="home-inspire-title">🍳 今天煮什麼？試試這幾道</p>';
      html += '<div class="home-inspire-scroll">' + inspireDishes.map(d =>
        '<button class="home-inspire-card" data-inspire-dish="' + d.id + '">' +
          '<span class="home-inspire-emoji">' + getDishIcon(d) + '</span>' +
          '<span class="home-inspire-name">' + d.name + '</span>' +
        '</button>'
      ).join('') + '</div></div>';
    }

    html += '<p class="menu-subtitle">或是自己找找看：</p>';
    html += '<div class="find-choice-list">';
    html += '<button class="find-choice-btn" data-find-mode="recipe"><span class="find-choice-icon">📋</span><span class="find-choice-body"><span class="find-choice-title">依菜色找</span><span class="find-choice-desc">知道想吃什麼，直接搜尋</span></span></button>';
    html += '<button class="find-choice-btn" data-find-mode="ingredients"><span class="find-choice-icon">🥦</span><span class="find-choice-body"><span class="find-choice-title">依食材找</span><span class="find-choice-desc">看看手邊食材能煮什麼</span></span></button>';
    html += '</div>';

    container.innerHTML = html;

    document.querySelectorAll('#findChoiceContent .find-choice-btn').forEach(btn => {
      btn.addEventListener('click', () => openFindView(btn.dataset.findMode));
    });
    const todayCard = document.getElementById('homeTodayCard');
    if(todayCard) todayCard.addEventListener('click', () => openSelectedMenuView());
    const shopCard = document.getElementById('homeShoppingCard');
    if(shopCard) shopCard.addEventListener('click', () => openShoppingListView());
    document.querySelectorAll('#findChoiceContent .home-inspire-card').forEach(btn => {
      btn.addEventListener('click', () => openDetail(btn.dataset.inspireDish, 'find-choice'));
    });
  }

  function renderFindView(){
    document.getElementById('findChoiceContent').style.display = findMode === 'choice' ? 'block' : 'none';
    document.getElementById('findRecipeContent').style.display = findMode === 'recipe' ? 'block' : 'none';
    document.getElementById('findIngredientsContent').style.display = findMode === 'ingredients' ? 'block' : 'none';

    const isChoice = findMode === 'choice';
    document.getElementById('findBackBtn').style.display = isChoice ? 'none' : '';
    const titleEl = document.getElementById('findHeaderTitle');
    if(isChoice){ titleEl.textContent = '🏠 首頁'; }
    else if(findMode === 'recipe'){ titleEl.textContent = '依菜色找'; }
    else if(findMode === 'ingredients'){ titleEl.textContent = '依食材找'; }

    if(findMode === 'choice'){
      renderFindChoiceHome();
    } else if(findMode === 'recipe'){
      renderChips();
      renderResults();
    } else if(findMode === 'ingredients'){
      renderIngredientsView();
    }
  }

  // 從底部導航／選擇畫面按鈕點進來時使用：每次都重置回
  // 該模式的頂層（choice 本身沒有內部狀態，不用重置）
  function openFindView(mode){
    findMode = mode || 'choice';
    if(findMode === 'recipe'){
      searchQuery = '';
      activeCategory = '全部';
      document.getElementById('searchInput').value = '';
    } else if(findMode === 'ingredients'){
      ingredientsScreen = 'categories';
      ingredientSearchQuery = '';
    }
    renderFindView();
    navigate('find');
  }

  // 返回鍵統一入口：依目前卡在哪一層，決定要退到哪裡
  function findGoBack(){
    if(findMode === 'recipe'){
      findMode = 'choice';
      renderFindView();
    } else if(findMode === 'ingredients'){
      if(ingredientsScreen === 'category-detail' || ingredientsScreen === 'results'){
        ingredientsScreen = 'categories';
        ingredientSearchQuery = '';
        renderIngredientsView();
      } else {
        findMode = 'choice';
        renderFindView();
      }
    }
    window.scrollTo(0, 0);
  }

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchQuery = e.target.value;
    renderResults();
  });

  document.getElementById('findBackBtn').addEventListener('click', () => findGoBack());
  document.getElementById('shoppingTabList').addEventListener('click', () => {
    shoppingTab = 'list';
    closeManualForms(); // 切分頁時收掉展開中的新增表單，不要一直佔著畫面
    renderShoppingView();
  });
  document.getElementById('shoppingTabInventory').addEventListener('click', () => {
    shoppingTab = 'inventory';
    closeManualForms();
    renderShoppingView();
  });
  document.getElementById('signatureTabMenu').addEventListener('click', () => {
    signatureTab = 'menu';
    renderSignatureView();
  });
  document.getElementById('signatureTabLog').addEventListener('click', () => {
    signatureTab = 'log';
    renderSignatureView();
  });
  document.getElementById('detailBackBtn').addEventListener('click', () => goBackFromDetail());

  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item=>{
    item.addEventListener('click', ()=>{
      const tab = item.dataset.tab;
      if(tab === 'find'){ openFindView('choice'); }
      else if(tab === 'selected-menu'){ openSelectedMenuView(); }
      else if(tab === 'shopping'){ openShoppingListView(); }
      else if(tab === 'signature'){ openSignatureView(); }
    });
  });

  /* =========================================================
     料理 SOP 模式（全螢幕）
     - 使用進入 SOP 當下的份量（currentServings），
       不會重新使用原始 servings 的資料
     - 只操作 dish.cookingSteps，不會修改 DISHES 原始資料
     - 「加入我的拿手菜」「完成紀錄」目前只存在前端暫存
       陣列，尚未接 Firebase
     ========================================================= */
  let sopDish = null;
  let sopServings = 0;
  let sopStepIndex = 0;

  // 「我的拿手菜」＝收藏／常做清單，取代原本「我的菜單」的
  // 角色：可以在料理詳細頁直接收藏（不用等煮完），也可以在
  // SOP完成畫面加入。cookLogs 記錄每次「完成料理」的紀錄，
  // 拿手菜清單本身跟「有沒有煮過」是分開的兩件事。
  const MY_SIGNATURE_KEY = 'jiachangzhu_my_signature_v1';
  const COOK_LOGS_KEY = 'jiachangzhu_cook_logs_v1';
  let mySignatureDishIds = [];
  let cookLogs = [];

  function loadMySignatureDishIds(){
    try {
      const raw = localStorage.getItem(MY_SIGNATURE_KEY);
      mySignatureDishIds = raw ? JSON.parse(raw) : [];
    } catch(e){ mySignatureDishIds = []; }
  }
  function saveMySignatureDishIds(){
    try { localStorage.setItem(MY_SIGNATURE_KEY, JSON.stringify(mySignatureDishIds)); } catch(e){}
  }
  loadMySignatureDishIds();

  function loadCookLogs(){
    try {
      const raw = localStorage.getItem(COOK_LOGS_KEY);
      cookLogs = raw ? JSON.parse(raw) : [];
    } catch(e){ cookLogs = []; }
  }
  function saveCookLogs(){
    try { localStorage.setItem(COOK_LOGS_KEY, JSON.stringify(cookLogs)); } catch(e){}
  }
  loadCookLogs();

  // 加入/移除我的拿手菜是可切換的，唯一入口在料理詳細頁
  // 的「備料／步驟總覽」頁最下方——不用等真的完成SOP，
  // 步驟看過、心裡有底就可以收藏
  function toggleSignatureDish(dishId){
    const idx = mySignatureDishIds.indexOf(dishId);
    if(idx === -1){ mySignatureDishIds.push(dishId); }
    else { mySignatureDishIds.splice(idx, 1); }
    saveMySignatureDishIds();
  }

  // 判斷目前是不是「免費方案」——試用期間(trial)跟正式
  // 付費方案(basic/full/family)都算解鎖；只有plan變成
  // free（試用到期又沒升級，或本來就是免費方案）才算鎖住。
  // 這個判斷目前用在：我的菜單、採購清單／我的庫存、
  // 早中晚分類，這幾個付費功能的鎖定判斷上。
  // 找料理/我有食材/今日料理（加菜、份量調整）這些完全
  // 不受影響，一律免費使用。
  function isFreePlan(){
    // 驗證回來前 state.plan 是 null —— 預設當成免費版（鎖住），驗證完再開，
    // 不然付費功能會先開放一下下再被收回，畫面會閃。
    return !state.isAdmin && !isPaidPlan(state.plan) && state.plan !== 'trial';
  }

  function generateCookLogId(){
    return 'log_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }
  function logCook(dishId, servings, rating, note){
    cookLogs.push({
      id: generateCookLogId(),
      dishId: dishId,
      cookedAt: (function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})(),
      servings: servings,
      rating: rating || null,
      note: note || ""
    });
    saveCookLogs();
  }

  // 儲存料理紀錄的獨立彈窗——在料理詳細頁直接觸發，不用
  // 綁定SOP流程，不管有沒有開過SOP、有沒有走完，只要
  // 使用者想記錄「這道菜我做過」，隨時都能記
  let logModalRating = 0;
  function showCookLogModal(dish, existingLog){
    const isEdit = !!existingLog;
    logModalRating = isEdit ? (existingLog.rating || 0) : 0;
    const root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="overlay" id="ovl" style="align-items:center"><div class="sheet" id="sheet" style="border-radius:20px;max-width:400px;margin:0 16px;padding:24px 20px">' +
        '<div style="text-align:center;font-size:40px;line-height:1;margin-bottom:8px">📝</div>' +
        '<div style="text-align:center;font-size:18px;font-weight:900;color:#2E2E33;margin-bottom:4px">' + dish.name + '</div>' +
        '<p style="text-align:center;font-size:13px;color:#8A8A93;margin:0 0 16px;">' + (isEdit ? '修改這次的紀錄' : '記錄這次做的感覺') + '</p>' +
        '<div class="sop-stars" id="logModalStars" style="justify-content:center;"></div>' +
        '<textarea id="logModalNote" class="sop-note-input" placeholder="備註（選填）" style="margin-top:14px;"></textarea>' +
        '<button class="ai-generate-btn" id="logModalConfirmBtn" style="margin-top:16px;">' + (isEdit ? '更新紀錄' : '儲存紀錄') + '</button>' +
        '<button id="logModalCancelBtn" style="width:100%;border:none;background:none;color:#8A8A93;font-size:13px;padding:12px;margin-top:6px">取消</button>' +
      '</div></div>';
    renderLogModalStars();
    if(isEdit){ document.getElementById('logModalNote').value = existingLog.note || ''; }
    document.getElementById('logModalConfirmBtn').addEventListener('click', () => {
      const note = document.getElementById('logModalNote').value.trim();
      if(isEdit){
        existingLog.rating = logModalRating || null;
        existingLog.note = note;
        saveCookLogs();
        showToast('已更新料理紀錄');
        closeSheet();
        renderSignatureView();
      } else {
        logCook(dish.id, currentServings || defaultServings, logModalRating, note);
        showToast('已儲存料理紀錄');
        closeSheet();
      }
    });
    document.getElementById('logModalCancelBtn').addEventListener('click', closeSheet);
  }
  function renderLogModalStars(){
    const el = document.getElementById('logModalStars');
    if(!el) return;
    el.innerHTML = [1,2,3,4,5].map(n =>
      '<span class="sop-star' + (n <= logModalRating ? ' filled' : '') + '" data-star="' + n + '">★</span>'
    ).join('');
    el.querySelectorAll('.sop-star').forEach(s => {
      s.addEventListener('click', () => {
        logModalRating = parseInt(s.dataset.star, 10);
        renderLogModalStars();
      });
    });
  }

  function startSOP(dish, servings){
    if(!dish) return;
    sopDish = dish;
    sopServings = servings;
    sopStepIndex = 0;
    document.getElementById('sopDoneScreen').style.display = 'none';
    document.getElementById('sopStepScreen').style.display = 'block';
    document.getElementById('sopLeaveModal').style.display = 'none';
    renderSopStep();
    document.getElementById('sopOverlay').classList.add('active');
  }

  function renderSopStep(){
    const steps = sopDish.cookingSteps;
    const step = steps[sopStepIndex];

    document.getElementById('sopDishName').textContent = sopDish.name + '｜' + sopServings + ' 人份';
    document.getElementById('sopStepCount').textContent = 'STEP ' + (sopStepIndex + 1) + ' / ' + steps.length;

    document.getElementById('sopProgress').innerHTML = steps.map((_, i) =>
      '<span class="sop-dot' + (i <= sopStepIndex ? ' filled' : '') + '"></span>'
    ).join('');

    let badges = '<span class="sop-badge">🔥 ' + step.heatLevel + '</span>';
    if(step.time){ badges += '<span class="sop-badge time">⏱ ' + step.time + ' 分鐘</span>'; }
    document.getElementById('sopBadges').innerHTML = badges;
    document.getElementById('sopDesc').textContent = step.description;

    const tipEl = document.getElementById('sopTip');
    if(step.tip){
      tipEl.style.display = 'block';
      tipEl.textContent = '💡 小提醒：' + step.tip;
    } else {
      tipEl.style.display = 'none';
    }

    document.getElementById('sopPrevBtn').disabled = (sopStepIndex === 0);
    document.getElementById('sopNextBtn').textContent = (sopStepIndex === steps.length - 1) ? '完成料理' : '完成，下一步 →';
  }

  function sopNext(){
    const steps = sopDish.cookingSteps;
    if(sopStepIndex < steps.length - 1){
      sopStepIndex++;
      renderSopStep();
    } else {
      finishSOP();
    }
  }

  function sopPrev(){
    if(sopStepIndex > 0){
      sopStepIndex--;
      renderSopStep();
    }
  }

  function finishSOP(){
    document.getElementById('sopStepScreen').style.display = 'none';
    document.getElementById('sopDoneScreen').style.display = 'block';
    document.getElementById('sopDoneDishName').textContent = sopDish.name;
    renderSopSignatureBtn();
    renderSopCookLogBtn();

    // 完成SOP＝這道料理這次已經煮完了：從「這次要煮」移除，
    // 但「我的菜單」是長期收藏，完全不受影響
    const wasInSelectedMenu = isInSelectedMenu(sopDish.id);
    removeFromSelectedMenu(sopDish.id);

    const noteEl = document.getElementById('sopDoneMenuNote');
    if(wasInSelectedMenu){
      noteEl.textContent = '已從「這次要煮」移除・目前還有 ' + selectedMenuDishIds.length + ' 道';
      noteEl.style.display = 'block';
    } else {
      noteEl.textContent = '';
      noteEl.style.display = 'none';
    }
  }

  // SOP完成畫面的「加入我的菜單」按鈕：完成料理的當下就能
  // 一併收藏，不用另外跳回詳細頁才找得到這個按鈕
  function renderSopSignatureBtn(){
    const btn = document.getElementById('sopSignatureBtn');
    if(!btn || !sopDish) return;
    if(isFreePlan()){
      btn.textContent = '🔒 我的菜單（付費功能）';
      btn.classList.remove('added');
      return;
    }
    const inSignature = mySignatureDishIds.includes(sopDish.id);
    btn.textContent = inSignature ? '✓ 已加入我的菜單' : '⭐ 加入我的菜單';
    btn.classList.toggle('added', inSignature);
  }
  function renderSopCookLogBtn(){
    const btn = document.getElementById('sopCookLogBtn');
    if(!btn) return;
    btn.textContent = isFreePlan() ? '🔒 儲存料理紀錄（付費功能）' : '📝 儲存料理紀錄';
  }

  function requestLeaveSOP(){
    document.getElementById('sopLeaveModal').style.display = 'flex';
  }
  function closeLeaveModal(){
    document.getElementById('sopLeaveModal').style.display = 'none';
  }
  function confirmLeaveSOP(){
    // 離開不標記完成，也不寫入任何完成紀錄
    document.getElementById('sopLeaveModal').style.display = 'none';
    document.getElementById('sopOverlay').classList.remove('active');
  }
  function exitSopDone(){
    document.getElementById('sopOverlay').classList.remove('active');
  }

  document.getElementById('sopCloseBtn').addEventListener('click', requestLeaveSOP);
  document.getElementById('sopPrevBtn').addEventListener('click', sopPrev);
  document.getElementById('sopNextBtn').addEventListener('click', sopNext);
  document.getElementById('sopStayBtn').addEventListener('click', closeLeaveModal);
  document.getElementById('sopLeaveBtn').addEventListener('click', confirmLeaveSOP);
  document.getElementById('sopDoneExitBtn').addEventListener('click', exitSopDone);

  document.getElementById('sopCookLogBtn').addEventListener('click', () => {
    if(!sopDish) return;
    if(isFreePlan()){
      openUpgradeView();
      return;
    }
    showCookLogModal(sopDish);
  });
  document.getElementById('sopSignatureBtn').addEventListener('click', () => {
    if(!sopDish) return;
    if(isFreePlan()){
      openUpgradeView();
      return;
    }
    toggleSignatureDish(sopDish.id);
    renderSopSignatureBtn();
  });

  /* =========================================================
     我有食材（畫面狀態與渲染）
     ---------------------------------------------------------
     三個畫面狀態：
     - categories：landing頁，「今天冰箱裡有什麼？」+ 分類按鈕
       （主要操作方式，不是文字輸入框）
     - category-detail：點某個分類後，該分類食材的勾選清單
     - results：按「看看我可以煮什麼」後才顯示比對結果
       （不是即時邊選邊算，避免畫面一開始就塞滿資訊）
     selectedIngredients／userCreatedIngredients 已在資料層
     中透過 localStorage 載入，這裡只負責畫面。
     ========================================================= */
  let ingredientsScreen = 'categories';
  let ingredientsActiveCategory = null;
  let ingredientSearchQuery = '';
  let categoryDetailSearchQuery = '';

  function toggleIngredientSelection(id){
    const idx = selectedIngredients.indexOf(id);
    if(idx === -1){
      selectedIngredients.push(id);
    } else {
      selectedIngredients.splice(idx, 1);
    }
    saveSelectedIngredients();
    renderIngredientsView();
  }

  function renderSelectedBar(){
    if(selectedIngredients.length === 0){
      return '<div class="my-ingredients-bar"><p class="my-ingredients-empty">尚未選擇食材</p></div>';
    }
    const chips = selectedIngredients.map(id => {
      const ing = findIngredientById(id);
      const label = ing ? ing.name : id;
      return '<button class="my-ing-chip" data-remove-id="' + id + '">' + label + ' <span class="remove-x">×</span></button>';
    }).join('');
    return '<div class="my-ingredients-bar">' +
      '<div class="clear-row">' +
        '<p class="my-ingredients-label">已選 ' + selectedIngredients.length + ' 種食材</p>' +
        '<button class="clear-link-btn" id="clearIngredientsBtn">清空</button>' +
      '</div>' +
      '<div class="my-ingredients-chips">' + chips + '</div>' +
    '</div>';
  }

  function bindClearIngredientsBtn(){
    const btn = document.getElementById('clearIngredientsBtn');
    if(btn){
      btn.addEventListener('click', () => {
        if(!selectedIngredients.length) return;
        askConfirm('清空已選食材', '目前選了 ' + selectedIngredients.length + ' 樣食材，清空後要重新挑選。', function(){
          selectedIngredients = [];
          saveSelectedIngredients();
          renderIngredientsView();
          showToast('已清空');
        }, '清空');
      });
    }
  }

  function renderCtaButton(){
    const count = selectedIngredients.length;
    const disabled = count === 0;
    return '<div class="ingredients-cta-wrap">' +
      '<button class="ingredients-cta-btn" id="viewResultsBtn"' + (disabled ? ' disabled' : '') + '>' +
        (disabled ? '請先選擇食材' : '已選 ' + count + ' 項 ｜ 看看可以煮什麼 →') +
      '</button>' +
    '</div>';
  }

  function renderIngredientCheckRow(id){
    const ing = findIngredientById(id);
    if(!ing) return '';
    const selected = selectedIngredients.includes(id);
    const inStock = isNameInInventory(ing.name);
    return '<button class="ing-check-row' + (selected ? ' selected' : '') + '" data-ingredient-id="' + id + '">' +
      '<span class="ing-check-box">' + (selected ? '☑' : '☐') + '</span>' +
      '<span class="ing-check-icon">' + ing.icon + '</span>' +
      '<span class="ing-check-name">' + ing.name + '</span>' +
      (inStock ? '<span class="ing-stock-hint">庫存中</span>' : '') +
    '</button>';
  }

  // ---------- categories 畫面 ----------
  function renderCategoriesScreen(){
    let html = '';
    html += '<p class="ingredients-headline">今天冰箱裡有什麼？</p>';
    html += renderSelectedBar();

    html += '<div class="search-wrap"><label class="search-box">';
    html += '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#867A6C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
    html += '<input type="text" id="ingredientSearchInput" placeholder="搜尋食材" autocomplete="off">';
    html += '</label></div>';

    html += '<div id="ingredientSearchResultsContainer">' + renderCategoriesOrSearchBody() + '</div>';
    html += renderCtaButton();

    document.getElementById('ingredientsContent').innerHTML = html;
    document.getElementById('ingredientSearchInput').value = ingredientSearchQuery;
    bindCategoriesScreenEvents();
  }

  // 依目前是否有搜尋文字，決定顯示「分類按鈕」還是「搜尋結果勾選清單」
  function renderCategoriesOrSearchBody(){
    const q = ingredientSearchQuery.trim();
    if(!q){
      return '<div class="ingredient-category-grid">' +
        getIngredientCategories().map(cat =>
          '<button class="ingredient-category-btn" data-category="' + cat + '">' +
            '<span class="ingredient-category-icon">' + ingredientCategoryIcon(cat) + '</span>' +
            '<span class="ingredient-category-name">' + cat + '</span>' +
          '</button>'
        ).join('') +
      '</div>';
    }
    const query = q.toLowerCase();
    const matches = getAllIngredients().filter(e =>
      e.name.toLowerCase().includes(query) || (e.aliases || []).some(a => a.toLowerCase().includes(query))
    ).sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    if(matches.length === 0){
      return '<div class="ingredient-empty-state">' +
        '<p class="ingredient-empty-emoji">🔍</p>' +
        '<p class="ingredient-empty-title">目前資料庫還沒有這個食材</p>' +
        '<p class="ingredient-empty-desc">換個關鍵字試試看</p>' +
      '</div>';
    }
    return '<div class="ing-check-list">' + matches.map(e => renderIngredientCheckRow(e.id)).join('') + '</div>';
  }

  // 只更新搜尋結果區塊，不重繪整頁，輸入框才不會失去焦點
  function updateIngredientSearchResultsOnly(){
    document.getElementById('ingredientSearchResultsContainer').innerHTML = renderCategoriesOrSearchBody();
    bindSearchResultsAreaEvents();
  }

  function bindSearchResultsAreaEvents(){
    document.querySelectorAll('#ingredientSearchResultsContainer .ingredient-category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        ingredientsActiveCategory = btn.dataset.category;
        ingredientsScreen = 'category-detail';
        ingredientSearchQuery = '';
        categoryDetailSearchQuery = '';
        renderIngredientsView();
        window.scrollTo(0, 0);
      });
    });
    document.querySelectorAll('#ingredientSearchResultsContainer .ing-check-row').forEach(btn => {
      btn.addEventListener('click', () => toggleIngredientSelection(btn.dataset.ingredientId));
    });
  }

  function bindCategoriesScreenEvents(){
    document.getElementById('ingredientSearchInput').addEventListener('input', (e) => {
      ingredientSearchQuery = e.target.value;
      updateIngredientSearchResultsOnly();
    });
    bindSearchResultsAreaEvents();
    bindClearIngredientsBtn();
    document.querySelectorAll('.my-ing-chip').forEach(chip => {
      chip.addEventListener('click', () => toggleIngredientSelection(chip.dataset.removeId));
    });
    const ctaBtn = document.getElementById('viewResultsBtn');
    ctaBtn.addEventListener('click', () => {
      if(selectedIngredients.length === 0) return;
      ingredientsScreen = 'results';
      renderIngredientsView();
      window.scrollTo(0, 0);
    });
  }

  // ---------- category-detail 畫面 ----------
  function renderCategoryDetailBody(){
    const cat = ingredientsActiveCategory;
    const q = categoryDetailSearchQuery.trim().toLowerCase();
    let items = getAllIngredients().filter(e => e.category === cat);
    if(q){
      items = items.filter(e => e.name.toLowerCase().includes(q) || (e.aliases || []).some(a => a.toLowerCase().includes(q)));
    }
    items = items.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    if(items.length === 0){
      return '<div class="ingredient-empty-state">' +
        '<p class="ingredient-empty-emoji">🔍</p>' +
        '<p class="ingredient-empty-title">這個分類裡沒有符合的食材</p>' +
        '<p class="ingredient-empty-desc">換個關鍵字試試看</p>' +
      '</div>';
    }
    return '<div class="ing-check-list">' + items.map(e => renderIngredientCheckRow(e.id)).join('') + '</div>';
  }

  // 只更新搜尋結果區塊，不重繪整頁，輸入框才不會失去焦點
  function updateCategoryDetailResultsOnly(){
    document.getElementById('categoryDetailResultsContainer').innerHTML = renderCategoryDetailBody();
    bindCategoryDetailResultsEvents();
  }

  function bindCategoryDetailResultsEvents(){
    document.querySelectorAll('#categoryDetailResultsContainer .ing-check-row').forEach(btn => {
      btn.addEventListener('click', () => toggleIngredientSelection(btn.dataset.ingredientId));
    });
  }

  function renderCategoryDetailScreen(){
    const cat = ingredientsActiveCategory;
    let html = '';
    html += renderSelectedBar();
    html += '<p class="section-label">' + ingredientCategoryIcon(cat) + ' ' + cat + '</p>';

    html += '<div class="search-wrap"><label class="search-box">';
    html += '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#867A6C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
    html += '<input type="text" id="categoryDetailSearchInput" placeholder="在' + cat + '裡搜尋" autocomplete="off">';
    html += '</label></div>';

    html += '<div id="categoryDetailResultsContainer">' + renderCategoryDetailBody() + '</div>';
    html += renderCtaButton();

    document.getElementById('ingredientsContent').innerHTML = html;
    document.getElementById('categoryDetailSearchInput').value = categoryDetailSearchQuery;
    document.getElementById('categoryDetailSearchInput').addEventListener('input', (e) => {
      categoryDetailSearchQuery = e.target.value;
      updateCategoryDetailResultsOnly();
    });
    bindClearIngredientsBtn();
    document.querySelectorAll('.my-ing-chip').forEach(chip => {
      chip.addEventListener('click', () => toggleIngredientSelection(chip.dataset.removeId));
    });
    bindCategoryDetailResultsEvents();
    const ctaBtn = document.getElementById('viewResultsBtn');
    ctaBtn.addEventListener('click', () => {
      if(selectedIngredients.length === 0) return;
      ingredientsScreen = 'results';
      renderIngredientsView();
      window.scrollTo(0, 0);
    });
  }

  // ---------- results 畫面 ----------
  function renderIngredientResultDishCard(r){
    const d = r.dish;
    let badge, missingLine = '';
    if(r.missingCount === 0){
      badge = '<span class="match-badge ok">🟢 可以煮</span>';
    } else if(r.missingCount <= 2){
      badge = '<span class="match-badge mid">🟡 還缺 ' + r.missingCount + ' 種食材</span>';
      missingLine = '<p class="match-missing">缺少：' + r.missing.join('、') + '</p>';
    } else {
      badge = '<span class="match-badge low">⚪ 需要再準備一些食材</span>';
      missingLine = '<p class="match-missing">缺少：' + r.missing.join('、') + '</p>';
    }
    const haveLine = r.have.length
      ? '<p class="match-have">可用食材：' + r.have.join('、') + '</p>'
      : '';
    return '<div class="dish-card" data-id="' + d.id + '">' +
      '<div class="dish-card-emoji">' + getDishIcon(d) + '</div>' +
      '<div class="dish-card-body">' +
        '<p class="dish-card-name">' + d.name + '</p>' +
        '<div class="dish-card-meta">' +
          '<span class="tag">' + d.difficulty + '</span>' +
          '<span class="tag">' + (d.prepTime + d.cookTime) + ' 分鐘</span>' +
          '<span class="tag">' + getMenuServings(d.id) + ' 人份</span>' +
        '</div>' +
        badge + haveLine + missingLine +
      '</div>' +
    '</div>';
  }

  function renderResultsScreen(){
    let html = '<p class="menu-headline">可以煮什麼</p>';
    const results = getAvailableDishesForIngredients(selectedIngredients);
    if(results.length === 0){
      html += '<div class="ingredient-empty-state">' +
        '<p class="ingredient-empty-emoji">🧺</p>' +
        '<p class="ingredient-empty-title">目前還沒有找到適合的料理</p>' +
        '<p class="ingredient-empty-desc">再選幾樣食材試試看</p>' +
      '</div>';
    } else {
      html += '<p class="section-label">可以煮的料理</p>';
      html += '<div class="result-list" id="ingredientResultsContainer">' +
        results.map(r => renderIngredientResultDishCard(r)).join('') +
      '</div>';
    }
    document.getElementById('ingredientsContent').innerHTML = html;
    const resultsContainer = document.getElementById('ingredientResultsContainer');
    if(resultsContainer){
      resultsContainer.querySelectorAll('.dish-card').forEach(card => {
        card.addEventListener('click', () => openDetail(card.dataset.id, 'find-ingredients'));
      });

  function renderIngredientsView(){
    if(ingredientsScreen === 'categories'){
      renderCategoriesScreen();
    } else if(ingredientsScreen === 'category-detail'){
      renderCategoryDetailScreen();
    } else {
      renderResultsScreen();
    }

  /* =========================================================
     這次要煮（畫面邏輯）
     ---------------------------------------------------------
     selectedMenuDishIds 現在完全獨立，不依附任何長期收藏。
     「☑ 標記已完成」是不透過 SOP 的快速完成路徑，會建立一筆
     沒有評分的 cookLog（代表確實做過），跟「✕ 移除」（純粹
     這次不煮了、不算做過）語意上是不同的動作。
     ========================================================= */
  function openSelectedMenuView(){
    renderSelectedMenuView();
    navigate('selected-menu');
  }

  function renderSelectedMenuCard(dish){
    const servings = getMenuServings(dish.id);
    const meal = getMealTime(dish.id);
    const mealLocked = isFreePlan();
    return '<div class="menu-card" data-dish-id="' + dish.id + '">' +
      '<div class="menu-card-head">' +
        '<div class="menu-card-emoji">' + getDishIcon(dish) + '</div>' +
        '<div class="menu-card-body">' +
          '<p class="menu-card-name">' + dish.name + '</p>' +
          '<p class="menu-card-meta">' + dish.difficulty + '｜' + (dish.prepTime + dish.cookTime) + ' 分鐘</p>' +
        '</div>' +
      '</div>' +
      '<div class="menu-card-servings">' +
        '<button class="menu-serv-btn" data-serv-minus="' + dish.id + '">－</button>' +
        '<span class="menu-serv-value">' + servings + ' 人份</span>' +
        '<button class="menu-serv-btn" data-serv-plus="' + dish.id + '">＋</button>' +

      '<div class="meal-chip-row' + (mealLocked ? ' locked' : '') + '">' +
        (mealLocked
          ? '<button class="meal-chip meal-chip-locked" data-meal-locked="1">🔒 分早中晚是付費功能，點這裡看方案</button>'
          : '<button class="meal-chip' + (meal === 'breakfast' ? ' active' : '') + '" data-meal-dish="' + dish.id + '" data-meal="breakfast">🌅 早餐</button>' +
            '<button class="meal-chip' + (meal === 'lunch' ? ' active' : '') + '" data-meal-dish="' + dish.id + '" data-meal="lunch">☀️ 午餐</button>' +
            '<button class="meal-chip' + (meal === 'dinner' ? ' active' : '') + '" data-meal-dish="' + dish.id + '" data-meal="dinner">🌙 晚餐</button>') +

      '<div class="selected-menu-card-actions">' +
        '<button class="selected-menu-action-btn remove" data-remove-selected="' + dish.id + '">✕ 移除</button>' +
      '</div>' +
    '</div>';
