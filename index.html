<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食在料理｜今天，煮什麼？</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A8462E">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-page:#FBF8F3;   /* 智在生活標準底色（頁面）*/
    --color-bg:#F6F1E7;     /* 淺色填充：晶片、標籤、次要區塊 */
    --color-surface:#FFFFFF;
    --color-text:#2B241D;
    --color-text-soft:#867A6C;
    --color-accent:#A8462E;
    --color-danger:#C0392B;   /* 刪除／登出，四支一致 */
    --color-accent-dark:#8A3722;
    --color-accent-soft:#F1DCD2;
    --color-jade:#4F6A52;
  /* ── 智在生活共用命名（四個 App 都用這組名字，值各自不同）── */
  --primary:#A8462E; --danger:#C0392B; --ink:#2B241D; --sub:#867A6C;
  --line:#E7DDCC; --surface:#FFFFFF; --bg:#FBF8F3;
    --color-jade-soft:#E1E9DE;
    --color-border:#E7DDCC;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --radius-pill:999px;

    /* ---- Typography Design System ---- */
    --font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    --weight-regular:400;
    --weight-medium:500;
    --weight-semibold:600;
    --weight-bold:700;

    --fs-title:26px;       /* App Logo / 主標 */
    --fs-heading:22px;     /* 頁面標題 */
    --fs-section:18px;     /* 區塊標題 */
    --fs-card-title:17px;  /* 料理名稱 */
    --fs-body:15px;        /* 一般正文 / 食材名稱 / 按鈕 */
    --fs-caption:13px;     /* 輔助資訊 */
    --fs-label:12px;       /* 小標籤 */

    --lh-tight:1.3;   /* 大標題 */
    --lh-base:1.6;    /* 一般文字 */
    --lh-loose:1.75;  /* 料理步驟 */
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--color-page);
    color:var(--color-text);
    font-family:var(--font-family);
    font-size:var(--fs-body);
    font-weight:var(--weight-regular);
    line-height:var(--lh-base);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--color-page);
    position:relative;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }

  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Sub-page header (search / detail) ---------- */
  .page-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 22px 14px;
  }
  .back-btn{
    width:38px; height:38px;
    border-radius:var(--radius-pill);
    border:1px solid var(--color-border);
    background:var(--color-surface);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .back-btn:active{transform:scale(0.94);}
  .header-upgrade-btn{
    margin-left:auto; flex-shrink:0;
    padding:0 14px; height:34px; border-radius:var(--radius-pill);
    border:1px solid var(--color-accent); background:var(--color-accent);
    color:#FBF3EE; font-size:var(--fs-caption); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .header-upgrade-btn:active{transform:scale(0.94);}
  .upgrade-compare{margin:14px 22px; border:1px solid var(--color-border); border-radius:var(--radius-lg); overflow:hidden;}
  .upgrade-compare-row{
    display:grid; grid-template-columns:1fr 60px 60px; align-items:center;
    padding:12px 14px; border-bottom:1px solid var(--color-border); background:var(--color-surface);
    font-size:var(--fs-caption); text-align:center;
  }
  .upgrade-compare-row:last-child{border-bottom:none;}
  .upgrade-compare-row span:first-child{text-align:left;}
  .upgrade-compare-label{color:var(--color-text); font-weight:var(--weight-medium);}
  .upgrade-compare-header{background:var(--color-bg); font-weight:var(--weight-bold); color:var(--color-text-soft);}
  .upgrade-line-btn{
    display:block; margin:20px 22px 0; background:#06C755; color:#fff; text-align:center;
    padding:14px; border-radius:var(--radius-md); font-weight:var(--weight-semibold); font-size:var(--fs-body);
    text-decoration:none; font-family:var(--font-family);
  }
  .upgrade-note{margin:12px 22px 0; font-size:var(--fs-label); color:var(--color-text-soft); text-align:center; line-height:var(--lh-base);}
  .header-settings-btn{
    flex-shrink:0;
    width:38px; height:38px; border-radius:var(--radius-pill);
    border:1px solid var(--color-border); background:var(--color-surface);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .header-settings-btn:active{transform:scale(0.94);}
  .page-title{
    font-weight:var(--weight-bold);
    font-size:var(--fs-heading);
    line-height:var(--lh-tight);
    margin:0;
  }

  /* ---------- Search box ---------- */
  .search-wrap{padding:4px 22px 18px;}
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-pill);
    padding:14px 18px;
    box-shadow:0 1px 0 rgba(43,36,29,0.03);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-box:focus-within{border-color:var(--color-accent); box-shadow:0 0 0 3px var(--color-accent-soft);}
  .search-box svg{flex-shrink:0;}
  .search-box input{
    border:none; outline:none; background:transparent;
    font-size:var(--fs-body); font-weight:var(--weight-regular); font-family:var(--font-family); color:var(--color-text);
    flex:1; min-width:0;
  }
  .search-box input::placeholder{color:var(--color-text-soft);}

  .section-label{padding:0 22px 12px; font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);}

  /* ---------- 找食譜：頂層選擇畫面 ---------- */
  .find-choice-list{padding:8px 22px 20px; display:flex; flex-direction:column; gap:14px;}
  .home-greeting{
    font-size:var(--fs-heading); font-weight:var(--weight-bold); color:var(--color-text);
    padding:18px 22px 4px; margin:0; line-height:var(--lh-tight);
  }
  .home-status-row{display:flex; gap:12px; padding:12px 22px 4px;}
  .home-status-card{
    flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg);
    padding:14px 16px; cursor:pointer; -webkit-tap-highlight-color:transparent; text-align:left;
    font-family:var(--font-family);
  }
  .home-status-card:active{transform:scale(0.98);}
  .home-status-num{font-size:24px; font-weight:var(--weight-bold); color:var(--color-accent-dark); line-height:1.2;}
  .home-status-label{font-size:var(--fs-caption); color:var(--color-text-soft);}
  .home-inspire-section{padding:14px 0 4px;}
  .home-inspire-title{font-size:var(--fs-body); font-weight:var(--weight-semibold); color:var(--color-text); margin:0 22px 10px;}
  .home-inspire-scroll{display:flex; gap:12px; overflow-x:auto; padding:0 22px 4px; scrollbar-width:none;}
  .home-inspire-scroll::-webkit-scrollbar{display:none;}
  .home-inspire-card{
    flex-shrink:0; width:96px; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg);
    padding:14px 8px; cursor:pointer; -webkit-tap-highlight-color:transparent; font-family:var(--font-family);
  }
  .home-inspire-card:active{transform:scale(0.96);}
  .home-inspire-emoji{font-size:26px;}
  .home-inspire-name{font-size:var(--fs-caption); font-weight:var(--weight-semibold); color:var(--color-text); text-align:center; line-height:var(--lh-tight);}
  .find-choice-btn{
    display:flex; align-items:center; gap:16px; width:100%;
    padding:22px 20px; border-radius:var(--radius-lg);
    border:1px solid var(--color-border); background:var(--color-surface);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    font-family:var(--font-family); text-align:left;
    transition:transform .1s ease, border-color .12s ease;
  }
  .find-choice-btn:active{transform:scale(0.98);}
  .find-choice-icon{font-size:32px; flex-shrink:0;}
  .find-choice-body{display:flex; flex-direction:column; gap:4px;}
  .find-choice-title{font-size:var(--fs-card-title); font-weight:var(--weight-bold); color:var(--color-text);}
  .find-choice-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);}

  /* ---------- Category chips ---------- */
  .chip-row{
    display:flex; gap:8px;
    padding:0 22px 18px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .shopping-tab-row{display:flex; gap:8px; padding:14px 22px 4px;}
  .shopping-tab-btn{
    flex:1; padding:11px; border-radius:var(--radius-md); border:1px solid var(--color-border);
    background:var(--color-surface); color:var(--color-text-soft);
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .shopping-tab-btn.active{background:var(--color-accent); color:#FBF3EE; border-color:var(--color-accent);}
  .inventory-item-row{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:12px 14px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-surface);
  }
  .inventory-item-name{flex:1; font-size:var(--fs-body); font-weight:var(--weight-medium); color:var(--color-text);}
  .inventory-item-amount{font-size:var(--fs-caption); color:var(--color-text-soft); margin-right:4px;}
  .inventory-item-used-btn{
    flex-shrink:0; padding:6px 12px; border-radius:var(--radius-pill); border:1px solid var(--color-border);
    background:var(--color-bg); color:var(--color-text-soft);
    font-size:var(--fs-caption); font-weight:var(--weight-medium); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .chip{
    flex-shrink:0;
    padding:8px 16px;
    border-radius:var(--radius-pill);
    border:1px solid var(--color-border);
    background:var(--color-surface);
    color:var(--color-text-soft);
    font-size:var(--fs-caption);
    font-weight:var(--weight-medium);
    font-family:var(--font-family);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip.active{
    background:var(--color-accent);
    border-color:var(--color-accent);
    color:#FBF3EE;
  }

  .app-version{
    text-align:center; padding:20px 22px 12px; margin:0;
    font-size:var(--fs-label); font-weight:var(--weight-regular); color:var(--color-text-soft); opacity:0.6;
  }

  /* ---------- 設定頁 ---------- */
  .settings-list{padding:0 22px; display:flex; flex-direction:column; gap:10px;}
  .settings-row{
    display:flex; align-items:center; gap:14px; width:100%;
    padding:16px; border-radius:var(--radius-lg);
    background:var(--color-surface); border:1px solid var(--color-border);
    cursor:pointer; -webkit-tap-highlight-color:transparent; font-family:var(--font-family); text-align:left;
  }
  .settings-row-icon{font-size:20px; flex-shrink:0;}
  .settings-row-label{font-size:var(--fs-body); font-weight:var(--weight-semibold); color:var(--color-text);}
  .settings-row.danger .settings-row-label{color:var(--color-danger); font-weight:var(--weight-bold);}
  .settings-row.admin{background:var(--color-accent-soft); border-color:var(--color-accent);}

  /* ---------- 訂閱管理後台 ---------- */
  .admin-actions-row{display:flex; gap:10px; padding:0 22px 14px;}
  .admin-action-btn{
    flex:1; padding:12px; border-radius:var(--radius-md); border:1px solid var(--color-border);
    background:var(--color-jade-soft); color:var(--color-jade);
    font-size:var(--fs-caption); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .admin-action-btn.warn{background:var(--color-accent-soft); color:var(--color-accent-dark);}
  .admin-action-btn.warn.active{background:var(--color-accent); color:#FBF3EE;}
  .admin-action-btn.sim{border-style:dashed;}
  .admin-action-btn.sim.free{background:#FCE4EC; color:#AD1457; border-color:#F48FB1;}
  .admin-action-btn.sim.paid{background:#E3F2FD; color:#1565C0; border-color:#90CAF9;}
  .admin-card{
    margin:0 22px 14px; padding:16px; border-radius:var(--radius-lg);
    background:var(--color-surface); border:1px solid var(--color-border);
  }
  .admin-card-email{font-size:var(--fs-body); font-weight:var(--weight-bold); margin:0 0 6px; word-break:break-all;}
  .admin-card-meta{font-size:var(--fs-label); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0 0 4px;}
  .admin-status{font-weight:var(--weight-semibold);}
  .admin-status.expired{color:var(--color-accent-dark);}
  .admin-status.disabled{color:var(--color-text-soft);}
  .admin-status.active{color:var(--color-jade);}
  .admin-card-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .admin-card-btn{
    padding:9px 12px; border-radius:var(--radius-pill); border:1px solid var(--color-border);
    background:var(--color-bg); color:var(--color-text-soft);
    font-size:var(--fs-label); font-weight:var(--weight-medium); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .admin-card-btn.disable{color:var(--color-accent-dark); border-color:var(--color-accent);}
  .admin-card-btn.enable{color:var(--color-jade); border-color:var(--color-jade);}
  .admin-card-btn.delete{margin-top:8px; width:100%; text-align:center; color:var(--color-accent-dark); border-color:var(--color-accent);}

  /* SOP完成畫面：這次要煮同步提示 */
  .sop-done-menu-note{
    font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);
    margin:-14px 0 22px; display:none;
  }
  .dish-action-btn{
    width:100%; padding:15px; border:1px solid var(--color-border); border-radius:var(--radius-lg);
    background:var(--color-surface); color:var(--color-text);
    font-size:var(--fs-body); font-weight:var(--weight-bold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .12s ease;
  }
  .dish-action-btn:active{transform:scale(0.98);}
  .dish-action-btn.added{background:var(--color-jade-soft); color:var(--color-jade); border-color:var(--color-jade-soft);}



  /* ---------- Dish result cards ---------- */
  .result-list{padding:0 22px; display:flex; flex-direction:column; gap:12px;}
  .dish-card{
    display:flex; align-items:center; gap:14px;
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-lg);
    padding:16px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .dish-card:active{transform:scale(0.98);}
  .dish-card-emoji{
    width:48px; height:48px; border-radius:12px;
    background:var(--color-accent-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .dish-card-body{flex:1; min-width:0;}
  .dish-card-name{font-size:var(--fs-card-title); font-weight:var(--weight-bold); line-height:var(--lh-tight); margin:0 0 4px;}
  .dish-card-meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .tag{
    font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);
    background:var(--color-bg); padding:3px 9px; border-radius:var(--radius-pill);
  }
  .empty-state{
    padding:60px 30px; text-align:center; color:var(--color-text-soft); font-size:var(--fs-body); font-weight:var(--weight-regular); line-height:var(--lh-base);
  }

  /* ---------- Detail page ---------- */
  .detail-hero{padding:4px 22px 16px;}
  .detail-name{
    font-weight:var(--weight-bold); font-size:var(--fs-card-title); line-height:var(--lh-tight); margin:0 0 8px;
  }
  .detail-tags{display:flex; gap:8px; flex-wrap:wrap;}

  .stat-grid{
    margin:16px 22px 0;
    display:grid; grid-template-columns:repeat(2,1fr);
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-lg); overflow:hidden;
  }
  .stat-cell{
    padding:14px 8px; text-align:center;
    border-right:1px solid var(--color-border);
  }
  .stat-cell:last-child{border-right:none;}
  .stat-value{font-size:var(--fs-body); font-weight:var(--weight-semibold); margin:0;}
  .stat-label{font-size:var(--fs-label); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:2px 0 0;}

  .servings-card{
    margin:12px 22px 0;
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-lg); padding:16px 18px;
  }
  .servings-header{
    display:flex; align-items:center; gap:8px;
    font-size:var(--fs-section); font-weight:var(--weight-bold); margin-bottom:12px;
  }
  .servings-control{
    display:flex; align-items:center; justify-content:center; gap:22px;
    margin-bottom:12px;
  }
  .serv-btn{
    width:40px; height:40px; border-radius:50%;
    border:1px solid var(--color-border); background:var(--color-bg);
    font-size:20px; font-weight:var(--weight-bold); color:var(--color-accent);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease;
  }
  .serv-btn:active{transform:scale(0.9);}
  .servings-value{font-size:var(--fs-card-title); font-weight:var(--weight-bold); min-width:76px; text-align:center;}
  .servings-quick{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .serv-chip{
    padding:7px 14px; border-radius:var(--radius-pill);
    border:1px solid var(--color-border); background:var(--color-surface);
    font-size:var(--fs-caption); font-weight:var(--weight-medium); font-family:var(--font-family); color:var(--color-text-soft);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .serv-chip.active{background:var(--color-accent); border-color:var(--color-accent); color:#FBF3EE;}

  .rice-card{
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-md); overflow:hidden;
  }
  .rice-row{
    display:flex; justify-content:space-between; gap:12px;
    padding:11px 14px; font-size:var(--fs-body); font-weight:var(--weight-regular);
    border-bottom:1px solid var(--color-border);
  }
  .rice-row:last-child{border-bottom:none;}
  .rice-row span:first-child{color:var(--color-text-soft); flex-shrink:0;}
  .rice-row span:last-child{text-align:right;}

  /* ---------- 料理 SOP 模式（全螢幕獨立畫面）---------- */
  .sop-overlay{
    position:fixed; inset:0; background:var(--color-page);
    z-index:50; display:none;
  }
  .sop-overlay.active{display:flex; flex-direction:column;}
  .sop-inner{
    max-width:520px; margin:0 auto; width:100%; height:100%;
    display:flex; flex-direction:column; position:relative;
  }

  .sop-topbar{display:flex; align-items:flex-start; gap:12px; padding:18px 20px 6px;}
  .sop-close{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--color-border); background:var(--color-surface);
    font-size:19px; line-height:1; color:var(--color-text-soft);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .sop-title-group{flex:1; min-width:0;}
  .sop-dish-name{font-weight:var(--weight-bold); font-size:var(--fs-card-title); margin:6px 0 0;}
  .sop-step-count{font-size:14px; font-weight:var(--weight-semibold); color:var(--color-text-soft); margin:3px 0 0;}

  .sop-progress{display:flex; gap:6px; padding:14px 20px 6px;}
  .sop-dot{flex:1; height:6px; border-radius:3px; background:var(--color-border);}
  .sop-dot.filled{background:var(--color-accent);}

  .sop-content{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:10px 26px; text-align:center; overflow-y:auto;
  }
  .sop-badges{display:flex; gap:10px; justify-content:center; margin-bottom:20px; flex-wrap:wrap;}
  .sop-badge{
    font-size:16px; font-weight:var(--weight-medium); padding:8px 16px;
    border-radius:var(--radius-pill); background:var(--color-accent-soft); color:var(--color-accent-dark);
  }
  .sop-badge.time{background:var(--color-jade-soft); color:var(--color-jade);}
  .sop-desc{font-size:22px; line-height:var(--lh-base); font-weight:var(--weight-semibold); margin:0;}
  .sop-tip{
    margin-top:24px; background:var(--color-jade-soft); color:var(--color-text);
    padding:14px 16px; border-radius:var(--radius-md); font-size:14px; font-weight:var(--weight-regular); line-height:var(--lh-base); text-align:left;
  }

  .sop-actions{display:flex; gap:12px; padding:16px 20px calc(20px + env(safe-area-inset-bottom));}
  .sop-btn{
    flex:1; padding:17px; border-radius:var(--radius-lg);
    font-size:var(--fs-body); font-weight:var(--weight-semibold); border:none; cursor:pointer;
    font-family:var(--font-family); -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease;
  }
  .sop-btn.primary{background:var(--color-accent); color:#FBF3EE;}
  .sop-btn.secondary{background:var(--color-surface); border:1px solid var(--color-border); color:var(--color-text);}
  .sop-btn.danger{background:var(--color-accent); color:#FBF3EE;}
  .sop-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .sop-btn:active:not(:disabled){transform:scale(0.97);}

  .sop-done-content{
    padding:56px 28px 40px; text-align:center;
    display:flex; flex-direction:column; align-items:center;
  }
  .sop-done-emoji{font-size:46px; margin:0;}
  .sop-done-title{font-size:var(--fs-heading); font-weight:var(--weight-bold); line-height:var(--lh-tight); margin:8px 0 2px;}
  .sop-done-dish{font-size:var(--fs-card-title); font-weight:var(--weight-bold); margin:0 0 26px;}

  .sop-stars{display:flex; gap:8px; justify-content:center; font-size:30px; margin-bottom:14px; cursor:pointer;}
  .sop-star{color:var(--color-border); transition:color .1s ease;}
  .sop-star.filled{color:var(--color-accent);}
  .sop-note-input{
    width:100%; min-height:64px; border:1px solid var(--color-border); border-radius:var(--radius-sm);
    padding:10px 12px; font-family:var(--font-family); font-size:var(--fs-body); font-weight:var(--weight-regular); resize:vertical;
    margin-bottom:14px; background:var(--color-bg); color:var(--color-text); box-sizing:border-box;
  }
  .sop-done-exit{
    background:none; border:none; color:var(--color-text-soft); font-size:var(--fs-caption); font-weight:var(--weight-regular);
    text-decoration:underline; cursor:pointer; padding:8px; font-family:var(--font-family);
  }

  .sop-modal-backdrop{
    position:fixed; inset:0; background:rgba(43,36,29,0.5);
    display:none; align-items:center; justify-content:center; z-index:60; padding:24px;
  }
  .sop-modal{background:var(--color-surface); border-radius:var(--radius-lg); padding:24px; max-width:340px; width:100%;}
  .sop-modal-title{font-size:var(--fs-card-title); font-weight:var(--weight-bold); margin:0 0 18px; text-align:center;}
  .sop-modal-actions{display:flex; gap:10px;}

  /* ---------- 我有食材 ---------- */
  .ingredients-headline{padding:20px 22px 4px; font-size:var(--fs-heading); font-weight:var(--weight-bold); line-height:var(--lh-tight); margin:0;}

  .my-ingredients-bar{padding:16px 22px 4px;}
  .my-ingredients-label{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0 0 8px;}
  .clear-row{display:flex; align-items:center; justify-content:space-between; padding:0 22px 8px; gap:12px;}
  .clear-row .my-ingredients-label{padding:0; margin:0;}
  .clear-link-btn{
    flex-shrink:0; background:none; border:none; padding:0;
    color:var(--color-text-soft); font-size:var(--fs-caption); font-weight:var(--weight-medium);
    text-decoration:underline; cursor:pointer; font-family:var(--font-family);
  }
  .my-ingredients-bar .clear-row{padding-left:0; padding-right:0;}
  .my-ingredients-empty{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0 0 4px;}
  .my-ingredients-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .my-ing-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--color-accent-soft); color:var(--color-accent-dark);
    padding:8px 12px; border-radius:var(--radius-pill); font-size:var(--fs-caption); font-weight:var(--weight-medium);
    cursor:pointer; -webkit-tap-highlight-color:transparent; border:none; font-family:var(--font-family);
  }
  .my-ing-chip .remove-x{font-weight:var(--weight-bold);}

  /* 分類按鈕（landing 畫面的主要操作） */
  .ingredient-category-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
    padding:4px 22px 20px;
  }
  .ingredient-category-btn{
    display:flex; align-items:center; gap:10px;
    padding:18px 16px; border-radius:var(--radius-lg);
    border:1px solid var(--color-border); background:var(--color-surface);
    cursor:pointer; -webkit-tap-highlight-color:transparent; font-family:var(--font-family);
    transition:transform .1s ease;
  }
  .ingredient-category-btn:active{transform:scale(0.97);}
  .ingredient-category-icon{font-size:26px;}
  .ingredient-category-name{font-size:var(--fs-body); font-weight:var(--weight-semibold); color:var(--color-text);}

  /* 食材勾選清單（分類詳細頁／搜尋結果共用） */
  .ing-check-list{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:4px 22px 8px;}
  .ing-check-row{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    width:100%; min-height:64px; padding:10px 6px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-surface);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    font-family:var(--font-family); text-align:center; position:relative;
    transition:background .12s ease, border-color .12s ease;
  }
  .ing-check-row.selected{background:var(--color-jade-soft); border-color:var(--color-jade);}
  .ing-check-box{position:absolute; top:5px; right:7px; font-size:13px; color:var(--color-text-soft);}
  .ing-check-row.selected .ing-check-box{color:var(--color-jade);}
  .ing-check-icon{font-size:20px; line-height:1;}
  .ing-check-name{font-size:var(--fs-label); font-weight:var(--weight-medium); color:var(--color-text); line-height:1.25; word-break:break-all;}
  .ing-stock-hint{
    position:absolute; top:4px; left:5px;
    font-size:9px; font-weight:var(--weight-medium);
    color:var(--color-jade); background:var(--color-jade-soft);
    padding:1px 5px; border-radius:var(--radius-pill);
  }

  /* 固定於畫面底部的主要按鈕（各食材選擇畫面共用） */
  .ingredients-cta-wrap{
    position:fixed; left:0; right:0; bottom:calc(58px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto; z-index:9;
    padding:10px 22px; background:var(--color-bg);
    border-top:1px solid var(--color-border);
  }
  .ingredients-cta-btn{
    width:100%; padding:15px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .ingredients-cta-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .ingredients-cta-btn:active:not(:disabled){transform:scale(0.98);}

  .ingredient-empty-state{padding:56px 30px; text-align:center;}
  .ingredient-empty-emoji{font-size:40px; margin:0 0 10px;}
  .ingredient-empty-title{font-size:var(--fs-body); font-weight:var(--weight-semibold); margin:0 0 16px;}
  .ingredient-empty-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}

  .match-badge{
    display:inline-block; font-size:var(--fs-label); font-weight:var(--weight-semibold);
    padding:4px 10px; border-radius:var(--radius-pill); margin-top:8px;
  }
  .match-badge.ok{background:var(--color-jade-soft); color:var(--color-jade);}
  .match-badge.mid{background:var(--color-accent-soft); color:var(--color-accent-dark);}
  .match-badge.low{background:var(--color-bg); color:var(--color-text-soft); border:1px solid var(--color-border);}
  .match-have{font-size:12.5px; color:var(--color-jade, #2e7d5b); margin:4px 0 0;}
  .match-missing{font-size:var(--fs-label); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:4px 0 0;}

  /* ---------- 搜尋找不到時的空狀態（找料理/我有食材共用）---------- */
  .ai-empty-state{padding:44px 30px 40px;}
  .ai-empty-title{font-size:var(--fs-body); font-weight:var(--weight-semibold); color:var(--color-text); margin:0 0 16px;}
  .ai-empty-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:14px 0 0;}

  /* ---------- 文字輸入/送出按鈕（手動新增採購項目共用）---------- */
  .ai-name-input{
    width:100%; box-sizing:border-box; padding:14px 16px;
    border:1px solid var(--color-border); border-radius:var(--radius-md);
    font-size:var(--fs-body); font-weight:var(--weight-medium); font-family:var(--font-family);
    color:var(--color-text); background:var(--color-surface); margin-bottom:10px;
  }
  .ai-name-input:focus{outline:none; border-color:var(--color-accent);}
  .ai-generate-btn{
    width:100%; padding:16px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .ai-generate-btn:active{transform:scale(0.98);}

  /* ---------- 我的菜單 ---------- */
  .menu-headline{padding:20px 22px 4px; font-size:var(--fs-heading); font-weight:var(--weight-bold); line-height:var(--lh-tight); margin:0;}
  .menu-subtitle{padding:2px 22px 4px; font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}
  .menu-list{padding:16px 22px; display:flex; flex-direction:column; gap:12px;}
  .menu-card{
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-lg); padding:16px;
  }
  .menu-card-head{display:flex; align-items:center; gap:12px;}
  .menu-card-remove-btn{
    flex-shrink:0; width:28px; height:28px; border-radius:50%;
    border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-soft);
    font-size:14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .cook-log-row{
    padding:14px 16px; border-radius:var(--radius-lg); border:1px solid var(--color-border);
    background:var(--color-surface); margin-bottom:10px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .cook-log-row:active{transform:scale(0.99);}
  .cook-log-head{display:flex; align-items:center; gap:8px;}
  .cook-log-icon{font-size:20px; flex-shrink:0;}
  .cook-log-name{font-size:var(--fs-card-title); font-weight:var(--weight-bold); color:var(--color-text); flex:1; min-width:0;}
  .cook-log-date{font-size:var(--fs-label); color:var(--color-text-soft); flex-shrink:0;}
  .cook-log-edit{
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    border:1px solid var(--color-border); background:var(--color-bg);
    font-size:12px; cursor:pointer; -webkit-tap-highlight-color:transparent; margin-right:4px;
  }
  .cook-log-delete{
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-soft);
    font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .cook-log-stars{font-size:var(--fs-body); color:#E0A93B; margin:6px 0 0;}
  .cook-log-note{font-size:var(--fs-caption); color:var(--color-text-soft); margin:6px 0 0; line-height:var(--lh-base);}
  .menu-card-emoji{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:var(--color-accent-soft); display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .menu-card-body{flex:1; min-width:0;}
  .menu-card-name{font-size:var(--fs-card-title); font-weight:var(--weight-bold); margin:0 0 4px;}
  .menu-card-meta{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);}
  .menu-card-servings{
    display:flex; align-items:center; justify-content:center; gap:16px;
    margin-top:14px; padding-top:14px; border-top:1px solid var(--color-border);
  }
  .menu-serv-btn{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--color-border);
    background:var(--color-bg); color:var(--color-accent); font-size:16px; font-weight:var(--weight-bold);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .menu-serv-value{font-size:var(--fs-body); font-weight:var(--weight-semibold); min-width:56px; text-align:center;}

  .meal-chip-row{display:flex; gap:8px; margin-top:12px;}
  .meal-chip{
    flex:1; padding:8px 4px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-soft);
    font-size:var(--fs-label); font-weight:var(--weight-medium); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .meal-chip.active{background:var(--color-accent-soft); border-color:var(--color-accent); color:var(--color-accent-dark);}
  .meal-chip-locked{
    flex:1; padding:9px 8px; border-radius:var(--radius-md); border:1px dashed var(--color-border);
    background:var(--color-bg); color:var(--color-text-soft);
    font-size:var(--fs-label); font-weight:var(--weight-medium); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent; text-align:center;
  }

  .selected-menu-start-btn{
    display:block; width:100%; margin-top:14px; padding:13px;
    border:none; border-radius:var(--radius-md); background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .selected-menu-start-btn:active{transform:scale(0.98);}
  .selected-menu-card-actions{
    display:flex; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--color-border);
  }
  .selected-menu-action-btn{
    flex:1; padding:10px; border-radius:var(--radius-md); border:1px solid var(--color-border);
    background:var(--color-bg); color:var(--color-text); font-size:var(--fs-caption); font-weight:var(--weight-medium);
    font-family:var(--font-family); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .selected-menu-action-btn.remove{border-color:var(--color-accent); color:var(--color-accent-dark); background:var(--color-accent-soft);}

  .menu-empty-state{padding:60px 30px; text-align:center;}
  .menu-empty-emoji{font-size:40px; margin:0 0 10px;}
  .menu-empty-title{font-size:var(--fs-body); font-weight:var(--weight-semibold); margin:0 0 6px;}
  .menu-empty-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}

  .menu-cta-wrap{padding:8px 22px 24px;}
  .menu-cta-btn{
    width:100%; padding:16px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .menu-cta-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .menu-cta-btn:active:not(:disabled){transform:scale(0.98);}
  .menu-cta-hint{padding:0 22px 20px; font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); text-align:center;}

  /* ---------- 購物清單 ---------- */
  /* 新增鈕靠右上——是次要動作，不該擋在清單正上方 */
  .shopping-actions-row{display:flex; flex-wrap:wrap; gap:16px; padding:0 22px 14px; justify-content:flex-end;}
  .shopping-action-link{
    background:none; border:none; padding:0;
    color:var(--color-accent-dark); font-size:var(--fs-caption); font-weight:var(--weight-semibold);
    text-decoration:underline; cursor:pointer; font-family:var(--font-family);
  }
  .manual-add-form{padding:0 22px 18px; display:flex; flex-direction:column; gap:10px;}
  .manual-category-label{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}
  .manual-category-row{padding:0; flex-wrap:wrap; overflow-x:visible;}
  .manual-form-actions{display:flex; gap:10px; align-items:stretch;}
  .manual-form-actions .ai-generate-btn{flex:1; margin:0;}
  .manual-form-cancel{padding:12px 18px; font-size:var(--fs-body); font-weight:var(--weight-medium);
    color:var(--color-text-soft); background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:12px; cursor:pointer;}
  .shopping-group{padding:0 22px 20px;}
  .shopping-group-title{
    font-size:var(--fs-section); font-weight:var(--weight-bold); margin:0 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .shopping-item-list{display:flex; flex-direction:column; gap:8px;}
  .shopping-group .shopping-item-wrap + .shopping-item-wrap{margin-top:8px;}
  .ing-suggest-box{margin-top:6px;}
  .ing-suggest-list{
    display:flex; flex-direction:column;
    border:1px solid var(--color-border); border-radius:var(--radius-md);
    background:var(--color-surface); overflow:hidden; max-height:230px; overflow-y:auto;
  }
  .ing-suggest-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 13px; border:none; border-bottom:1px solid var(--color-border);
    background:transparent; color:var(--color-text); text-align:left;
    font-size:var(--fs-caption); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .ing-suggest-item:last-child{border-bottom:none;}
  .ing-suggest-item:active{background:var(--color-bg);}
  .ing-suggest-cat{
    flex-shrink:0; font-size:var(--fs-label); color:var(--color-text-soft);
    background:var(--color-bg); padding:2px 8px; border-radius:var(--radius-pill);
  }
  .ing-suggest-empty{
    margin:0; padding:10px 13px; font-size:var(--fs-label);
    color:var(--color-text-soft); background:var(--color-bg);
    border:1px dashed var(--color-border); border-radius:var(--radius-md);
  }

  .shopping-dish-toggle-wrap{padding:5px 0 0 14px;}
  .shopping-dish-toggle-wrap .shopping-dish-links{padding:6px 0 0 0;}
  .shopping-dish-toggle{
    padding:3px 9px; border-radius:var(--radius-pill);
    border:1px dashed var(--color-border); background:transparent; color:var(--color-text-soft);
    font-size:var(--fs-label); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .shopping-dish-links{display:flex; flex-wrap:wrap; gap:6px; padding:6px 0 0 14px;}
  .shopping-dish-link{
    padding:5px 10px; border-radius:var(--radius-pill);
    border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-soft);
    font-size:var(--fs-label); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .shopping-dish-link:active{transform:scale(0.96);}
  .shopping-menu-bar{
    margin:0 22px 14px; padding:12px 14px; border-radius:var(--radius-lg);
    background:var(--color-surface); border:1px solid var(--color-border);
  }
  .shopping-menu-bar-label{
    font-size:var(--fs-label); font-weight:var(--weight-semibold);
    color:var(--color-text-soft); margin:0 0 8px;
  }
  .shopping-menu-bar .shopping-dish-links{padding:0;}
  .shopping-item-row{
    display:flex; align-items:center; gap:8px; width:100%;
    border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-surface);
  }
  .shopping-item-row.checked{background:var(--color-bg); border-color:var(--color-border);}
  .shopping-item-row.seasoning{border-left:4px solid var(--color-accent);}
  .shopping-item-toggle{
    display:flex; align-items:center; gap:12px; flex:1; min-width:0;
    padding:13px 16px; border:none; background:none;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    font-family:var(--font-family); text-align:left;
  }
  .shopping-item-box{font-size:18px; flex-shrink:0; color:var(--color-text-soft);}
  .shopping-item-row.checked .shopping-item-box{color:var(--color-jade);}
  .shopping-item-name{flex:1; font-size:var(--fs-body); font-weight:var(--weight-medium); color:var(--color-text);}
  .shopping-item-row.seasoning .shopping-item-name{color:var(--color-accent-dark);}
  .shopping-item-row.checked .shopping-item-name{color:var(--color-text-soft); text-decoration:line-through;}
  .shopping-item-amount{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); flex-shrink:0;}
  .shopping-stepper{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .shopping-stepper-btn{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--color-border);
    background:var(--color-bg); color:var(--color-text-soft); font-size:15px; line-height:1;
    cursor:pointer; -webkit-tap-highlight-color:transparent; font-family:var(--font-family);
  }
  .shopping-stepper-num{min-width:20px; text-align:center; font-size:var(--fs-body); font-weight:var(--weight-semibold); color:var(--color-text);}
  .shopping-item-delete{
    flex-shrink:0; width:32px; height:32px; margin-right:8px; border-radius:50%;
    border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-soft);
    font-size:14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }

  .shopping-empty-state{padding:60px 30px; text-align:center;}
  .shopping-empty-emoji{font-size:40px; margin:0 0 10px;}
  .shopping-empty-title{font-size:var(--fs-body); font-weight:var(--weight-semibold); margin:0 0 6px;}
  .shopping-empty-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}


  .detail-section{padding:26px 22px 0;}
  .detail-divider{height:1px; background:var(--color-border); margin:26px 22px 0;}
  .preview-ing-box{
    padding:13px 15px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-surface);
    font-size:var(--fs-caption); color:var(--color-text); line-height:1.8;
  }
  .preview-ing-box.seasoning{margin-top:8px; color:var(--color-text-soft);}
  .preview-flow{
    padding:14px 15px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-surface);
    font-size:var(--fs-caption); color:var(--color-text); line-height:1.9;
  }
  .preview-flow-step{display:inline;}
  .preview-flow-arrow{color:var(--color-accent); margin:0 6px; font-weight:var(--weight-bold);}
  .dish-action-btn.primary{
    background:var(--color-accent); color:#FBF3EE; border-color:var(--color-accent);
  }
  .detail-section-title{
    font-size:var(--fs-section); font-weight:var(--weight-bold); margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }

  /* 免費版的「完整步驟需要完整版」卡片 */
  .steps-locked-scale{
    font-size:var(--fs-caption); color:var(--color-text-soft); margin:0 0 14px;
  }
  .steps-locked-box{
    border:1px dashed var(--color-border); border-radius:var(--radius-md);
    background:var(--color-bg); padding:20px 18px; text-align:center;
  }
  .steps-locked-title{
    font-size:var(--fs-card-title); font-weight:var(--weight-bold);
    color:var(--color-text); margin:0 0 8px;
  }
  .steps-locked-title::before{ content:"🔒 "; }
  .steps-locked-desc{
    font-size:var(--fs-caption); color:var(--color-text-soft);
    line-height:var(--lh-loose); margin:0 0 16px;
  }
  .steps-locked-btn{
    min-height:44px; padding:0 28px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-bold); font-family:inherit;
  }
  .steps-locked-btn:active{ transform:scale(.97); }

  .subgroup-label{font-size:var(--fs-label); font-weight:var(--weight-medium); color:var(--color-text-soft); margin:14px 0 8px;}
  .subgroup-label:first-child{margin-top:0;}

  .ingredient-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .ingredient-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-sm); padding:10px 14px; font-size:var(--fs-body); font-weight:var(--weight-medium);
  }
  .ingredient-row-right{display:flex; align-items:center; gap:10px;}
  .ingredient-amount{color:var(--color-text-soft); font-size:var(--fs-caption); font-weight:var(--weight-regular);}

  .detail-phase-back{
    display:block; margin:18px 22px 4px; padding:0; background:none; border:none;
    color:var(--color-text-soft); font-size:var(--fs-caption); font-weight:var(--weight-medium);
    cursor:pointer; -webkit-tap-highlight-color:transparent; font-family:var(--font-family);
  }

  .tool-tags{display:flex; gap:8px; flex-wrap:wrap;}
  .tool-tag{
    font-size:var(--fs-caption); font-weight:var(--weight-regular); background:var(--color-jade-soft); color:var(--color-jade);
    padding:6px 12px; border-radius:var(--radius-pill);
  }

  .step-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .prep-step{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:var(--fs-body); font-weight:var(--weight-regular); line-height:var(--lh-loose);
  }
  .step-num{
    width:22px; height:22px; border-radius:50%; background:var(--color-bg);
    color:var(--color-text-soft); font-size:var(--fs-label); font-weight:var(--weight-bold);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
  }

  .cook-step{
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-md); padding:14px 16px;
  }
  .cook-step-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .cook-step-num{
    width:24px; height:24px; border-radius:50%; background:var(--color-accent);
    color:#FBF3EE; font-size:var(--fs-label); font-weight:var(--weight-bold);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cook-step-badges{display:flex; gap:6px; margin-left:auto;}
  .badge{font-size:var(--fs-label); font-weight:var(--weight-medium); padding:3px 9px; border-radius:var(--radius-pill); background:var(--color-bg); color:var(--color-text-soft);}
  .cook-step-desc{font-size:var(--fs-body); font-weight:var(--weight-regular); line-height:var(--lh-loose); margin:0;}

  .note-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .note-item{
    display:flex; gap:10px; align-items:flex-start;
    font-size:var(--fs-body); font-weight:var(--weight-regular); line-height:var(--lh-base); padding:12px 14px;
    border-radius:var(--radius-sm);
  }
  .note-item.tip{background:var(--color-jade-soft); color:var(--color-text);}
  .note-item.mistake{background:var(--color-accent-soft); color:var(--color-text);}

  .start-cook-wrap{padding:28px 22px 8px;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0;
    max-width:520px; margin:0 auto;
    background:var(--color-surface); border-top:1px solid var(--color-border);
    display:flex; padding:8px 4px calc(10px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0; background:none; border:none; color:var(--color-text-soft);
    font-family:var(--font-family); font-size:11.5px; font-weight:var(--weight-regular); cursor:pointer;
    white-space:nowrap; -webkit-tap-highlight-color:transparent;
  }
  /* 圖示改用 emoji，尺寸與另外三個 App 的底部導覽對齊（21px／間距 3px／字 11.5px） */
  .nav-item .ic{font-size:21px; line-height:1;}
  .nav-item.active{color:var(--color-accent);}
  .nav-item:active{opacity:0.6;}

  /* 點擊區補到 40px：只擴大可按範圍，不改外觀大小 */
  .cook-log-edit, .cook-log-delete, .shopping-stepper-btn, .menu-card-remove-btn,
  .shopping-item-delete, .menu-serv-btn, .header-upgrade-btn, .sop-close,
  .back-btn, .header-settings-btn{ position:relative; }
  .cook-log-edit::after, .cook-log-delete::after, .shopping-stepper-btn::after,
  .menu-card-remove-btn::after, .shopping-item-delete::after, .menu-serv-btn::after,
  .header-upgrade-btn::after, .sop-close::after, .back-btn::after, .header-settings-btn::after{
    content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    min-width:40px; min-height:40px; width:100%; height:100%;
  }
  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(12px);
    background:rgba(45,50,56,.94); color:#fff;
    padding:11px 18px; border-radius:var(--radius-pill); font-size:13.5px; line-height:1.5;
    max-width:84%; text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:9999;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- 登入頁 ---------- */
  #login{
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    background:var(--color-page); padding:24px;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--color-surface);
    border:1px solid var(--color-border); border-radius:var(--radius-lg);
    padding:32px 26px; text-align:center;
  }
  .login-logo-img{width:84px; height:84px; border-radius:20px; display:block; margin:0 auto 14px; object-fit:cover;}
  .login-title{font-size:var(--fs-title); font-weight:var(--weight-bold); color:var(--color-text); margin:0 0 6px;}
  .login-sub{margin:0 0 20px; color:var(--color-text-soft); font-size:13.5px;}
  /* 設定頁帳號卡（智在生活 Standard） */
  .set-acc-card{background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-lg); padding:16px; margin:0 0 16px;}
  .set-acc-em{font-size:15px; font-weight:var(--weight-bold); word-break:break-all;}
  .set-acc-pl{margin-top:8px; display:inline-block; font-size:12.5px; font-weight:var(--weight-bold);
    background:var(--color-accent-soft); color:var(--color-accent); border-radius:999px; padding:5px 12px;}
  .set-acc-ex{margin-top:8px; font-size:12.5px; color:var(--color-text-soft);}
  .login-sub .kw{font-size:12px; opacity:.7;}
  /* 表單輸入一律 16px：小於 16px 時 iPhone 會自動放大整個畫面（智在生活 Standard） */
  input, select, textarea{ font-size:16px; }
  .sop-note-input, .ai-name-input{ font-size:16px; background:var(--color-surface); }
  .sop-note-input:focus, .ai-name-input:focus, .code-input:focus{
    outline:none; border-color:var(--color-accent); box-shadow:0 0 0 3px var(--color-accent-soft);
  }
  .code-input{
    width:100%; padding:14px 16px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-surface);
    font-size:var(--fs-body); font-family:var(--font-family); color:var(--color-text);
    box-sizing:border-box; text-align:center;
  }
  .code-input:focus{outline:none; border-color:var(--color-accent); box-shadow:0 0 0 3px var(--color-accent-soft);}
  .code-hint{
    margin-top:10px; font-size:var(--fs-label); color:var(--color-text-soft);
    text-align:center;
  }
  .login-consent{
    display:flex; align-items:flex-start; gap:8px; margin-top:16px;
    font-size:var(--fs-label); color:var(--color-text-soft); text-align:left; line-height:var(--lh-base);
  }
  .login-consent input{margin-top:2px; flex-shrink:0;}
  .login-terms-link{color:var(--color-accent-dark); text-decoration:underline;}
  .btn-primary{
    width:100%; margin-top:20px; padding:14px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn-primary:disabled{opacity:0.6;}

  /* 管理員入口：低調文字樣式，避免引起一般使用者好奇（智在生活 Standard） */
  #adminLoginToggle{
    width:100%; margin-top:18px; padding:8px; background:none; border:none;
    color:var(--color-text-soft); font-size:12.5px; font-weight:400; opacity:.75;
    text-decoration:none; cursor:pointer;
  }
  #adminLoginToggle:active{opacity:1;}
  /* 管理員登入：次要按鈕（有框線、無底色），跟行事曆同一套 */
  .btn-secondary{
    width:100%; margin-top:14px; padding:12px; border-radius:var(--radius-lg);
    background:transparent; color:var(--color-accent); border:1.5px solid var(--color-accent);
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family); cursor:pointer;
  }
  .login-msg{margin-top:12px; font-size:var(--fs-label); color:var(--color-accent-dark); min-height:16px; line-height:var(--lh-base);}
  .install-hint-btn{
    width:100%; margin-top:14px; padding:12px; border-radius:var(--radius-md);
    background:var(--color-jade-soft); color:var(--color-jade); border:1px solid var(--color-jade);
    font-size:var(--fs-caption); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .install-hint-btn:active{transform:scale(0.98);}
  .install-help{
    margin-top:10px; padding:11px 13px; border-radius:var(--radius-md);
    background:var(--color-bg); border:1px solid var(--color-border);
    font-size:var(--fs-label); color:var(--color-text-soft); line-height:var(--lh-base); text-align:left;
  }

  /* ---------- 彈窗 sheet（裝置上限／試用歡迎／到期提醒） ---------- */
  .overlay{
    position:fixed; inset:0; z-index:2000;
    background:rgba(43,36,29,0.45);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    width:100%; max-width:420px; background:var(--color-surface);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    max-height:85vh; overflow-y:auto;
  }

  /* ---------- 有新版本橫幅（Standard：與行事曆同一套機制）----------
     放在最上方，避免跟底部導覽列、食材頁的固定按鈕重疊 */
  .update-bar{display:none; position:fixed; left:0; right:0; top:0; z-index:2200;
    max-width:520px; margin:0 auto; background:var(--color-accent); color:#FBF3EE;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px; align-items:center; gap:12px;
    box-shadow:0 2px 12px rgba(0,0,0,.15);}
  .update-bar span{flex:1; font-size:14px; font-weight:600;}
  .update-bar button{background:#FBF3EE; color:var(--color-accent); font-weight:800; font-size:13px;
    padding:8px 16px; border-radius:10px; border:none; cursor:pointer;}

  /* ---------- 新手引導（第一次登入，4 張卡，可左右滑） ---------- */
  .onb-overlay{position:fixed; inset:0; z-index:2100; background:rgba(43,36,29,0.55);
    display:flex; align-items:center; justify-content:center; padding:16px;}
  .onb-card{width:100%; max-width:380px; background:var(--color-surface); border-radius:20px;
    padding:30px 22px 18px; text-align:center; touch-action:pan-y;}
  .onb-emoji{font-size:52px; line-height:1; margin-bottom:14px;}
  .onb-title{font-size:19px; font-weight:900; color:var(--color-text); margin:0 0 10px;}
  .onb-body{font-size:14px; line-height:1.8; color:var(--color-text-soft); margin:0; min-height:76px;}
  .onb-dots{display:flex; justify-content:center; gap:8px; margin:18px 0 16px;}
  .onb-dot{width:8px; height:8px; border-radius:50%; background:var(--color-border);}
  .onb-dot.active{background:var(--color-accent); width:20px; border-radius:4px;}
  .onb-actions{display:flex; gap:10px;}
  .onb-skip{flex:none; padding:13px 18px; border:1px solid var(--color-border); background:var(--color-surface);
    color:var(--color-text-soft); border-radius:12px; font-size:15px; font-weight:600; cursor:pointer;}
  .onb-next{flex:1; padding:13px; border:none; background:var(--color-accent); color:#FBF3EE;
    border-radius:12px; font-size:15px; font-weight:800; cursor:pointer;}

  /* ---------- 服務條款彈窗 ---------- */
  .terms-sheet{border-radius:20px; max-width:420px; margin:0 16px; padding:26px 22px; max-height:85vh;}
  .terms-logo-img{display:block; width:64px; height:auto; margin:0 auto 10px;}
  .terms-title{text-align:center; font-size:18px; font-weight:900; color:var(--color-text); margin-bottom:4px;}
  .terms-subtitle{text-align:center; font-size:12.5px; color:var(--color-text-soft); margin:0 0 18px;}
  .terms-body{max-height:52vh; overflow-y:auto; padding-right:2px;}
  .terms-section-title{font-size:14px; font-weight:800; color:var(--color-jade); margin:16px 0 6px;}
  .terms-section-title:first-child{margin-top:0;}
  .terms-section-body{font-size:13px; color:var(--color-text-soft); line-height:1.85; margin:0;}
  .terms-meta{font-size:11.5px; color:var(--color-text-soft); opacity:0.7; line-height:1.7; margin:18px 0 0;}
  .terms-close-btn{
    width:100%; border:none; background:var(--color-jade); color:#fff;
    border-radius:12px; padding:13px; font-size:15px; font-weight:800;
    margin-top:20px; cursor:pointer; font-family:var(--font-family); -webkit-tap-highlight-color:transparent;
  }
/* ==================== 訂閱管理（跨 App）==================== */
#subsPage{position:fixed;inset:0;background:#f5f6f8;z-index:10000;display:none;flex-direction:column;}
#subsPage.on{display:flex;}
.subs-head{background:#fff;border-bottom:1px solid #e5e7eb;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;flex:none;}
.subs-back{background:none;border:none;font-size:16px;color:#4A7A9B;padding:6px 4px;min-height:44px;cursor:pointer;font-family:inherit;}
.subs-title{font-size:16px;font-weight:700;color:#2c3e50;flex:1;}
.subs-count{font-size:12px;color:#95a5a6;}
.subs-tools{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 12px 10px;flex:none;}
.subs-search{width:100%;font-size:16px;font-family:inherit;padding:10px 12px;border:1px solid #dfe3e8;border-radius:10px;background:#f7f8fa;}
.subs-search:focus{outline:none;border-color:#4A7A9B;background:#fff;}
.subs-tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;}
.subs-tab{flex:none;border:1px solid #dfe3e8;background:#fff;color:#5a6a78;border-radius:999px;padding:7px 14px;font-size:13px;font-family:inherit;min-height:36px;cursor:pointer;white-space:nowrap;}
.subs-tab.on{background:#4A7A9B;border-color:#4A7A9B;color:#fff;font-weight:600;}
.subs-body{flex:1;overflow-y:auto;padding:12px 12px 100px;-webkit-overflow-scrolling:touch;}
.subs-card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.subs-email{font-size:14px;font-weight:600;color:#2c3e50;word-break:break-all;margin-bottom:2px;}
.subs-key{font-size:11px;color:#b0b8bf;word-break:break-all;margin-bottom:8px;}
.subs-line{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #f0f2f4;min-height:44px;cursor:pointer;}
.subs-line:first-of-type{border-top:none;}
.subs-ico{font-size:15px;width:20px;text-align:center;flex:none;}
.subs-app{font-size:13px;color:#5a6a78;width:66px;flex:none;}
.subs-stat{font-size:13px;flex:1;}
.subs-arrow{color:#c8cfd6;font-size:16px;flex:none;}
.subs-none{color:#c0c7ce;}
.subs-ok{color:#2c3e50;}
.subs-warn{color:#c87d1e;font-weight:600;}
.subs-bad{color:#c0392b;font-weight:600;}
.subs-gray{color:#95a5a6;}
.subs-empty{text-align:center;color:#95a5a6;padding:48px 20px;font-size:14px;line-height:1.8;}
.subs-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:#4A7A9B;color:#fff;border:none;border-radius:999px;padding:14px 28px;font-size:15px;font-weight:600;font-family:inherit;box-shadow:0 4px 14px rgba(74,122,155,.35);z-index:10001;cursor:pointer;min-height:48px;}
/* 第二層表單 */
#subsSheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10002;display:none;align-items:flex-end;}
#subsSheet.on{display:flex;}
.subs-sheet{background:#fff;width:100%;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.subs-sh-title{font-size:16px;font-weight:700;color:#2c3e50;margin-bottom:2px;word-break:break-all;}
.subs-sh-sub{font-size:13px;color:#7b8794;margin-bottom:16px;}
.subs-label{font-size:12px;color:#7b8794;margin:14px 0 6px;}
.subs-input{width:100%;font-size:16px;font-family:inherit;padding:11px 12px;border:1px solid #dfe3e8;border-radius:10px;}
.subs-input:focus{outline:none;border-color:#4A7A9B;box-shadow:0 0 0 3px rgba(74,122,155,.12);}
.subs-chips{display:flex;gap:8px;flex-wrap:wrap;}
.subs-chip{border:1px solid #dfe3e8;background:#fff;color:#5a6a78;border-radius:10px;padding:9px 14px;font-size:13px;font-family:inherit;min-height:42px;cursor:pointer;}
.subs-chip.on{background:#4A7A9B;border-color:#4A7A9B;color:#fff;font-weight:600;}
.subs-calc{background:#f3f6f8;border-radius:10px;padding:10px 12px;font-size:13px;color:#2c3e50;margin-top:14px;}
.subs-calc b{color:#4A7A9B;}
.subs-primary{width:100%;background:#4A7A9B;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;font-family:inherit;margin-top:18px;min-height:50px;cursor:pointer;}
.subs-primary:disabled{background:#c8cfd6;}
.subs-ghost{width:100%;background:#fff;color:#7b8794;border:1px solid #dfe3e8;border-radius:10px;padding:12px;font-size:14px;font-family:inherit;margin-top:10px;min-height:46px;cursor:pointer;}
.subs-danger{width:100%;background:#fff;color:#c0392b;border:1px solid #f0c8c2;border-radius:10px;padding:12px;font-size:14px;font-family:inherit;margin-top:10px;min-height:46px;cursor:pointer;}
.subs-row2{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #f0f2f4;font-size:14px;color:#2c3e50;}
.subs-row2 span:first-child{color:#7b8794;font-size:13px;width:52px;flex:none;}
.subs-row2 .v{flex:1;}
.subs-mini{border:1px solid #dfe3e8;background:#fff;color:#5a6a78;border-radius:8px;padding:6px 12px;font-size:12px;font-family:inherit;min-height:34px;cursor:pointer;}


/* ===== 設定頁統一樣式（與生活管家一致）=====
   分組不放文字標題，按鈕上的字就是說明；卡片之間用間距分區。 */
.settings-group{ display:none !important; }
.settings-list{
  background:#fff !important; border:1px solid #E3DED4 !important;
  border-radius:16px !important; padding:0 !important; overflow:hidden !important;
  box-shadow:0 2px 10px rgba(46,46,51,.06) !important;
  margin:0 16px 14px !important; display:block !important;
}

/* ===== 底部導覽：四個 App 同一套規格（高度 58px、圖示 21px、字 11.5px、反白加底色）===== */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; box-sizing:border-box;
  max-width:520px; margin:0 auto; z-index:40; display:flex; align-items:stretch;
  background:var(--color-surface); border-top:1px solid var(--color-border);
  padding:5px 8px calc(5px + env(safe-area-inset-bottom));
}
.bottom-nav .nav-item{
  flex:1 1 0; min-width:0; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:6px 2px; min-height:48px;
  background:none; border:none; border-radius:12px;
  color:var(--color-text-soft); font-family:inherit; font-size:11.5px; font-weight:600;
  line-height:1.25; white-space:nowrap; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.bottom-nav .nav-item .ic{ font-size:21px; line-height:1; }
.bottom-nav .nav-item.active{ color:#A8462E; background:#F1DCD2; font-weight:700; }
.bottom-nav .nav-item:active{ opacity:.65; }

/* ===== 空狀態：四個 App 同一套尺寸（圖示 40px、標題 14px、副標 12.5px）===== */
.empty-state{
  text-align:center; padding:44px 20px; font-size:14px; font-weight:600; line-height:1.6;
}
.empty-state .menu-empty-emoji, .empty-state .ai-empty-emoji{
  display:block; font-size:40px; line-height:1; margin:0 0 10px; opacity:.85; font-weight:400;
}
.empty-state .ai-empty-desc, .empty-state .menu-empty-desc{
  display:block; font-size:12.5px; font-weight:400; margin-top:6px; opacity:.85;
}

/* ===== 設定列表：四個 App 同一套規格（列高 52、圖示 18、名稱 15、狀態值 13）=====
   三個 App 的 class 名稱不同（.set-row／.settings-row，內層 .ic/.tx/.ar 與
   .set-ico/.set-name/.set-val/.set-arrow），這裡一次涵蓋，不動既有標籤。 */
.set-row, .settings-row{
  display:flex; align-items:center; gap:10px; width:100%; box-sizing:border-box;
  min-height:52px; padding:14px; margin:0;
  background:none; border:none; border-bottom:1px solid var(--color-border); border-radius:0;
  font-family:inherit; font-size:15px; font-weight:500; color:var(--color-text);
  text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.set-row:last-child, .settings-row:last-child{ border-bottom:none; }
.set-row:active, .settings-row:active{ background:var(--color-bg); }
.set-row .ic, .set-row .set-ico, .settings-row .settings-row-icon{
  flex:0 0 auto; width:24px; text-align:center; font-size:18px; line-height:1;
}
.set-row .tx, .set-row .set-name, .settings-row .settings-row-label{
  flex:0 0 auto; white-space:nowrap; font-weight:inherit;   /* 不要自帶字重，跟另外三個 App 一致 */
}
.set-row .set-val{
  flex:1 1 auto; min-width:0; text-align:right; font-size:13px; font-weight:400;
  color:var(--color-text-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.set-row .ar, .set-row .set-arrow{
  flex:0 0 auto; margin-left:auto; font-size:19px; line-height:1; color:var(--color-text-soft);
}
.set-gap{ height:14px; background:none; border:none; }
/* 設定頁不顯示底部選單，用左上角的返回鍵離開，跟生活管家、旅遊一致 */
body:has(#view-settings.active) .bottom-nav{ display:none; }

  /* 危險動作（登出）不給箭頭：它不是「進入某頁」，而是當下就執行 */
  .set-row.danger .ar, .set-row.danger .set-arrow{ display:none; }
  .set-row.danger, .settings-row.danger{ color:var(--color-danger); font-weight:700; }
  /* 管理員項目不另外加底色，跟其他 App 一致 */
  .settings-row.admin{ background:none; border-color:inherit; }
  /* 食在料理原本沒有箭頭，用 CSS 補上，標籤不用改 */
  .settings-row:not(.danger)::after{
    content:"›"; margin-left:auto; font-size:19px; line-height:1; color:var(--color-text-soft); flex:0 0 auto;
  }

/* ===== 首頁的標題色塊（比照客戶管理）=====

   設定、詳情這些子頁的標題列只有返回鍵加標題，鋪色塊只會是一片空的底色，

/* 負的上邊距把問候語往上接到標題列，兩者連成同一塊。

<script>
  /* =========================================================

      '<button onclick="location.reload()" style="margin-top:20px; padding:14px 28px; font-size:15px; border:none; border-radius:10px; background:#A8462E; color:#fff;">重新整理</button>' +
      '</div>';
    throw new Error("Firebase SDK failed to load - aborting script");
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBGfQ1oKOrt723tJ3w7LIwDLSh0nGwRF30",
    authDomain: "my-project-c89db.firebaseapp.com",
    databaseURL: "https://my-project-c89db-default-rtdb.firebaseio.com",
    projectId: "my-project-c89db",
    storageBucket: "my-project-c89db.firebasestorage.app",
    messagingSenderId: "301172719437",
    appId: "1:301172719437:web:c78a0ec43bcbf4eac38104"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  var auth = null;
  try{ auth = firebase.auth(); }catch(e){ console.error("Firebase 初始化失敗", e); }

  var state = { isAdmin:false, user:null, plan:null };

      ['loginMsg','adminLoginMsg'].forEach(function(id){
        var m=document.getElementById(id); if(m) m.textContent=_txt;
      });
      try{ console.error('enterApp 失敗', err); }catch(e){}

  const ONBOARD_KEY = 'jiachangzhu_onboarded_v1';
  const ONBOARD_STEPS = [
    { emoji:'🔍', title:'先找一道想煮的菜', body:'用菜名搜尋，或輸入手邊有的食材，<br>看看能煮哪些菜' },

  ];
  let onboardTimer = null;
  function maybeShowOnboarding(){
    let done = false;
    try{ done = localStorage.getItem(ONBOARD_KEY) === '1'; }catch(e){}
    if(done) return;
    let tries = 0;
    clearInterval(onboardTimer);
    onboardTimer = setInterval(function(){
      tries++;
      const root = document.getElementById('modalRoot');
      const busy = root && root.innerHTML.trim() !== '';
      if(!busy){ clearInterval(onboardTimer); showOnboarding(); }
      else if(tries > 240){ clearInterval(onboardTimer); }   // 最多等 2 分鐘，避免永遠輪詢
    }, 500);
  }
  function showOnboarding(){
    if(document.getElementById('onbOverlay')) return;
    let idx = 0;
    const wrap = document.createElement('div');
    wrap.className = 'onb-overlay';
    wrap.id = 'onbOverlay';
    document.body.appendChild(wrap);
    function finish(){
      try{ localStorage.setItem(ONBOARD_KEY, '1'); }catch(e){}
      const el = document.getElementById('onbOverlay');
      if(el) el.remove();
    }
    function render(){
      const st = ONBOARD_STEPS[idx];
      const last = idx === ONBOARD_STEPS.length - 1;
      wrap.innerHTML =
        '<div class="onb-card" id="onbCard">' +
          '<div class="onb-emoji">' + st.emoji + '</div>' +
          '<p class="onb-title">' + st.title + '</p>' +
          '<p class="onb-body">' + st.body + '</p>' +
          '<div class="onb-dots">' + ONBOARD_STEPS.map(function(_, i){ return '<span class="onb-dot' + (i === idx ? ' active' : '') + '"></span>'; }).join('') + '</div>' +
          '<div class="onb-actions">' +
            (last ? '' : '<button class="onb-skip" id="onbSkip">略過</button>') +
            '<button class="onb-next" id="onbNext">' + (last ? '開始使用' : '下一步') + '</button>' +
          '</div>' +
        '</div>';
      const skip = document.getElementById('onbSkip');
      if(skip) skip.addEventListener('click', finish);
      document.getElementById('onbNext').addEventListener('click', function(){
        if(last){ finish(); } else { idx++; render(); }
      });
      // 左右滑動換頁
      const card = document.getElementById('onbCard');
      let x0 = null;
      card.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      card.addEventListener('touchend', function(e){
        if(x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0;
        x0 = null;
        if(dx < -50 && idx < ONBOARD_STEPS.length - 1){ idx++; render(); }
        else if(dx > 50 && idx > 0){ idx--; render(); }
      });
    }
    render();
  }

  function isEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }
  // Email 正規化：gmail 的加號後綴與點號視為同一個帳號，避免換寫法重複試用
  function normEmail(e){
    var v = String(e||"").trim().toLowerCase();
    var at = v.lastIndexOf("@");
    if(at < 1) return v;
    var user = v.slice(0, at), host = v.slice(at+1);
    if(host === "gmail.com" || host === "googlemail.com"){
      user = user.split("+")[0].replace(/\./g, "");
      host = "gmail.com";
    }
    return user + "@" + host;
  }
  // 資料路徑的 key 必須跟 Firebase 規則一致：

  function emailKey(e){ return String(e||"").toLowerCase().replace(/[.#$\[\]]/g,"_"); }

  async function checkDevice(email, plan){
    var key=emailKey(email), id=_devId(), now=Date.now();
    var limit=planDeviceLimit(plan);
    var snap;
    try{ snap=await db.ref("jiachangzhu_subscribers/"+key+"/devices").once("value"); }
    catch(e){ return {ok:true}; }
    var devs=snap.val()||{};
    var CUT=30*86400000, changed=false;
    Object.keys(devs).forEach(function(k){
      if(k!==id && devs[k] && devs[k].last && (now-devs[k].last)>CUT){ delete devs[k]; changed=true; }
    });
    if(changed){ try{ await db.ref("jiachangzhu_subscribers/"+key+"/devices").set(devs); }catch(e){} }
    if(devs[id]){
      var ids=Object.keys(devs);
      if(ids.length>limit){
        ids.sort(function(a,b){ return (devs[b].last||0)-(devs[a].last||0); });
        if(ids.slice(0,limit).indexOf(id)<0) return {ok:false, limit:limit, plan:plan};
      }
      try{ db.ref("jiachangzhu_subscribers/"+key+"/devices/"+id+"/last").set(now); }catch(e){}
      return {ok:true};
    }
    if(Object.keys(devs).length >= limit) return {ok:false, limit:limit, plan:plan};
    try{ await db.ref("jiachangzhu_subscribers/"+key+"/devices/"+id).set({ name:_devName(), last:now, first:now }); }catch(e){}
    try{ db.ref("jiachangzhu_subscribers/"+key+"/deviceLimit").set(limit); }catch(e){}
    return {ok:true};
  }
  /* ===== D2 離線寬限（智在生活 Standard）=====
     每次成功連上雲端確認方案，就記下「方案＋到期日＋確認時間」。
     連不上時：被拒絕（沒權限）→ 免費版；沒網路 → 上次確認 3 天內
     且沒過到期日才沿用，否則降為免費版，等有網路再恢復。
     Firebase 沒網路時讀取不會失敗而是一直等，所以最多等 8 秒就當沒網路。 */
  var PLAN_CACHE_KEY = "jiachangzhu_plan_cache";
  var PLAN_GRACE_MS = 3*86400000;
  var VERIFY_TIMEOUT_MS = 8000;
  function withTimeout(p, ms){
    return Promise.race([p, new Promise(function(_, rej){
      setTimeout(function(){ var e=new Error("timeout"); e.code="TIMEOUT"; rej(e); }, ms);
    })]);
  }
  function isPermissionDenied(e){
    var c=String((e&&e.code)||"").toUpperCase(), m=String((e&&e.message)||"");
    return c.indexOf("PERMISSION")>=0 || /permission/i.test(m);
  }
  function savePlanCache(email, plan, expiry){
    try{ localStorage.setItem(PLAN_CACHE_KEY, JSON.stringify({ email:String(email||"").toLowerCase(), plan:plan, expiry:expiry||"", verifiedAt:Date.now() })); }catch(e){}
  }
  function planFromCache(email){
    var c=null; try{ c=JSON.parse(localStorage.getItem(PLAN_CACHE_KEY)||"null"); }catch(e){}
    if(!c || c.email!==String(email||"").toLowerCase() || !c.verifiedAt) return "free";
    var now=Date.now();
    if(now < c.verifiedAt || now - c.verifiedAt > PLAN_GRACE_MS) return "free";   // 超過 3 天（或手機時間被調回去）
    if(c.expiry){ var exp=Date.parse(c.expiry+"T23:59:59"); if(exp && now>exp) return "free"; }
    return c.plan || "free";
  }

  async function verifyCustomer(email){
    var key=emailKey(email);
    var now=await getServerTime();
    var snap;
    try{ snap=await withTimeout(db.ref("jiachangzhu_subscribers/"+key).once("value"), VERIFY_TIMEOUT_MS); }
    catch(e){
      if(isPermissionDenied(e)) return { ok:true, plan:"free", offline:true };
      return { ok:true, plan:planFromCache(email), offline:true };
    }
    var sub=snap.val();
    if(!sub){
      // 這台裝置用過試用了嗎？用過就直接給免費版，避免換 Email 重複試用
      var used=false;
      try{
        var tsnap=await withTimeout(db.ref("trial_devices/cook/"+_devId()).once("value"), VERIFY_TIMEOUT_MS);
        used = !!tsnap.val();
        if(!used){
          var esnap=await withTimeout(db.ref("trial_devices/cook/e_"+trialEmailKey(email)).once("value"), VERIFY_TIMEOUT_MS);
          used = !!esnap.val();
        }
      }catch(e){}
      if(used){
        var recF={ email:email, plan:"free", expiry:"", status:"active", deviceLimit:1, createdAt:now, lastSeen:now, devices:{} };
        try{ await db.ref("jiachangzhu_subscribers/"+key).set(recF); }catch(e){}
        savePlanCache(email, "free", "");
        return { ok:true, plan:"free", expiry:"", trialUsedOnDevice:true };
      }
      var expTs=now+TRIAL_DAYS*86400000;
      var rec={ email:email, plan:"trial", expiry:_ymdTs(expTs), status:"active", deviceLimit:planDeviceLimit("trial"), createdAt:now, lastSeen:now, devices:{} };
      try{ await db.ref("jiachangzhu_subscribers/"+key).set(rec); }catch(e){}
      try{ await db.ref("trial_devices/cook/"+_devId()).set({ firstTrialAt:now }); }catch(e){}
      try{ await db.ref("trial_devices/cook/e_"+trialEmailKey(email)).set({ firstTrialAt:now }); }catch(e){}
      savePlanCache(email, "trial", rec.expiry);
      return { ok:true, plan:"trial", expiry:rec.expiry, newTrial:true };
    }
    if(sub.status==="disabled") return { ok:false, msg:"此帳號已停用，請聯繫客服" };
    try{ db.ref("jiachangzhu_subscribers/"+key+"/lastSeen").set(now); }catch(e){}
    var expMs = sub.expiry ? Date.parse(sub.expiry+"T23:59:59") : 0;
    var expired = expMs && now>expMs;
    var effPlan = expired ? "free" : (sub.plan||"free");
    savePlanCache(email, effPlan, sub.expiry);
    return { ok:true, plan:effPlan, expiry:sub.expiry, expired:!!expired };
  }

  // Service Worker：網路優先，有網路永遠抓最新版、沒網路用上次的畫面。
  // sw.js 本身改版時才會出現「有新版本」橫幅，點了立即接管並重載一次
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing; if(!nw) return;
          nw.addEventListener('statechange', function(){
            if(nw.state === 'installed' && navigator.serviceWorker.controller){
              var ub = document.getElementById('updateBar'); if(ub) ub.style.display = 'flex';
            }
          });
        });
      }).catch(function(){});
      // 只有使用者按了「立即更新」才重載。第一次安裝 sw.js 時也會觸發
      // controllerchange，若無條件重載，可能打斷 Email 連結登入（連結碼只能用一次）
      var _swReloaded = false, _swUpdateAsked = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!_swUpdateAsked || _swReloaded) return; _swReloaded = true; window.location.reload();
      });
      var ubtn = document.getElementById('updateBtn');
      if(ubtn) ubtn.addEventListener('click', function(){
        _swUpdateAsked = true;
        navigator.serviceWorker.getRegistration().then(function(reg){
          if(reg && reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
        });
        var ub = document.getElementById('updateBar'); if(ub) ub.style.display = 'none';
      });
    });
  }

  // 安裝到手機桌面：Android/桌面Chrome這類瀏覽器支援
  // beforeinstallprompt事件，可以跳出瀏覽器原生的安裝
  // 對話框；iOS Safari完全不支援這個事件，只能手動教學
  // （點分享→加入主畫面），兩種情況分開處理。
  // 如果已經是安裝後的獨立視窗模式（standalone），代表
  // 已經裝過了，不用再顯示這顆按鈕。
  var deferredInstallPrompt = null;
  function isStandaloneMode(){
    try{
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }catch(e){ return false; }
  }
  function isIOSDevice(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent || '');
  }
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    if(!isStandaloneMode()){
      var btn = document.getElementById('installHintBtn');
      if(btn) btn.style.display = 'block';
    }

  async function finishCustomerLogin(email){
    loginBtn.disabled=true; loginBtn.textContent="驗證中…";
    var res;
    try{ res=await verifyCustomer(email); }catch(e){ res={ok:true,plan:planFromCache(email),offline:true}; }
    loginBtn.disabled=false; loginBtn.textContent="登入";
    if(!res.ok){ loginMsg.textContent=res.msg||"無法登入，請聯繫客服"; return; }
    // 沒網路時無法檢查裝置數，直接放行（方案已由寬限規則限制）
    var _dev = res.offline ? {ok:true} : await checkDevice(email, res.plan);
    if(!_dev.ok){ showDeviceLimit(email, res.plan, _dev.limit); return; }
    var _prevPlan; try{ _prevPlan=localStorage.getItem("cook_plan"); }catch(e){}
    state.isAdmin=false; state.user=email; state.plan=res.plan; state.expiry=res.expiry||"";
    setTimeout(function(){
      expiryNotice.check({ app:"cook", appName:"食在料理", plan:state.plan, expiry:state.expiry,
        isAdmin:state.isAdmin, accent:"#A8462E",
        onUpgrade:function(){ openUpgradeView(); } });
    }, 900);
    localStorage.setItem(AUTH_KEY,email);
    // 離線的結果只是暫時的，不寫進 cook_plan、也不跳升級／到期通知，
    // 否則恢復網路時會誤判成「剛升級成功」
    if(res.offline){ enterApp(); return; }
    try{ localStorage.setItem("cook_plan",res.plan); }catch(e){}
    if(res.newTrial){
      showTrialWelcome(res.expiry);
    } else if(res.expired && res.plan==="free" && _prevPlan && _prevPlan!=="free"){
      var _shownKey="cook_trialExpiredShown";
      var _already; try{ _already=localStorage.getItem(_shownKey); }catch(e){}
      if(_already!==res.expiry){ showTrialExpired(); try{ localStorage.setItem(_shownKey,res.expiry); }catch(e){} }
    } else if(_prevPlan && (_prevPlan==="trial"||_prevPlan==="free") && (res.plan==="basic"||res.plan==="full"||res.plan==="family")){
      showUpgradeSuccess(res.plan);
    }
    enterApp();
  }

  async function completeEmailLinkSignIn(){
    try{

    if(!email){ return false; }
    try{

      // 跟其他App（例如智在生活）的行為一致，不會卡在
