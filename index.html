  function renderSelectedMenuView(){
    const dishes = getSelectedMenuDishes();
    let html = '<div class="clear-row">' +
      '<p class="menu-subtitle" style="padding:0;">準備煮的料理</p>' +
      (dishes.length > 0 ? '<button class="clear-link-btn" id="clearSelectedMenuBtn">清空</button>' : '') +
    '</div>';

    if(dishes.length === 0){
      html += '<div class="menu-empty-state">' +
        '<p class="menu-empty-emoji">🔥</p>' +
        '<p class="menu-empty-title">目前沒有要煮的料理</p>' +
        '<p class="menu-empty-desc">回「我的菜單」挑幾道加入這次要煮吧</p>' +
      '</div>';
    } else {
      const groups = { breakfast:[], lunch:[], dinner:[], unassigned:[] };
      dishes.forEach(d => {
        const meal = getMealTime(d.id);
        if(meal === 'breakfast'){ groups.breakfast.push(d); }
        else if(meal === 'lunch'){ groups.lunch.push(d); }
        else if(meal === 'dinner'){ groups.dinner.push(d); }
        else { groups.unassigned.push(d); }
      });
      const sections = [
        { label:'🌅 早餐', items: groups.breakfast },
        { label:'☀️ 午餐', items: groups.lunch },
        { label:'🌙 晚餐', items: groups.dinner },
        { label:'📋 未分類', items: groups.unassigned }
      ];
      sections.forEach(sec => {
        if(sec.items.length === 0) return; // 沒有料理的分類不佔畫面
        html += '<p class="section-label">' + sec.label + '（' + sec.items.length + ' 道）</p>';
        html += '<div class="menu-list">' + sec.items.map(d => renderSelectedMenuCard(d)).join('') + '</div>';
      });
    }

    html += '<div class="menu-cta-wrap">' +
      '<button class="menu-cta-btn" id="generateShoppingBtn"' + (dishes.length === 0 ? ' disabled' : '') + '>🛒 查看這次採購</button>' +
    '</div>';
    html += '<p class="menu-cta-hint">回「我的菜單」可以加入更多要煮的料理</p>';

    document.getElementById('selectedMenuContent').innerHTML = html;
    bindSelectedMenuViewEvents();
  }

  function bindSelectedMenuViewEvents(){
    const clearBtn = document.getElementById('clearSelectedMenuBtn');
    if(clearBtn){
      clearBtn.addEventListener('click', () => {
        if(!selectedMenuDishIds.length) return;
        askConfirm('清空今日料理', '目前有 ' + selectedMenuDishIds.length + ' 道料理，清空後份數與早中晚設定也會一起消失。', function(){
          selectedMenuDishIds = [];
          saveSelectedMenu();
          renderSelectedMenuView();
          showToast('已清空');
        }, '清空');
      });
    }
    document.querySelectorAll('#selectedMenuContent [data-meal-dish]').forEach(btn => {
      btn.addEventListener('click', () => {
        const dishId = btn.dataset.mealDish;
        const meal = btn.dataset.meal;
        setMealTime(dishId, getMealTime(dishId) === meal ? null : meal);
        renderSelectedMenuView();
      });
    });
    document.querySelectorAll('#selectedMenuContent [data-meal-locked]').forEach(btn => {
      btn.addEventListener('click', openUpgradeView);
    });
    document.querySelectorAll('#selectedMenuContent [data-serv-minus]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.servMinus;
        setMenuServings(id, getMenuServings(id) - 1);
        renderSelectedMenuView();
      });
    });
    document.querySelectorAll('#selectedMenuContent [data-serv-plus]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.servPlus;
        setMenuServings(id, getMenuServings(id) + 1);
        renderSelectedMenuView();
      });
    });
    document.querySelectorAll('#selectedMenuContent [data-start-cook]').forEach(btn => {
      btn.addEventListener('click', () => {
        const dish = getDishById(btn.dataset.startCook);
        if(dish){ openDetail(dish.id, 'selected-menu', getMenuServings(dish.id)); }
      });
    });
    document.querySelectorAll('#selectedMenuContent [data-remove-selected]').forEach(btn => {
      btn.addEventListener('click', () => {
        removeFromSelectedMenu(btn.dataset.removeSelected);
        renderSelectedMenuView();
      });
    });
    const genBtn = document.getElementById('generateShoppingBtn');
    if(genBtn){
      genBtn.addEventListener('click', () => {
        if(getSelectedMenuDishes().length === 0) return;
        openShoppingListView();
      });
    }
  }

  /* =========================================================
     採購（畫面邏輯）
     ---------------------------------------------------------
     這個分頁本身就是「這次要煮」自動整合出來的完整清單，
     沒有另外的「建議畫面」或「加入」動作——每一項直接顯示
     在這裡，狀態（要買／已有）點一下就能切換，畫面永遠是
     computeShoppingOverview() 當下算出來的最新結果。
     ========================================================= */
  const SHOPPING_CATEGORY_ORDER = ["肉類","雞肉","海鮮","蔬菜","水果","蛋豆製品","乳製品","菇類","主食","調味辛香","乾貨","其他"];
  const MANUAL_ITEM_CATEGORIES = ["蔬菜","水果","肉類","雞肉","海鮮","蛋豆製品","乳製品","菇類","主食","調味辛香","乾貨","其他"];
  // 新增項目改成「先選分類 → 由分類帶出食材 → 點一下就加入」。
  // 分類切換要重畫整個分頁，所以展開狀態與打到一半的字要存在
  // 外面，不然一換分類表單就收起來、輸入的字也沒了
  let manualItemCategory = "蔬菜";
  let manualItemFormOpen = false;
  let manualItemDraftName = "";
  let shoppingTab = "list"; // list=採購清單, inventory=我的庫存
  let signatureTab = "menu"; // menu=我的菜單, log=料理紀錄
  let manualInventoryCategory = "蔬菜";
  let manualInventoryFormOpen = false;
  let manualInventoryDraftName = "";

  // 離開／切換分頁時把展開中的新增表單收掉，回來才不會看到
  // 一個沒人要用的表單一直佔著畫面
  function closeManualForms(){
    manualItemFormOpen = false;
    manualItemDraftName = '';
    manualInventoryFormOpen = false;
    manualInventoryDraftName = '';
  }

  /* 新增表單的共用版型。shopping 版多一個數量欄位，inventory 版沒有。
     cfg = { formId, catRowId, inputId, suggestId, confirmId, cancelId,
             activeCat, draft, withAmount, placeholder } */
  function renderManualAddForm(cfg){
    let html = '<div class="manual-add-form" id="' + cfg.formId + '">';
    html += '<p class="manual-category-label">選分類</p>';
    html += '<div class="chip-row manual-category-row" id="' + cfg.catRowId + '">' +
      MANUAL_ITEM_CATEGORIES.map(cat =>
        '<button class="chip' + (cat === cfg.activeCat ? ' active' : '') + '" data-manual-category="' + cat + '">' + cat + '</button>'
      ).join('') + '</div>';
    html += '<p class="manual-category-label">輸入名稱（打第一個字就會跳出建議）</p>';
    html += '<input type="text" id="' + cfg.inputId + '" class="ai-name-input" placeholder="' + cfg.placeholder + '" autocomplete="off" value="' + cfg.draft.replace(/"/g, '&quot;') + '">';
    html += '<div class="ing-suggest-box" id="' + cfg.suggestId + '"></div>';
    if(cfg.withAmount){
      html += '<input type="number" id="manualItemAmountInput" class="ai-name-input" placeholder="數量" value="1" min="1" style="margin-top:8px;">';
    }
    // 一定要按「加入」才真的加進去，挑建議只是帶入名稱
    html += '<div class="manual-form-actions">' +
      '<button class="manual-form-cancel" id="' + cfg.cancelId + '">取消</button>' +
      '<button class="ai-generate-btn" id="' + cfg.confirmId + '">加入</button>' +
    '</div>';
    html += '</div>';
    return html;
  }
  // 我的庫存分頁專用：直接新增一筆到inventory，不透過
  // 採購清單勾選這條路徑，適合「朋友送的」「家裡本來就有」
  // 這種沒有經過採購流程的東西
  function addManualInventoryItem(name, category){
    const trimmed = (name || '').trim();
    if(!trimmed) return;
    const existing = inventory.find(i => i.name === trimmed && i.unit === '');
    if(existing){
      existing.amount = (parseInt(existing.amount, 10) || 1) + 1;
      saveInventory();
    } else {
      addToInventory({
        name: trimmed,
        unit: '',
        amount: 1,
        category: category || findIngredientCategoryByName(trimmed),
        type: 'ingredient',
        source: 'manual'
      });
    }
  }
  function getShoppingCategoryOrder(items){
    const found = new Set(items.map(i => i.category));
    const ordered = SHOPPING_CATEGORY_ORDER.filter(c => found.has(c));
    found.forEach(c => { if(!ordered.includes(c)) ordered.push(c); });
    return ordered;
  }

  function openShoppingListView(){
    renderShoppingView();
    navigate('shopping');
  }

  // 菜色連結：只有「多道菜共用」的食材才顯示——單一道菜用的
  // 食材不需要提示，多道共用的才是容易搞混、需要知道買來幹嘛的。
  // 預設收合成「(3道) ▸」，點了才展開列出菜名，避免整頁都是標籤
  const expandedDishLinks = {};
  function renderDishLinks(sourceDishIds, rowKey){
    if(!sourceDishIds || sourceDishIds.length < 2) return '';
    const dishes = sourceDishIds.map(id => getDishById(id)).filter(Boolean);
    if(dishes.length < 2) return '';
    const open = !!expandedDishLinks[rowKey];
    let html = '<div class="shopping-dish-toggle-wrap">';
    html += '<button class="shopping-dish-toggle" data-toggle-links="' + rowKey + '">' +
      dishes.length + ' 道菜共用 ' + (open ? '▾' : '▸') + '</button>';
    if(open){
      html += '<div class="shopping-dish-links">' +
        dishes.map(d => '<button class="shopping-dish-link" data-link-dish="' + d.id + '">' + getDishIcon(d) + ' ' + d.name + '</button>').join('') +
      '</div>';
    }
    html += '</div>';
    return html;
  }

  // 新增採購／庫存項目時的食材建議清單——輸入時從食材庫（179種）
  // 即時過濾，點選帶入名稱與分類，避免使用者打了「洋蔥」卻跟
  // 食材庫的洋蔥對不起來。找不到的還是可以直接打字新增
  // preferCat：目前選的分類優先排前面（採購／庫存的新增表單用），
  // 但不完全過濾掉其他分類，免得使用者分類選錯就什麼都找不到
  function renderIngredientSuggestions(query, listId, preferCat){
    const q = (query || '').trim().toLowerCase();
    if(!q) return '';
    let matches = getAllIngredients().filter(e =>
      e.name.toLowerCase().includes(q) ||
      (e.aliases || []).some(a => a.toLowerCase().includes(q)) ||
      (e.matchNames || []).some(a => a.toLowerCase().includes(q))
    );
    if(preferCat){
      matches = matches.slice().sort((a, b) =>
        (b.category === preferCat ? 1 : 0) - (a.category === preferCat ? 1 : 0));
    }
    matches = matches.slice(0, preferCat ? 5 : 8);
    if(matches.length === 0){
      return '<p class="ing-suggest-empty">食材庫沒有「' + query + '」，可直接新增</p>';
    }
    return '<div class="ing-suggest-list" id="' + listId + '">' +
      matches.map(e =>
        '<button class="ing-suggest-item" data-suggest-name="' + e.name + '" data-suggest-cat="' + e.category + '">' +
          '<span>' + e.icon + ' ' + e.name + '</span>' +
          '<span class="ing-suggest-cat">' + e.category + '</span>' +
        '</button>'
      ).join('') +
    '</div>';
  }

  // 把建議清單接到某個輸入框上：打字即時更新、點選帶入名稱與分類
  function bindIngredientSuggest(inputId, containerId, onPick, getPreferCat){
    const input = document.getElementById(inputId);
    const box = document.getElementById(containerId);
    if(!input || !box) return;
    function refresh(){
      box.innerHTML = renderIngredientSuggestions(input.value, containerId + 'List',
        getPreferCat ? getPreferCat() : null);
      box.querySelectorAll('[data-suggest-name]').forEach(btn => {
        btn.addEventListener('click', () => {
          input.value = btn.dataset.suggestName;
          box.innerHTML = '';
          onPick(btn.dataset.suggestName, btn.dataset.suggestCat);
        });
      });
    }
    input.addEventListener('input', refresh);
  }

  function renderShoppingRow(item){
    const key = item.name + '|' + item.unit;
    const isManual = item.source === 'manual';
    const deleteBtn = isManual
      ? '<button class="shopping-item-delete" data-delete-key="' + key + '" aria-label="刪除">✕</button>'
      : '';
    const amountHtml = isManual
      ? '<span class="shopping-stepper">' +
          '<button class="shopping-stepper-btn" data-stepper-key="' + key + '" data-step="-1" aria-label="減少">−</button>' +
          '<span class="shopping-stepper-num">' + (parseInt(item.amount, 10) || 1) + '</span>' +
          '<button class="shopping-stepper-btn" data-stepper-key="' + key + '" data-step="1" aria-label="增加">＋</button>' +
        '</span>'
      : (function(){
          const a = item.displayAmount != null ? item.displayAmount : item.amount;
          const u = item.displayUnit != null ? item.displayUnit : item.unit;
          return '<span class="shopping-item-amount">' + (a ? (u ? a + ' ' + u : a) : '') + '</span>';
        })();
    return '<div class="shopping-item-wrap">' +
      '<div class="shopping-item-row' + (item.type === 'seasoning' ? ' seasoning' : '') + (item.status === 'have' ? ' checked' : '') + '">' +
        '<button class="shopping-item-toggle" data-item-key="' + key + '">' +
          '<span class="shopping-item-box">' + (item.status === 'have' ? '🟢' : '🛒') + '</span>' +
          '<span class="shopping-item-name">' + item.name + '</span>' +
        '</button>' +
        amountHtml +
        deleteBtn +
      '</div>' +
      renderDishLinks(item.sourceDishIds, key) +
    '</div>';
  }

  function renderShoppingSection(title, items){
    if(items.length === 0) return '';
    let html = title ? '<p class="section-label">' + title + '（' + items.length + ' 項）</p>' : '';
    const categories = getShoppingCategoryOrder(items);
    categories.forEach(cat => {
      html += '<div class="shopping-group">';
      html += '<p class="shopping-group-title">' + ingredientCategoryIcon(cat) + ' ' + cat + '</p>';
      html += '<div class="shopping-item-list">';
      items.forEach(item => {
        if(item.category === cat){ html += renderShoppingRow(item); }
      });
      html += '</div></div>';
    });
    return html;
  }

  function renderShoppingView(){
    const tabRow = document.getElementById('shoppingTabRow');
    const tabList = document.getElementById('shoppingTabList');
    const tabInv = document.getElementById('shoppingTabInventory');

    if(isFreePlan()){
      if(tabRow) tabRow.style.display = 'none';
      document.getElementById('shoppingContent').innerHTML =
        '<div class="menu-empty-state">' +
          '<p class="menu-empty-emoji">🔒</p>' +
          '<p class="menu-empty-title">採購清單／我的庫存是付費功能</p>' +
          '<p class="menu-empty-desc">升級後即可自動彙整採購清單、追蹤庫存，不用再拿著手機一道菜一道菜對食材</p>' +
          '<button class="menu-cta-btn" id="shoppingUpgradeBtn" style="margin-top:16px;">查看升級方案</button>' +
        '</div>';
      document.getElementById('shoppingUpgradeBtn').addEventListener('click', openUpgradeView);
      return;
    }
    if(tabRow) tabRow.style.display = '';
    if(tabList) tabList.classList.toggle('active', shoppingTab === 'list');
    if(tabInv) tabInv.classList.toggle('active', shoppingTab === 'inventory');

    if(shoppingTab === 'inventory'){
      renderInventoryTab();
      return;
    }

    const overview = computeShoppingOverview();
    const needItems = overview.filter(i => i.status === 'need');

    let html = '<div class="shopping-actions-row">' +
      '<button class="shopping-action-link" id="addManualItemBtn">＋ 新增項目</button>' +
    '</div>';

    if(manualItemFormOpen){
      html += renderManualAddForm({
        formId:'manualAddForm', catRowId:'manualCategoryRow',
        inputId:'manualItemInput', suggestId:'manualItemSuggest', confirmId:'confirmManualAddBtn',
        cancelId:'cancelManualAddBtn',
        activeCat: manualItemCategory, draft: manualItemDraftName,
        withAmount: true, placeholder:'例如 洋蔥、衛生紙'
      });
    }

    html += '<p class="menu-subtitle">這次要煮需要準備的全部食材，點一下標記已買，會移到我的庫存</p>';

        cancelId:'cancelManualInventoryBtn',
        activeCat: manualInventoryCategory, draft: manualInventoryDraftName,
        withAmount: false, placeholder:'例如 雞蛋、保鮮膜'
      });
    }

    html += '<p class="menu-subtitle">手邊現有的食材／用品，跟今日料理是否用到無關</p>';

    if(inventory.length === 0){
      html += '<div class="shopping-empty-state">' +

      '</div>';
    } else {
      const categories = getShoppingCategoryOrder(inventory);
      categories.forEach(cat => {
        const items = inventory.filter(i => i.category === cat);
        if(items.length === 0) return;
        html += '<div class="shopping-group">';
        html += '<p class="shopping-group-title">' + ingredientCategoryIcon(cat) + ' ' + cat + '</p>';
        items.forEach(item => {
          const qty = parseInt(item.amount, 10) || 1;
          // 只顯示「還在今日料理裡」的菜色連結——那道菜被刪掉後，
          // 庫存食材照樣留著，只是不再有連結
          const activeDishIds = (item.sourceDishIds || []).filter(id => selectedMenuDishIds.includes(id));
          html += '<div class="shopping-item-wrap">' +
            '<div class="inventory-item-row">' +
              '<span class="inventory-item-name">' + item.name + ((item.unit && !isBuyByPack(item.name)) ? '（' + item.unit + '）' : '') + '</span>' +
              '<span class="shopping-stepper">' +
                '<button class="shopping-stepper-btn" data-inv-step-id="' + item.id + '" data-step="-1" aria-label="減少">−</button>' +
                '<span class="shopping-stepper-num">' + qty + '</span>' +
                '<button class="shopping-stepper-btn" data-inv-step-id="' + item.id + '" data-step="1" aria-label="增加">＋</button>' +
              '</span>' +
              '<button class="inventory-item-used-btn" data-inv-id="' + item.id + '">用完了</button>' +
            '</div>' +
            renderDishLinks(activeDishIds, item.id) +
          '</div>';
        });
        html += '</div>';
      });
    }

    document.getElementById('shoppingContent').innerHTML = html;
    bindInventoryTabEvents();
  }

  function renderCookLogTab(){

  _startAppFlow();

  // 食在料理：返回鍵一層一層往回的順序
  function _activeView(){
    var names=Object.keys(views);
    for(var i=0;i<names.length;i++){ var el=document.getElementById(views[names[i]]); if(el && el.classList.contains('active')) return names[i]; }
    return 'find';

  function appHandleBack(){
    if(window.closeTopSharedOverlay && closeTopSharedOverlay()) return true;   // 條款／升級／備份／訂閱等共用彈窗
    var onb=document.getElementById('onbOverlay');
    if(onb){ try{ localStorage.setItem(ONBOARD_KEY,'1'); }catch(e){} onb.remove(); return true; }   // 新手引導 → 當作略過
    var mr=document.getElementById('modalRoot');
    if(mr && mr.innerHTML.trim()!==''){ closeSheet(); return true; }                                 // 彈窗
    var lm=document.getElementById('sopLeaveModal');
    if(lm && lm.style.display==='flex'){ closeLeaveModal(); return true; }                          // 「確定離開料理？」
    var sop=document.getElementById('sopOverlay');
    if(sop && sop.classList.contains('active')){                                                    // 料理步驟中
      var done=document.getElementById('sopDoneScreen');
      if(done && done.style.display==='block'){ exitSopDone(); } else { requestLeaveSOP(); }
      return true;
    }
    var lg=document.getElementById('login');
    if(lg && lg.style.display!=='none') return false;                                                // 登入頁 → 離開
    var v=_activeView();
    if(v==='shopping' && (manualItemFormOpen || manualInventoryFormOpen)){ closeManualForms(); renderShoppingView(); return true; }
    if(v==='detail'){ goBackFromDetail(); return true; }
    if(v==='admin'){ navigate('settings'); return true; }
    if(v==='settings'){ navigate('find'); return true; }
    if(v==='find'){
      if(typeof findMode!=='undefined' && findMode!=='choice'){ findGoBack(); return true; }
      return false;                                                                                  // 首頁 → 提示再按一次離開
    }
    navigate('find'); renderFindView(); return true;                                                  // 其他分頁 → 回首頁
  }

/* ===== D9 手機返回鍵（智在生活 Standard，三支 App 同一套）=====
   開 App 時先放一層「守門」紀錄，按手機返回鍵（或 iPhone 左緣滑動）時
   會先被這層接住，交給 appHandleBack() 一層一層往回：
   關彈窗 → 回上一頁 → 回首頁。已經在首頁時提示「再按一次離開」，
   2 秒內再按才真的離開；超過 2 秒就重新放回守門，避免誤觸跳出。 */
(function(){
  if(!window.history || !history.pushState) return;
  var _exitArmed=false, _exitTimer=null;
  function pushGuard(){ try{ history.pushState({haGuard:1}, ''); }catch(e){} }
  pushGuard();
  window.addEventListener('popstate', function(){
    if(_exitArmed) return;                       // 提示後 2 秒內再按：讓瀏覽器照常離開
    var handled=false;
    try{ handled = appHandleBack(); }catch(e){ handled=false; }
    if(handled){ pushGuard(); return; }
    _exitArmed=true;
    try{ showToast('再按一次返回鍵離開'); }catch(e){}
    clearTimeout(_exitTimer);
    _exitTimer=setTimeout(function(){ _exitArmed=false; pushGuard(); }, 2000);
  });
})();

  ];
  var PLAN_TXT = { trial:'試用', full:'完整版', basic:'完整版', family:'完整版', free:'免費版' };
  // 沒有免費版的 App：試用到期轉唯讀，後台不提供「改為免費版」，到期顯示為「已到期」
  var NO_FREE_APPS = { crm:true };
  function planText(appId, plan){ return (plan==='free' && NO_FREE_APPS[appId]) ? '已到期' : (PLAN_TXT[plan]||plan); }
  function devLimit(p){ return 1; }   // 食在料理：各方案都是 1 台

  var S = { data:{}, tab:'all', q:'', loading:false, sel:null, selApp:null,
            addPlan:'full', addMonths:12, addApp:'crm' };

  /* ---------- 小工具 ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  // 必須跟 Firebase 規則一致：email.toLowerCase().replace('.','_')
  function eKey(e){ return String(e||'').toLowerCase().replace(/[.#$\[\]]/g,'_'); }
  function isMail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim()); }
  function ymd(ts){ var d=new Date(ts);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function slash(s){ return String(s||'').replace(/-/g,'/'); }
  function addMonths(ts, m){ var d=new Date(ts); var day=d.getDate();
    d.setMonth(d.getMonth()+m);
    if(d.getDate()<day) d.setDate(0);   // 1/31 +1月 → 2/28，不要跳到 3/3
    return d.getTime(); }
  function toast(msg){
    var t=document.getElementById('subsToast');
    if(!t){ t=document.createElement('div'); t.id='subsToast';
      t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:rgba(32,38,44,.94);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;z-index:10005;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw;text-align:center;';
      document.body.appendChild(t); }
    t.textContent=msg; t.style.opacity='1';
    clearTimeout(t._tm); t._tm=setTimeout(function(){ t.style.opacity='0'; }, 2000);
  }
  function fail(act, err){
    if(!navigator.onLine) return act+'失敗，請確認網路後再試';
    var c=(err&&(err.code||err.message))||'';
    if(/permission|denied|auth/i.test(c)) return act+'失敗，請重新登入後再試';
    return act+'失敗，請稍後再試';
  }
  function confirmBox(msg, onOk){
    if(window.showConfirm) return window.showConfirm(msg, onOk);
    if(window.askConfirm){ var r=window.askConfirm(msg); if(r&&r.then){ r.then(function(ok){ if(ok) onOk(); }); return; } }
    if(confirm(msg)) onOk();
  }

  /* ---------- 狀態判讀 ---------- */
  function stat(sub){
    if(!sub) return null;
    var now=Date.now();
    var exp = sub.expiry ? Date.parse(sub.expiry+'T23:59:59') : 0;
    var expired = !!(exp && now>exp);
    var days = exp ? Math.ceil((exp-now)/86400000) : null;
    return { plan: expired?'free':(sub.plan||'free'), rawPlan:sub.plan||'free',
             expiry:sub.expiry||'', expired:expired, days:days,
             disabled: sub.status==='disabled', raw:sub };
  }
  function statHtml(st, appId){
    if(!st) return '<span class="subs-stat subs-none">－</span>';
    if(st.disabled) return '<span class="subs-stat subs-gray">已停用</span>';
    var name = planText(appId, st.rawPlan);
    if(st.expired) return '<span class="subs-stat subs-bad">已過期 · 過期 '+Math.abs(st.days)+' 天</span>';
    if(st.days==null) return '<span class="subs-stat subs-gray">'+name+'</span>';
    if(st.days<=7)  return '<span class="subs-stat subs-bad">'+name+' · 剩 '+st.days+' 天</span>';
    if(st.days<=30) return '<span class="subs-stat subs-warn">'+name+' · 剩 '+st.days+' 天</span>';
    return '<span class="subs-stat subs-ok">'+name+' · '+slash(st.expiry)+'</span>';
  }

  /* ---------- 讀取 ---------- */
  async function load(){
    S.loading=true; render();
    var out={};
    for(var i=0;i<SUBS_APPS.length;i++){
      var a=SUBS_APPS[i];
      try{ var snap=await firebase.database().ref(a.path).once('value'); out[a.id]=snap.val()||{}; }
      catch(e){ out[a.id]=null; }
    }
    S.data=out; S.loading=false; render();
  }
  function rows(){
    var map={};
    SUBS_APPS.forEach(function(a){
      var d=S.data[a.id]; if(!d) return;
      Object.keys(d).forEach(function(k){
        if(!map[k]) map[k]={ key:k, email:'', apps:{} };
        var s=d[k]||{};
        if(!map[k].email) map[k].email = s.email || k;
        map[k].apps[a.id]=s;
      });
    });
    var arr=Object.keys(map).map(function(k){ return map[k]; });
    // 篩選
    var q=S.q.trim().toLowerCase();
    if(q) arr=arr.filter(function(r){ return (r.email+' '+r.key).toLowerCase().indexOf(q)>=0; });
    if(S.tab==='soon'){
      arr=arr.filter(function(r){
        return SUBS_APPS.some(function(a){
          var st=stat(r.apps[a.id]);
          return st && !st.disabled && st.days!=null && st.days<=30 && st.days>-30;
        });
      });
      arr.sort(function(x,y){ return minDays(x)-minDays(y); });
    } else if(S.tab!=='all'){
      arr=arr.filter(function(r){ return !!r.apps[S.tab]; });
      arr.sort(function(x,y){ return String(x.email).localeCompare(String(y.email)); });
    } else {
      arr.sort(function(x,y){ return String(x.email).localeCompare(String(y.email)); });
    }
    return arr;
  }
  function minDays(r){
    var m=99999;
    SUBS_APPS.forEach(function(a){ var st=stat(r.apps[a.id]);
      if(st && st.days!=null && st.days<m) m=st.days; });
    return m;
  }

  /* ---------- 畫面 ---------- */
  function render(){
    var body=document.getElementById('subsBody'); if(!body) return;
    var cnt=document.getElementById('subsCount');
    document.querySelectorAll('.subs-tab').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-tab')===S.tab); });

    if(S.loading){ body.innerHTML='<div class="subs-empty">載入中…</div>'; if(cnt) cnt.textContent=''; return; }

    var bad=SUBS_APPS.filter(function(a){ return S.data[a.id]===null; });
    var warn = bad.length ? '<div class="subs-empty" style="padding:14px;color:#c0392b;font-size:13px">'+
      esc(bad.map(function(a){return a.name;}).join('、'))+' 讀取失敗，請確認網路或 Firebase 規則</div>' : '';

    var arr=rows();
    if(cnt) cnt.textContent='共 '+arr.length+' 位';
    if(!arr.length){
      body.innerHTML = warn + '<div class="subs-empty">📭<br>'+
        (S.q ? '找不到「'+esc(S.q)+'」' : S.tab==='soon' ? '沒有快到期的客戶' : '還沒有客戶')+
        '<br><span style="font-size:13px">'+(S.q?'換個關鍵字試試':'有人付款後，按下面的「新增客戶」')+'</span></div>';
      return;
    }
    var only = (S.tab==='all'||S.tab==='soon') ? null : S.tab;
    body.innerHTML = warn + arr.map(function(r){
      var lines = SUBS_APPS.filter(function(a){ return !only || a.id===only; }).map(function(a){
        var st=stat(r.apps[a.id]);
        return '<div class="subs-line" data-k="'+esc(r.key)+'" data-a="'+a.id+'">'+
               '<span class="subs-ico">'+a.icon+'</span>'+
               '<span class="subs-app">'+a.name+'</span>'+
               statHtml(st, a.id)+
               '<span class="subs-arrow">›</span></div>';
      }).join('');
      return '<div class="subs-card"><div class="subs-email">'+esc(r.email)+'</div>'+
             '<div class="subs-key">'+esc(r.key)+'</div>'+lines+'</div>';
    }).join('');

    body.querySelectorAll('.subs-line').forEach(function(el){
      el.onclick=function(){ openManage(el.getAttribute('data-k'), el.getAttribute('data-a')); };
    });
  }

  /* ---------- 新增 ---------- */
  /* 開通只有一種情境：有人付錢了。
     試用是 App 自己開的、免費版是試用到期自動轉的，都不需要手動建立，
     所以這裡不給方案選項，一律開完整版。 */
  function openAdd(){
    S.addMonths=12; S.addApp = (S.tab!=='all'&&S.tab!=='soon') ? S.tab : 'crm';
    sheet(addHtml());
    wireAdd();
  }
  function addHtml(){
    return '<div class="subs-sh-title">開通完整版</div>'+
      '<div class="subs-sh-sub">有人付款後用這個開通</div>'+
      '<div class="subs-label">哪個 App</div>'+
      '<div class="subs-chips" id="ax">'+SUBS_APPS.map(function(a){
        return '<button type="button" class="subs-chip'+(a.id===S.addApp?' on':'')+'" data-v="'+a.id+'">'+a.icon+' '+a.name+'</button>';
      }).join('')+'</div>'+
      '<div class="subs-label">客戶 Email</div>'+
      '<input type="email" class="subs-input" id="aEmail" placeholder="linda@gmail.com" autocomplete="off" inputmode="email">'+
      '<div class="subs-label">期間</div>'+
      '<div class="subs-chips" id="am">'+
        '<button type="button" class="subs-chip on" data-v="12">一年</button>'+
        '<button type="button" class="subs-chip" data-v="24">兩年</button>'+
      '</div>'+
      '<div class="subs-calc" id="aCalc"></div>'+
      '<button type="button" class="subs-primary" id="aGo">確定開通</button>'+
      '<button type="button" class="subs-ghost" onclick="subsAdmin.closeSheet()">取消</button>';
  }
  function wireAdd(){
    var em=document.getElementById('aEmail');
    function chips(id, set){
      var box=document.getElementById(id); if(!box) return;
      box.querySelectorAll('.subs-chip').forEach(function(b){
        b.onclick=function(){
          box.querySelectorAll('.subs-chip').forEach(function(x){ x.classList.remove('on'); });
          b.classList.add('on'); set(b.getAttribute('data-v')); calc();
        };
      });
    }
    chips('ax', function(v){ S.addApp=v; });
    chips('am', function(v){ S.addMonths=Number(v); });
    if(em) em.addEventListener('input', calc);
    calc();
    document.getElementById('aGo').onclick=doAdd;

    function calc(){
      var c=document.getElementById('aCalc'); if(!c) return;
      var v=(em&&em.value||'').trim().toLowerCase();
      c.innerHTML = '資料位置　<b>'+(v?esc(eKey(v)):'—')+'</b><br>到期日　　<b>'+
                    slash(ymd(addMonths(Date.now(), S.addMonths)))+'</b>';
    }
  }
  async function doAdd(){
    var em=document.getElementById('aEmail'), btn=document.getElementById('aGo');
    var v=(em&&em.value||'').trim().toLowerCase();
    if(!isMail(v)){ toast('Email 格式不正確'); if(em) em.focus(); return; }
    var app=SUBS_APPS.filter(function(a){ return a.id===S.addApp; })[0];
    var key=eKey(v), now=Date.now();
    var exp=ymd(addMonths(now, S.addMonths));
    btn.disabled=true; btn.textContent='處理中…';
    try{
      var ref=firebase.database().ref(app.path+key);
      var snap=await ref.once('value');
      if(snap.val()){
        // 已經有帳號（多半是試用中的人付錢了）→ 只升級方案與到期日，
        // 不動 devices / clientsCreated，他既有的資料與裝置都保留
        await ref.update({ plan:'full', expiry:exp, status:'active', deviceLimit:devLimit('full') });
        toast('已升級　'+app.name+'　完整版　至 '+slash(exp));
      } else {
        var rec = { email:v, plan:'full', expiry:exp, status:'active',
                    deviceLimit:devLimit('full'), createdAt:now, lastSeen:now, devices:{} };
        if(app.id === 'crm') rec.clientsCreated = 0;   // CRM 的記錄有這個欄位，缺了會跟 App 自建的格式不一致
        await ref.set(rec);
        toast('已開通　'+app.name+'　完整版　至 '+slash(exp));
      }
      closeSheet(); await load();
    }catch(e){ toast(fail('開通', e)); btn.disabled=false; btn.textContent='確定開通'; }
  }
  /* ---------- 管理單一客戶 ---------- */
  function openManage(key, appId){
    S.sel=key; S.selApp=appId;
    var app=SUBS_APPS.filter(function(a){ return a.id===appId; })[0];
    var sub=(S.data[appId]||{})[key];
    var st=stat(sub);
    var email=(sub&&sub.email)||key;

    if(!sub){
      sheet('<div class="subs-sh-title">'+esc(email)+'</div>'+
        '<div class="subs-sh-sub">'+app.icon+' '+app.name+'　尚未開通</div>'+
        '<button type="button" class="subs-primary" id="mNew">開通完整版一年</button>'+
        '<button type="button" class="subs-ghost" onclick="subsAdmin.closeSheet()">關閉</button>');
      document.getElementById('mNew').onclick=function(){
        S.addApp=appId; S.addPlan='full'; S.addMonths=12;
        sheet(addHtml()); wireAdd();
        var e=document.getElementById('aEmail'); if(e){ e.value=email; e.dispatchEvent(new Event('input')); }
      };
      return;
    }
    var used=Object.keys(sub.devices||{}).length;
    var isPaid = (st.rawPlan==='full'||st.rawPlan==='basic'||st.rawPlan==='family');
    sheet(
      '<div class="subs-sh-title">'+esc(email)+'</div>'+
      '<div class="subs-sh-sub">'+app.icon+' '+app.name+'　'+
        (st.expiry ? planText(app.id, st.rawPlan)+' · '+slash(st.expiry) : planText(app.id, st.rawPlan))+
        '</div>'+
      '<button type="button" class="subs-primary" id="mRenew">續約一年</button>'+
      (isPaid && !NO_FREE_APPS[app.id] ? '<div class="subs-label">取消付費</div>'+
        '<div class="subs-chips" id="mp">'+
          '<button type="button" class="subs-chip" data-v="free">改為免費版</button>'+
        '</div>' : '')+
      '<div class="subs-label">延長</div>'+
      '<div class="subs-chips" id="me">'+
        '<button type="button" class="subs-chip" data-v="1">＋1 月</button>'+
        '<button type="button" class="subs-chip" data-v="12">＋1 年</button>'+
        '<button type="button" class="subs-chip" data-v="ask">自訂…</button>'+
      '</div>'+
      '<div class="subs-row2"><span>裝置</span><span class="v">'+used+' / '+(sub.deviceLimit||devLimit(st.rawPlan))+'</span>'+
        '<button type="button" class="subs-mini" id="mDev">清除</button></div>'+
      '<div class="subs-row2"><span>狀態</span><span class="v">'+(st.disabled?'已停用':'啟用中')+'</span>'+
        '<button type="button" class="subs-mini" id="mTog">'+(st.disabled?'恢復':'停用')+'</button></div>'+
      '<button type="button" class="subs-ghost" onclick="subsAdmin.closeSheet()">關閉</button>'+
      '<button type="button" class="subs-danger" id="mDel">清除訂閱紀錄</button>'
    );

    var path=app.path+key;
    document.getElementById('mRenew').onclick=function(){ extend(path, 12); };
    document.getElementById('me').querySelectorAll('.subs-chip').forEach(function(b){
      b.onclick=function(){
        var v=b.getAttribute('data-v');
        if(v==='ask'){ var m=prompt('延長幾個月？','12'); if(m===null) return;
          m=parseInt(m,10); if(!m||m<1){ toast('請輸入 1 以上的數字'); return; } extend(path, m); }
        else extend(path, Number(v));
      };
    });
    var mpBox=document.getElementById('mp');
    if(mpBox) mpBox.querySelectorAll('.subs-chip').forEach(function(b){
      b.onclick=function(){
        confirmBox('把這位客戶改回免費版？\n付費功能會立刻鎖住，資料保留。', function(){
          changePlan(path, 'free');
        });
      };
    });
    document.getElementById('mDev').onclick=function(){
      confirmBox('清除這位客戶的裝置紀錄？\n他需要重新登入。', async function(){
        try{ await firebase.database().ref(path+'/devices').remove(); toast('已清除裝置'); closeSheet(); await load(); }
        catch(e){ toast(fail('清除', e)); }
      });
    };
    document.getElementById('mTog').onclick=async function(){
      var next = st.disabled ? 'active' : 'disabled';
      try{ await firebase.database().ref(path+'/status').set(next);
        toast(next==='disabled'?'已停用':'已恢復'); closeSheet(); await load(); }
      catch(e){ toast(fail('更新', e)); }
    };
    document.getElementById('mDel').onclick=function(){
      confirmBox('清除「'+email+'」在'+app.name+'的訂閱紀錄？\n\n客戶的 App 資料會保留，之後重新開通即可接續使用。', async function(){
        try{ await firebase.database().ref(path).remove(); toast('已清除訂閱紀錄'); closeSheet(); await load(); }
        catch(e){ toast(fail('清除', e)); }
      });
    };
  }

  // 續約：從「原到期日」往後加，已過期才從今天算，剩餘天數不會被吃掉
  async function extend(path, months){
    try{
      var snap=await firebase.database().ref(path+'/expiry').once('value');
      var cur=snap.val(), now=Date.now();
      var base = cur ? Math.max(Date.parse(cur+'T23:59:59'), now) : now;
      var next = ymd(addMonths(base, months));
      await firebase.database().ref(path).update({ expiry:next, status:'active' });
      toast('已延長至 '+slash(next));
      closeSheet(); await load();
    }catch(e){ toast(fail('續約', e)); }
  }
  async function changePlan(path, plan){
    try{
      var up={ plan:plan, deviceLimit:devLimit(plan) };
      if(plan==='free') up.expiry='';
      await firebase.database().ref(path).update(up);
      toast('已改成 '+(PLAN_TXT[plan]||plan));
      closeSheet(); await load();
    }catch(e){ toast(fail('修改', e)); }
  }

  /* ---------- 容器 ---------- */
  function sheet(html){
    var w=document.getElementById('subsSheet');
    w.querySelector('.subs-sheet').innerHTML=html;
    w.classList.add('on');
  }
  function closeSheet(){ var w=document.getElementById('subsSheet'); if(w) w.classList.remove('on'); }

  function mount(){
    if(document.getElementById('subsPage')) return;
    var tabs='<button type="button" class="subs-tab on" data-tab="all">全部</button>'+
      '<button type="button" class="subs-tab" data-tab="soon">⚠️ 快到期</button>'+
      SUBS_APPS.map(function(a){ return '<button type="button" class="subs-tab" data-tab="'+a.id+'">'+a.icon+' '+a.name+'</button>'; }).join('');
    var d=document.createElement('div');
    d.innerHTML=
      '<div id="subsPage">'+
        '<div class="subs-head"><button type="button" class="subs-back" onclick="subsAdmin.close()">‹ 返回</button>'+
          '<span class="subs-title">訂閱管理</span><span class="subs-count" id="subsCount"></span></div>'+
        '<div class="subs-tools">'+
          '<input type="search" class="subs-search" id="subsQ" placeholder="搜尋 Email" autocomplete="off">'+
          '<div class="subs-tabs">'+tabs+'</div>'+
        '</div>'+
        '<div class="subs-body" id="subsBody"></div>'+
        '<button type="button" class="subs-fab" onclick="subsAdmin.add()">＋ 新增客戶</button>'+
      '</div>'+
      '<div id="subsSheet" onclick="if(event.target===this)subsAdmin.closeSheet()"><div class="subs-sheet"></div></div>';
    while(d.firstChild) document.body.appendChild(d.firstChild);
    document.getElementById('subsQ').addEventListener('input', function(e){ S.q=e.target.value; render(); });
    document.querySelectorAll('.subs-tab').forEach(function(b){
      b.onclick=function(){ S.tab=b.getAttribute('data-tab'); render(); };
    });
  }

  window.subsAdmin={
    open: function(){ mount(); document.getElementById('subsPage').classList.add('on'); load(); },
    close: function(){ closeSheet(); var p=document.getElementById('subsPage'); if(p) p.classList.remove('on'); },
    add: openAdd,
    closeSheet: closeSheet,
    _s: S
  };
})();

  function tip(msg){

  /* opts: { app:'crm', email:'...', price:6000, per:500, accent:'#4A7A9B', note:'早鳥價' } */
  window.payCardHtml = function(opts){

  function mount(){
    css();
    if(document.getElementById('lgWrap')) return;
    var w=document.createElement('div'); w.id='lgWrap';
    w.innerHTML =
      '<div class="lg-box">'+
        '<div class="lg-tabs" id="lgTabs"></div>'+
        '<div class="lg-body" id="lgBody"></div>'+
        '<div class="lg-foot"><button type="button" class="lg-close" id="lgClose">關閉</button></div>'+
      '</div>';
    document.body.appendChild(w);
    w.addEventListener('click', function(e){ if(e.target===w) close(); });
    document.getElementById('lgClose').addEventListener('click', close);
    var tabs=document.getElementById('lgTabs');
    DOCS.forEach(function(d,i){
      var b=document.createElement('button');
      b.type='button'; b.className='lg-tab'; b.textContent=d.t;
      b.addEventListener('click', function(){ show(i); });
      tabs.appendChild(b);
    });
  }

/* ==================== 到期提醒（四個 App 共用）====================
   到期前 7／3／1 天與到期當天各提醒一次，同一天不重複。
   試用與完整版說法不同：試用強調「還沒買」，完整版強調「續約」。
   ==================================================================== */
(function(){
  var KEY = 'expiryNoticeShown';      // 存 "app|yyyy-mm-dd"，同一天只跳一次

  function ymd(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  // 用「日曆日」相減，不是毫秒差 —— 否則今天到期會被算成還有 1 天
  function daysLeft(expiry){
    if(!expiry) return null;
    var end = new Date(expiry + 'T00:00:00');
    if(isNaN(end.getTime())) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    return Math.round((end.getTime() - today.getTime()) / 86400000);
  }
  function shownToday(app){
    try{ return localStorage.getItem(KEY) === app + '|' + ymd(new Date()); }catch(e){ return false; }
  }
  function markShown(app){
    try{ localStorage.setItem(KEY, app + '|' + ymd(new Date())); }catch(e){}
  }

  function css(accent){
    var el=document.getElementById('exCss');
    if(el) el.remove();
    var s=document.createElement('style'); s.id='exCss';
    s.textContent =
      '#exWrap{position:fixed;inset:0;background:rgba(18,22,20,.5);z-index:10080;display:none;'+
        'align-items:center;justify-content:center;padding:20px;}'+
      '#exWrap.on{display:flex;}'+
      '.ex-box{background:#fff;color:#1F2724;width:100%;max-width:330px;border-radius:18px;'+
        'padding:24px 20px 20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2);}'+
      '.ex-ico{font-size:40px;line-height:1;margin-bottom:12px;}'+
      '.ex-t{font-size:18px;font-weight:700;margin-bottom:8px;}'+
      '.ex-d{font-size:14px;color:#5B6F79;line-height:1.8;margin-bottom:20px;}'+
      '.ex-d b{color:'+accent+';}'+
      '.ex-go{width:100%;background:'+accent+';color:#fff;border:none;border-radius:12px;padding:14px;'+
        'font-size:15.5px;font-weight:700;font-family:inherit;min-height:50px;cursor:pointer;}'+
      '.ex-later{width:100%;background:none;color:#8A928C;border:none;padding:12px;margin-top:6px;'+
        'font-size:14px;font-family:inherit;min-height:44px;cursor:pointer;}';
    document.head.appendChild(s);
  }

  function close(){ var w=document.getElementById('exWrap'); if(w) w.classList.remove('on'); }

  /* cfg: { app, appName, plan, expiry, isAdmin, accent, onUpgrade } */
  function check(cfg){
    cfg = cfg || {};
    if(cfg.isAdmin) return false;
    var plan = cfg.plan || 'free';
    if(plan !== 'trial' && plan !== 'full' && plan !== 'basic' && plan !== 'family') return false;

    var d = daysLeft(cfg.expiry);
    if(d === null) return false;
    if(d > 7 || d < 0) return false;                 // 只在最後 7 天內提醒；已過期不在這裡處理
    if(shownToday(cfg.app)) return false;

    var isTrial = (plan === 'trial');
    var accent = cfg.accent || '#2B93B8';
    css(accent);

    var title, desc, btn;
    if(d === 0){
      title = isTrial ? '試用今天到期' : '完整版今天到期';
      desc  = isTrial
        ? (cfg.noFree ? '明日起轉為唯讀。<br><b>資料完整保留，可查看與匯出。</b>' : '明日起轉為免費版，部分功能停用。<br><b>既有資料完整保留。</b>')
        : (cfg.noFree ? '明日起轉為唯讀。<br><b>資料完整保留，續約後即可恢復編輯。</b>' : '明日起轉為免費版。<br><b>資料完整保留，續約後即可恢復。</b>');
    } else {
      title = isTrial ? ('試用還有 ' + d + ' 天') : ('完整版還有 ' + d + ' 天到期');
      desc  = isTrial
        ? ('試用到 <b>' + cfg.expiry + '</b> 為止。<br>' + (cfg.noFree ? '到期後轉為唯讀，資料完整保留，可查看與匯出。' : '到期後轉為免費版，部分功能停用，資料完整保留。'))
        : ('使用到 <b>' + cfg.expiry + '</b> 為止。<br>現在續約會從原到期日往後延長，剩下的天數不會被吃掉。');
    }
    btn = isTrial ? '看方案' : '我要續約';

    var w=document.getElementById('exWrap');
    if(!w){
      w=document.createElement('div'); w.id='exWrap';
      w.innerHTML='<div class="ex-box">'+
        '<div class="ex-ico" id="exIco">⏰</div>'+
        '<div class="ex-t" id="exT"></div>'+
        '<div class="ex-d" id="exD"></div>'+
        '<button type="button" class="ex-go" id="exGo"></button>'+
        '<button type="button" class="ex-later" id="exLater">稍後再說</button></div>';
      document.body.appendChild(w);
      w.addEventListener('click', function(e){ if(e.target===w) close(); });
      document.getElementById('exLater').addEventListener('click', close);
    }
    document.getElementById('exIco').textContent = (d <= 1) ? '⚠️' : '⏰';
    document.getElementById('exT').textContent = title;
    document.getElementById('exD').innerHTML = desc;
    var go=document.getElementById('exGo');
    go.textContent = btn;
    go.onclick = function(){ close(); if(typeof cfg.onUpgrade === 'function') cfg.onUpgrade(); };
    w.classList.add('on');
    markShown(cfg.app);
    return true;
  }

  window.expiryNotice = { check: check, close: close, _daysLeft: daysLeft };
})();

/* ==================== 登入頁：管理員模式（四個 App 共用）====================
   原本點「管理員登入」只是在客戶登入區「下面」再長出一段，整張卡愈疊愈長，
   中間累積的間距讓畫面看起來很空。
   改成：進管理員模式時把客戶登入區整個收起來，只留標題與管理員欄位，
   並附一顆「返回一般登入」還原。標題區（前三個元素）一律保留。
   ========================================================================= */
(function(){
  function hide(el, on){
    if(!el) return;
    if(on){
      if(el.dataset.admPrev === undefined) el.dataset.admPrev = el.style.display || '';
      el.style.display = 'none';
    }else if(el.dataset.admPrev !== undefined){
      el.style.display = el.dataset.admPrev;
      delete el.dataset.admPrev;
    }
  }
  window.adminOnly = {
    /* toggleId：「🔧 管理員登入」那顆；boxId：管理員帳密區塊 */
    bind: function(toggleId, boxId, accent){
      var t = document.getElementById(toggleId), box = document.getElementById(boxId);
      if(!t || !box || box.dataset.admBound) return;
      box.dataset.admBound = '1';
      var card = box.parentElement;
      if(!card) return;

      var back = document.createElement('button');
      back.type = 'button';
      back.id = boxId + 'Back';
      back.textContent = '‹ 返回一般登入';
      back.style.cssText = 'width:100%;margin-top:12px;padding:9px;background:none;border:none;' +
        'color:#95a5a6;font-size:13px;font-family:inherit;cursor:pointer;';
      back.addEventListener('click', function(){ set(false); });
      box.appendChild(back);

      function set(on){
        var kids = [].slice.call(card.children);
        kids.forEach(function(el, i){
          if(el === box) return;
          if(i < 3) return;                       // 圖示、標題、副標留著
          hide(el, on);
        });
        box.style.display = on ? 'block' : 'none';
        try{ card.scrollTop = 0; }catch(e){}
      }
      t.addEventListener('click', function(){
        var open = !(box.style.display === 'none' || !box.style.display);
        set(!open);
      });
    }
  };

  /* 四支 App 的 id 命名不同，存在哪一組就綁哪一組。
     放在模組自己這裡，不依賴各 App 程式碼的執行順序。 */
  (function auto(){
    var pairs = [['adminLoginToggle','adminLoginBox'], ['crmAdminToggle','crmAdminBox']];
    var done = false;
    pairs.forEach(function(x){
      if(document.getElementById(x[0]) && document.getElementById(x[1])){
        try{ window.adminOnly.bind(x[0], x[1]); done = true; }catch(e){}
      }
    });
    if(!done) setTimeout(auto, 60);
  })();
})();

/* ==================== 安裝到桌面（四個 App 共用）====================
   三件事在這裡統一：步驟說明的文字、「已安裝過」的提醒、按下安裝後的等待提示。
   各 App 只要把自己接到的 beforeinstallprompt 事件交進來。
   提示長條固定在畫面「下方」，不會蓋到標題列與返回鍵；15 秒後自動淡掉。
   ==================================================================== */
(function(){
  var CFG = { appName:'這個 App', accent:'#5B6F79' };
  var _t = null;                                   // 自動關閉的計時器
  function isIOS(){
    try{ return /iphone|ipad|ipod/i.test(navigator.userAgent); }catch(e){ return false; }
  }
  /* 已經從桌面圖示開啟 → 不必再顯示任何安裝相關提示 */
  function installed(){
    try{
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
             || window.navigator.standalone === true;
    }catch(e){ return false; }
  }
  function steps(){
    var n = CFG.appName;
    return '安裝到手機桌面\n\n安裝步驟：\n' + (isIOS()
      ? '1. 請改用「Safari 瀏覽器」開啟本頁\n2. 點下方「分享」按鈕 ⬆️\n3. 選「加入主畫面」'
      : '1. 請改用「Chrome 瀏覽器」開啟本頁\n2. 點瀏覽器選單（⋮）\n3. 選「安裝應用程式／加到主畫面」')
      + '\n\n💡 若您已安裝過，請直接至手機桌面開啟「' + n + '」開啟';
  }
  function css(){
    if(document.getElementById('inCss')) return;
    var s=document.createElement('style'); s.id='inCss';
    s.textContent =
      '#inBar{position:fixed;left:0;right:0;bottom:0;z-index:10096;max-width:520px;margin:0 auto;'+
        'display:none;padding:12px 44px calc(12px + env(safe-area-inset-bottom,0px)) 16px;'+
        'background:#2E2E33;color:#fff;font-size:13.5px;line-height:1.6;font-family:inherit;'+
        'box-shadow:0 -2px 12px rgba(0,0,0,.25);cursor:pointer;'+
        'opacity:0;transition:opacity .35s ease;}'+
      '#inBar.on{display:block;}'+
      '#inBar.show{opacity:1;}'+
      '#inBar b{color:#FFD9A0;}'+
      '#inBar .in-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;'+
        'border:none;color:rgba(255,255,255,.7);font-size:18px;padding:6px 10px;cursor:pointer;}';
    document.head.appendChild(s);
  }
  /* html：提示內容；ms：幾毫秒後自動淡掉（不傳就用 15 秒） */
  function bar(html, ms){
    css();
    var b=document.getElementById('inBar');
    if(!b){
      b=document.createElement('div'); b.id='inBar';
      b.setAttribute('role','status');
      document.body.appendChild(b);
    }
    b.innerHTML = html + '<button type="button" class="in-x" aria-label="關閉">×</button>';
    b.onclick = hide;                              // 點長條任一處都可關掉
    b.classList.add('on');
    // 先掛上再加 .show，讓淡入生效
    try{ void b.offsetWidth; }catch(e){}
    b.classList.add('show');
    if(_t){ clearTimeout(_t); _t=null; }
    _t = setTimeout(hide, (typeof ms==='number' ? ms : 15000));
    return b;
  }
  function hide(){
    if(_t){ clearTimeout(_t); _t=null; }
    var b=document.getElementById('inBar'); if(!b) return;
    b.classList.remove('show');
    setTimeout(function(){ b.classList.remove('on'); }, 360);
  }

  // 安裝完成時換成完成訊息（不是每支瀏覽器都會送這個事件，所以只當加分）
  try{ window.addEventListener('appinstalled', function(){
    try{ localStorage.setItem('installDismissed','1'); }catch(e){}
    bar('✅ <b>安裝完成</b>　到手機桌面找「' + CFG.appName + '」就能開啟', 6000);
  }); }catch(e){}

  window.appInstall = {
    init: function(cfg){ if(cfg) { CFG.appName = cfg.appName || CFG.appName; } },
    steps: steps,
    hide: hide,
    installed: installed,
    /* dp：各 App 接到的 beforeinstallprompt 事件；沒有就跳步驟說明。
       回傳 Promise<boolean>，true 代表事件已經用掉，呼叫端要把自己的變數清空。 */
    run: function(dp){
      if(!dp){ try{ alert(steps()); }catch(e){} return Promise.resolve(false); }
      try{
        dp.prompt();
        return dp.userChoice.then(function(r){
          if(r && r.outcome === 'accepted'){
            // 使用者已經按下安裝 → 記住，首頁橫條不用再出現
            try{ localStorage.setItem('installDismissed','1'); }catch(e){}
            bar('⏳ <b>安裝中，請稍候…</b>　<b>請勿關閉本頁</b>，完成後桌面會出現圖示');
          } else {
            bar('已取消安裝，隨時可以再從設定頁安裝', 4000);
          }
          return true;
        }).catch(function(){ return true; });
      }catch(e){
        try{ alert(steps()); }catch(e2){}
        return Promise.resolve(false);
      }
    }
  };
})();
appInstall.init({ appName:'食在料理' });

/* ==================== 確認對話框（四個 App 共用）====================
   各 App 原本的函式名與參數都保留，內部改成呼叫這裡，所以呼叫端一行都不用動。
   opts: { title, message, okText, cancelText, danger, accent }
   回傳 Promise<boolean>
   ==================================================================== */
(function(){
  function css(accent, danger){
    var el=document.getElementById('cfCss'); if(el) el.remove();
    var okBg = danger ? '#C0392B' : accent;
    var s=document.createElement('style'); s.id='cfCss';
    s.textContent =
      '#cfWrap{position:fixed;inset:0;background:rgba(18,22,20,.5);z-index:10090;display:none;'+
        'align-items:center;justify-content:center;padding:20px;}'+
      '#cfWrap.on{display:flex;}'+
      '.cf-box{background:#fff;color:#1F2724;width:100%;max-width:330px;border-radius:18px;'+
        'padding:22px 20px 18px;box-shadow:0 12px 40px rgba(0,0,0,.2);}'+
      '.cf-t{font-size:16.5px;font-weight:700;margin-bottom:8px;text-align:center;}'+
      '.cf-m{font-size:14px;color:#5B6F79;line-height:1.8;margin-bottom:20px;text-align:center;'+
        'white-space:pre-wrap;word-break:break-word;}'+
      '.cf-btns{display:flex;gap:9px;}'+
      '.cf-btns button{flex:1;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:700;'+
        'font-family:inherit;min-height:50px;cursor:pointer;border:1px solid transparent;}'+
      '.cf-no{background:#fff;color:#5B6F79;border-color:#DDE2DA !important;}'+
      '.cf-ok{background:'+okBg+';color:#fff;}';
    document.head.appendChild(s);
  }

  var resolver = null;
  function finish(v){
    var w=document.getElementById('cfWrap'); if(w) w.classList.remove('on');
    var r=resolver; resolver=null;
    if(r) r(v);
  }

  function confirmDialog(opts){
    opts = opts || {};
    css(opts.accent || '#2B93B8', !!opts.danger);
    var w=document.getElementById('cfWrap');
    if(!w){
      w=document.createElement('div'); w.id='cfWrap';
      w.innerHTML='<div class="cf-box">'+
        '<div class="cf-t" id="cfT"></div>'+
        '<div class="cf-m" id="cfM"></div>'+
        '<div class="cf-btns">'+
          '<button type="button" class="cf-no" id="cfNo"></button>'+
          '<button type="button" class="cf-ok" id="cfOk"></button>'+
        '</div></div>';
      document.body.appendChild(w);
      w.addEventListener('click', function(e){ if(e.target===w) finish(false); });
      document.getElementById('cfNo').addEventListener('click', function(){ finish(false); });
      document.getElementById('cfOk').addEventListener('click', function(){ finish(true); });
    }
    var t=document.getElementById('cfT');
    t.textContent = opts.title || '';
    t.style.display = opts.title ? 'block' : 'none';
    var m=document.getElementById('cfM');
    if(opts.html) m.innerHTML = opts.html; else m.textContent = opts.message || '';
    document.getElementById('cfNo').textContent = opts.cancelText || '取消';
    document.getElementById('cfOk').textContent = opts.okText || '確定';
    w.classList.add('on');

    // 前一個還沒關就被叫第二次 → 前一個視為取消，不要卡住
    if(resolver){ var prev=resolver; resolver=null; prev(false); }
    return new Promise(function(res){ resolver = res; });
  }

  window.confirmDialog = confirmDialog;
})();

/* ==================== 升級頁（四個 App 共用）====================
   統一成：比較表 ＋ 付款卡 ＋ 客服。各 App 只傳自己的功能清單與價格。
   cfg: { app, name, accent, price, per, note, trial, rows:[[功能, 免費版, 完整版], ...],
          email, lineUrl }
   ==================================================================== */
(function(){
  var CFG = null;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function css(accent){
    var el=document.getElementById('upCss'); if(el) el.remove();
    var s=document.createElement('style'); s.id='upCss';
    s.textContent =
      '#upWrap{position:fixed;inset:0;background:rgba(18,22,20,.5);z-index:10030;display:none;align-items:flex-end;}'+
      '#upWrap.on{display:flex;}'+
      '.up-box{background:#FCFCFA;color:#1F2724;width:100%;max-height:92vh;display:flex;'+
        'flex-direction:column;border-radius:18px 18px 0 0;overflow:hidden;}'+
      '.up-head{padding:18px 18px 14px;background:#fff;border-bottom:1px solid #EAEDE8;flex:none;}'+
      '.up-t{font-size:18px;font-weight:700;}'+
      '.up-s{font-size:13px;color:#7b8794;margin-top:4px;}'+
      '.up-body{overflow-y:auto;padding:16px 18px 24px;-webkit-overflow-scrolling:touch;}'+
      '.up-cmp{border:1px solid #E3E7E1;border-radius:12px;overflow:hidden;background:#fff;}'+
      '.up-row{display:grid;grid-template-columns:1fr 66px 74px;align-items:center;gap:6px;'+
        'padding:11px 13px;border-top:1px solid #EFF2ED;font-size:13.5px;line-height:1.5;}'+
      '.up-row:first-child{border-top:none;background:#F4F7F4;font-size:12px;font-weight:700;'+
        'color:#6B736D;letter-spacing:.04em;}'+
      '.up-row span:nth-child(2),.up-row span:nth-child(3){text-align:center;}'+
      '.up-no{color:#A9B2AB;}'+
      '.up-yes{color:'+accent+';font-weight:700;}'+
      '.up-note{font-size:12.5px;color:#7b8794;margin-top:12px;line-height:1.7;}'+
      '.up-line{display:block;text-align:center;margin-top:14px;font-size:13.5px;color:'+accent+';'+
        'text-decoration:underline;}'+
      '.up-foot{flex:none;padding:10px 18px calc(14px + env(safe-area-inset-bottom));'+
        'border-top:1px solid #EAEDE8;background:#fff;}'+
      '.up-close{width:100%;background:#F2F4F1;color:#3B443E;border:1px solid #DDE2DA;border-radius:10px;'+
        'padding:12px;font-size:15px;font-family:inherit;min-height:46px;cursor:pointer;}';
    document.head.appendChild(s);
  }

  function close(){ var w=document.getElementById('upWrap'); if(w) w.classList.remove('on'); }

  /* feat：可選，點了某個鎖住的功能才進來，會在標題下方點名那個功能 */
  function open(feat){
    var c = CFG; if(!c) return;
    css(c.accent);
    var w=document.getElementById('upWrap');
    if(!w){
      w=document.createElement('div'); w.id='upWrap';
      w.innerHTML='<div class="up-box">'+
        '<div class="up-head"><div class="up-t" id="upT"></div><div class="up-s" id="upS"></div></div>'+
        '<div class="up-body" id="upB"></div>'+
        '<div class="up-foot"><button type="button" class="up-close" id="upClose">關閉</button></div>'+
      '</div>';
      document.body.appendChild(w);
      w.addEventListener('click', function(e){ if(e.target===w) close(); });
      document.getElementById('upClose').addEventListener('click', close);
    }
    document.getElementById('upT').textContent = feat ? ('「'+feat+'」需要完整版') : ('升級 '+c.name+' 完整版');
    document.getElementById('upS').textContent = c.trial
      ? (c.trialNote || ('免費試用 '+c.trial+' 天，期間功能全部開放')) : '';

    var rows = '<div class="up-row"><span></span><span>'+esc(c.freeLabel||'免費版')+'</span><span>完整版</span></div>';
    (c.rows||[]).forEach(function(r){
      function cell(v){
        if(v === true)  return '<span class="up-yes">✓</span>';
        if(v === false) return '<span class="up-no">—</span>';
        return '<span class="'+(v==='—'?'up-no':'up-yes')+'">'+esc(v)+'</span>';
      }
      rows += '<div class="up-row"><span>'+esc(r[0])+'</span>'+cell(r[1])+cell(r[2])+'</div>';
    });

    var html = '<div class="up-cmp">'+rows+'</div>';
    if(c.note) html += '<p class="up-note">'+esc(c.note)+'</p>';
    html += window.payCardHtml({ app:c.app, email:c.email||'', price:c.price, per:c.per,
                                 accent:c.accent, note:c.payNote });
    if(c.lineUrl) html += '<a class="up-line" href="'+c.lineUrl+'" target="_blank" rel="noopener">有問題？聯繫客服</a>';

    document.getElementById('upB').innerHTML = html;
    document.getElementById('upB').scrollTop = 0;
    if(window.payCardBind) window.payCardBind();
    w.classList.add('on');
  }

  window.upgradeSheet = {
    init: function(cfg){ CFG = cfg; },
    open: open,
    close: close,
    setEmail: function(e){ if(CFG) CFG.email = e; }
  };
})();

</script>
